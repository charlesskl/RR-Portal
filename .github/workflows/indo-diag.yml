name: Indo Shipping Diag

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "check=只读数量 / clear=按已核对范围备份并清空采购和出入库（保留走货）/ complete=现有排期采购已下、物料送完"
        type: choice
        options: [check, clear, complete, verify, backup]
        default: check
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-cloud
  queue: max
  cancel-in-progress: false

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate SSH host fingerprint
        shell: bash
        env:
          CLOUD_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
        run: |
          set -euo pipefail
          if [[ ! "$CLOUD_HOST_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]{43}=?$ ]]; then
            echo 'CLOUD_HOST_FINGERPRINT must be a non-empty OpenSSH SHA256 fingerprint.' >&2
            exit 1
          fi

      - name: Inspect purchase and stock records via SSH
        env:
          CLOUD_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
          OPS_MODE: ${{ inputs.mode }}
          OPS_REF: ${{ github.sha }}
          OPS_ACTOR: ${{ github.actor }}
          OPS_FINGERPRINT: '81a9d0a25dc4e270a6a7579d946f52d3'
          OPS_EXPECTED: '{"purchase_orders":40,"po_items":144,"po_receipts":98,"outbound":68,"shipment_links":10}'
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        with:
          host: ${{ secrets.CLOUD_HOST }}
          username: ${{ secrets.CLOUD_USER }}
          key: ${{ secrets.CLOUD_SSH_KEY }}
          fingerprint: ${{ env.CLOUD_HOST_FINGERPRINT }}
          command_timeout: 8m
          envs: OPS_MODE,OPS_REF,OPS_ACTOR,OPS_EXPECTED,OPS_FINGERPRINT
          script: |
            set -euo pipefail
            cd /opt/rr-portal
            if [[ "$OPS_MODE" == backup ]]; then
              umask 077
              mkdir -p deploy/backups
              backup="/opt/rr-portal/deploy/backups/indo-pre-906-$(date -u +%Y%m%dT%H%M%SZ).dump"
              docker compose -f docker-compose.cloud.yml --env-file .env.cloud.production exec -T db sh -c 'exec pg_dump -Fc --schema=indo_shipping -U "${POSTGRES_USER:-rrportal}" -d "${POSTGRES_DB:-rrportal}"' > "$backup"
              test -s "$backup"
              docker compose -f docker-compose.cloud.yml --env-file .env.cloud.production exec -T db pg_restore --list < "$backup" > /dev/null
              echo "Backup retained: $backup"
              sha256sum "$backup"
              exit 0
            fi
            if [[ "$OPS_MODE" == verify ]]; then
              [[ "$OPS_REF" =~ ^[a-f0-9]{40}$ ]] || exit 1
              git fetch origin ops/indo-purchase-clear-20261012
              directory=$(mktemp -d /tmp/indo-verify.XXXXXX)
              trap 'rm -rf "$directory"' EXIT
              git show "$OPS_REF:deploy/ops/verify-indo-completion.py" > "$directory/verify.py"
              python3 "$directory/verify.py"
              exit 0
            fi
            if [[ "$OPS_MODE" == clear || "$OPS_MODE" == complete ]]; then
              [[ "$OPS_REF" =~ ^[a-f0-9]{40}$ ]] || exit 1
              git fetch origin ops/indo-purchase-clear-20261012
              directory=$(mktemp -d /tmp/indo-clear.XXXXXX)
              trap 'rm -rf "$directory"' EXIT
              if [[ "$OPS_MODE" == complete ]]; then
                git show "$OPS_REF:deploy/ops/complete-indo-schedules.sh" > "$directory/clear.sh"
                git show "$OPS_REF:deploy/ops/complete-indo-schedules.sql" > "$directory/clear.sql"
              else
                git show "$OPS_REF:deploy/ops/clear-indo-purchases.sh" > "$directory/clear.sh"
                git show "$OPS_REF:deploy/ops/clear-indo-purchases.sql" > "$directory/clear.sql"
              fi
              export OPS_SQL_FILE="$directory/clear.sql"
              bash "$directory/clear.sh"
              exit 0
            fi
            [[ "$OPS_MODE" == check ]] || exit 1
            docker compose -f docker-compose.cloud.yml --env-file .env.cloud.production exec -T db sh -c 'exec psql -X -v ON_ERROR_STOP=1 -U "${POSTGRES_USER:-rrportal}" -d "${POSTGRES_DB:-rrportal}"' <<'SQL'
            BEGIN READ ONLY;
            SELECT jsonb_build_object(
              'purchase_orders', (SELECT COUNT(*) FROM indo_shipping.purchase_orders),
              'po_items', (SELECT COUNT(*) FROM indo_shipping.po_items),
              'po_receipts', (SELECT COUNT(*) FROM indo_shipping.po_receipts),
              'outbound', (SELECT COUNT(*) FROM indo_shipping.outbound),
              'shipment_links', (SELECT COUNT(*) FROM indo_shipping.shipment_items WHERE outbound_id IS NOT NULL),
              'shipments', (SELECT COUNT(*) FROM indo_shipping.shipments),
              'shipment_items', (SELECT COUNT(*) FROM indo_shipping.shipment_items),
              'products', (SELECT COUNT(*) FROM indo_shipping.products),
              'materials', (SELECT COUNT(*) FROM indo_shipping.materials),
              'suppliers', (SELECT COUNT(*) FROM indo_shipping.dict_supplier),
              'schedules', (SELECT COUNT(*) FROM indo_shipping.schedules)
            ) AS cleanup_preview;
            SELECT conrelid::regclass AS referencing_table, confrelid::regclass AS referenced_table, pg_get_constraintdef(oid) AS definition
            FROM pg_constraint WHERE contype='f'
              AND confrelid IN ('indo_shipping.purchase_orders'::regclass,'indo_shipping.po_items'::regclass,'indo_shipping.po_receipts'::regclass,'indo_shipping.outbound'::regclass);
            SELECT jsonb_build_object(
              'schedule_fingerprint', (SELECT md5(string_agg(id::text||':'||md5(COALESCE(raw_rows::text,'')), ',' ORDER BY id)) FROM indo_shipping.schedules),
              'valid_order_keys', (SELECT COUNT(DISTINCT (r->>'orderNo')||'|'||(r->>'code')) FROM indo_shipping.schedules s CROSS JOIN LATERAL jsonb_array_elements(s.raw_rows) r WHERE BTRIM(COALESCE(r->>'orderNo',''))<>'' AND BTRIM(COALESCE(r->>'code',''))<>''),
              'snapshot_count', (SELECT COUNT(*) FROM indo_shipping.schedules s WHERE EXISTS(SELECT 1 FROM indo_shipping.settings t WHERE key='material_tracking_completed_schedules' AND t.value::jsonb->>s.id::text=md5(s.raw_rows::text)))
            ) AS completion_preview;
            COMMIT;
            SQL
