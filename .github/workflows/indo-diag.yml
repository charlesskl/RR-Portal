name: Indo Shipping Diag

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Private schema backup / read-only PR916 verification (no raw logs)"
        type: choice
        options: [backup, verify]
        default: backup

permissions:
  contents: read

concurrency:
  group: deploy-cloud
  queue: max
  cancel-in-progress: false

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate SSH host fingerprint
        shell: bash
        env:
          CLOUD_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
        run: |
          set -euo pipefail
          if [[ ! "$CLOUD_HOST_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]{43}=?$ ]]; then
            echo 'CLOUD_HOST_FINGERPRINT must be a non-empty OpenSSH SHA256 fingerprint.' >&2
            exit 1
          fi

      - name: Private Indo backup or read-only deployment verification
        env:
          CLOUD_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
          INDO_OPS_MODE: ${{ inputs.mode }}
          INDO_OPS_REF: ${{ github.sha }}
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        with:
          host: ${{ secrets.CLOUD_HOST }}
          username: ${{ secrets.CLOUD_USER }}
          key: ${{ secrets.CLOUD_SSH_KEY }}
          fingerprint: ${{ env.CLOUD_HOST_FINGERPRINT }}
          command_timeout: 8m
          envs: INDO_OPS_MODE,INDO_OPS_REF
          script: |
            set -euo pipefail
            [[ "$INDO_OPS_MODE" =~ ^(backup|verify)$ && "$INDO_OPS_REF" =~ ^[a-f0-9]{40}$ ]] || exit 1
            cd /opt/rr-portal
            git fetch origin ops/indo-916-20261013 >/dev/null 2>&1 || { echo 'INDO_916_SCRIPT_FETCH_FAILED'; exit 1; }
            umask 077
            indo_temporary=$(mktemp -d /tmp/indo-916.XXXXXX)
            trap 'rm -rf "$indo_temporary"' EXIT
            git show "$INDO_OPS_REF:deploy/ops/indo-916.py" > "$indo_temporary/ops.py" 2>/dev/null || { echo 'INDO_916_SCRIPT_READ_FAILED'; exit 1; }
            python3 "$indo_temporary/ops.py" "$INDO_OPS_MODE"
