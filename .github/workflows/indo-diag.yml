name: Indo Shipping Diag

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Private schema/config backup / read-only PR923 or PR924 verification"
        type: choice
        options: [backup, verify, diagnose]
        default: backup
      phase:
        description: "PR being deployed (sequential phases)"
        type: choice
        options: ['923', '924']
        required: true
      before_commit:
        description: "Exact 40-character pre-deployment main SHA"
        type: string
        required: true
      target_commit:
        description: "Exact main SHA (same as before_commit for backup; merge SHA for verify)"
        type: string
        required: true
      backup_path:
        description: "Exact private backup directory returned by backup (required for verify)"
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: deploy-cloud
  queue: max
  cancel-in-progress: false

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate SSH host fingerprint
        shell: bash
        env:
          CLOUD_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
          INDO_OPS_MODE: ${{ inputs.mode }}
          INDO_OPS_PHASE: ${{ inputs.phase }}
          INDO_OPS_BEFORE: ${{ inputs.before_commit }}
          INDO_OPS_TARGET: ${{ inputs.target_commit }}
          INDO_OPS_BACKUP: ${{ inputs.backup_path }}
        run: |
          set -euo pipefail
          if [[ ! "$CLOUD_HOST_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]{43}=?$ ]]; then
            echo 'CLOUD_HOST_FINGERPRINT must be a non-empty OpenSSH SHA256 fingerprint.' >&2
            exit 1
          fi
          [[ "$INDO_OPS_MODE" =~ ^(backup|verify|diagnose)$ && "$INDO_OPS_PHASE" =~ ^(923|924)$ ]] || exit 1
          [[ "$INDO_OPS_BEFORE" =~ ^[a-f0-9]{40}$ && "$INDO_OPS_TARGET" =~ ^[a-f0-9]{40}$ ]] || exit 1
          if [[ "$INDO_OPS_MODE" = backup ]]; then
            [[ -z "$INDO_OPS_BACKUP" && "$INDO_OPS_BEFORE" = "$INDO_OPS_TARGET" ]] || exit 1
          else
            [[ "$INDO_OPS_BACKUP" =~ ^/opt/rr-portal/deploy/backups/indo-pre-(923|924)-[0-9]{8}T[0-9]{12}Z$ && "$INDO_OPS_BEFORE" != "$INDO_OPS_TARGET" ]] || exit 1
          fi

      - name: Private Indo backup or read-only deployment verification
        env:
          CLOUD_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
          INDO_OPS_MODE: ${{ inputs.mode }}
          INDO_OPS_REF: ${{ github.sha }}
          INDO_OPS_PHASE: ${{ inputs.phase }}
          INDO_OPS_BEFORE: ${{ inputs.before_commit }}
          INDO_OPS_TARGET: ${{ inputs.target_commit }}
          INDO_OPS_BACKUP: ${{ inputs.backup_path }}
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        with:
          host: ${{ secrets.CLOUD_HOST }}
          username: ${{ secrets.CLOUD_USER }}
          key: ${{ secrets.CLOUD_SSH_KEY }}
          fingerprint: ${{ env.CLOUD_HOST_FINGERPRINT }}
          command_timeout: 8m
          envs: INDO_OPS_MODE,INDO_OPS_REF,INDO_OPS_PHASE,INDO_OPS_BEFORE,INDO_OPS_TARGET,INDO_OPS_BACKUP
          script: |
            set -euo pipefail
            [[ "$INDO_OPS_MODE" =~ ^(backup|verify|diagnose)$ && "$INDO_OPS_REF" =~ ^[a-f0-9]{40}$ ]] || exit 1
            [[ "$INDO_OPS_PHASE" =~ ^(923|924)$ && "$INDO_OPS_BEFORE" =~ ^[a-f0-9]{40}$ && "$INDO_OPS_TARGET" =~ ^[a-f0-9]{40}$ ]] || exit 1
            if [[ "$INDO_OPS_MODE" = backup ]]; then
              [[ -z "$INDO_OPS_BACKUP" && "$INDO_OPS_BEFORE" = "$INDO_OPS_TARGET" ]] || exit 1
            else
              [[ "$INDO_OPS_BACKUP" =~ ^/opt/rr-portal/deploy/backups/indo-pre-(923|924)-[0-9]{8}T[0-9]{12}Z$ && "$INDO_OPS_BEFORE" != "$INDO_OPS_TARGET" ]] || exit 1
            fi
            cd /opt/rr-portal
            git fetch origin main ops/indo-923-924-20261014 >/dev/null 2>&1 || { echo 'INDO_923_924_SCRIPT_FETCH_FAILED'; exit 1; }
            umask 077
            indo_temporary=$(mktemp -d /tmp/indo-923-924.XXXXXX)
            trap 'rm -rf "$indo_temporary"' EXIT
            git show "$INDO_OPS_REF:deploy/ops/indo-923-924.py" > "$indo_temporary/ops.py" 2>/dev/null || { echo 'INDO_923_924_SCRIPT_READ_FAILED'; exit 1; }
            python3 "$indo_temporary/ops.py" "$INDO_OPS_MODE" "$INDO_OPS_PHASE" "$INDO_OPS_BEFORE" "$INDO_OPS_TARGET" "$INDO_OPS_BACKUP"
