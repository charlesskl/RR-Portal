name: PR929 Internal Quote Private Backup and Read-only Verification

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'internal-quote only: backup, strict verification or read-only audit diagnosis'
        type: choice
        required: true
        options: [backup, verify, diagnose-audit]
        default: backup
      before_commit:
        description: 'Exact pre-deployment main SHA'
        type: string
        required: true
        default: '4edd6ac6a4148bd8dc2adf003f87580bd0873bb2'
      target_commit:
        description: 'Exact main SHA; same as before_commit for preflight/backup'
        type: string
        required: true
      backup_path:
        description: 'Exact private backup path returned by backup; verify only'
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: deploy-cloud
  queue: max
  cancel-in-progress: false

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate exact branch, SHA arguments and SSH fingerprint
        shell: bash
        env:
          CLOUD_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
          IQ_OPS_BRANCH: ${{ github.ref }}
          IQ_OPS_REF: ${{ github.sha }}
          IQ_OPS_MODE: ${{ inputs.mode }}
          IQ_OPS_BEFORE: ${{ inputs.before_commit }}
          IQ_OPS_TARGET: ${{ inputs.target_commit }}
          IQ_OPS_BACKUP: ${{ inputs.backup_path }}
        run: |
          set -euo pipefail
          [[ "$IQ_OPS_BRANCH" = refs/heads/ops/internal-quote-929-20261016 ]] || exit 1
          [[ "$CLOUD_HOST_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]{43}=?$ ]] || exit 1
          [[ "$IQ_OPS_REF" =~ ^[a-f0-9]{40}$ && "$IQ_OPS_MODE" =~ ^(backup|verify|diagnose-audit)$ ]] || exit 1
          [[ "$IQ_OPS_BEFORE" = 4edd6ac6a4148bd8dc2adf003f87580bd0873bb2 && "$IQ_OPS_TARGET" =~ ^[a-f0-9]{40}$ ]] || exit 1
          if [[ "$IQ_OPS_MODE" = diagnose-audit ]]; then
            [[ "$IQ_OPS_TARGET" = 8dd079e159ba595e91702673fe0cbf1aacf2604a && "$IQ_OPS_BACKUP" = /opt/rr-portal/deploy/backups/internal-quote-pre-929-20261016T002228875402Z ]] || exit 1
          elif [[ "$IQ_OPS_MODE" = verify ]]; then
            [[ "$IQ_OPS_TARGET" != "$IQ_OPS_BEFORE" && "$IQ_OPS_BACKUP" =~ ^/opt/rr-portal/deploy/backups/internal-quote-pre-929-[0-9]{8}T[0-9]{12}Z$ ]] || exit 1
          else
            [[ "$IQ_OPS_TARGET" = "$IQ_OPS_BEFORE" && -z "$IQ_OPS_BACKUP" ]] || exit 1
          fi

      - name: Fixed internal-quote private backup or read-only verification
        env:
          CLOUD_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
          IQ_OPS_BRANCH: ${{ github.ref }}
          IQ_OPS_REF: ${{ github.sha }}
          IQ_OPS_MODE: ${{ inputs.mode }}
          IQ_OPS_BEFORE: ${{ inputs.before_commit }}
          IQ_OPS_TARGET: ${{ inputs.target_commit }}
          IQ_OPS_BACKUP: ${{ inputs.backup_path }}
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        with:
          host: ${{ secrets.CLOUD_HOST }}
          username: ${{ secrets.CLOUD_USER }}
          key: ${{ secrets.CLOUD_SSH_KEY }}
          fingerprint: ${{ env.CLOUD_HOST_FINGERPRINT }}
          command_timeout: 12m
          envs: IQ_OPS_BRANCH,IQ_OPS_REF,IQ_OPS_MODE,IQ_OPS_BEFORE,IQ_OPS_TARGET,IQ_OPS_BACKUP
          script: |
            set -euo pipefail
            [[ "$IQ_OPS_BRANCH" = refs/heads/ops/internal-quote-929-20261016 ]] || exit 1
            [[ "$IQ_OPS_REF" =~ ^[a-f0-9]{40}$ && "$IQ_OPS_MODE" =~ ^(backup|verify|diagnose-audit)$ ]] || exit 1
            [[ "$IQ_OPS_BEFORE" = 4edd6ac6a4148bd8dc2adf003f87580bd0873bb2 && "$IQ_OPS_TARGET" =~ ^[a-f0-9]{40}$ ]] || exit 1
            if [[ "$IQ_OPS_MODE" = diagnose-audit ]]; then
              [[ "$IQ_OPS_TARGET" = 8dd079e159ba595e91702673fe0cbf1aacf2604a && "$IQ_OPS_BACKUP" = /opt/rr-portal/deploy/backups/internal-quote-pre-929-20261016T002228875402Z ]] || exit 1
            elif [[ "$IQ_OPS_MODE" = verify ]]; then
              [[ "$IQ_OPS_TARGET" != "$IQ_OPS_BEFORE" && "$IQ_OPS_BACKUP" =~ ^/opt/rr-portal/deploy/backups/internal-quote-pre-929-[0-9]{8}T[0-9]{12}Z$ ]] || exit 1
            else
              [[ "$IQ_OPS_TARGET" = "$IQ_OPS_BEFORE" && -z "$IQ_OPS_BACKUP" ]] || exit 1
            fi
            cd /opt/rr-portal
            git fetch origin main ops/internal-quote-929-20261016 >/dev/null 2>&1 || { echo 'IQ_929_SCRIPT_FETCH_FAILED'; exit 1; }
            umask 077
            rr_temporary=$(mktemp -d /tmp/iq-929.XXXXXX)
            trap 'rm -rf "$rr_temporary"' EXIT
            git show "$IQ_OPS_REF:deploy/ops/internal-quote-929.py" > "$rr_temporary/ops.py" 2>/dev/null || { echo 'IQ_929_SCRIPT_READ_FAILED'; exit 1; }
            git show "$IQ_OPS_REF:deploy/ops/internal-quote-929-source.json" > "$rr_temporary/source.json" 2>/dev/null || { echo 'IQ_929_SOURCE_PIN_READ_FAILED'; exit 1; }
            if [[ "$IQ_OPS_MODE" = diagnose-audit ]]; then
              git show "$IQ_OPS_REF:deploy/ops/internal-quote-929-audit.py" > "$rr_temporary/audit.py" 2>/dev/null || { echo 'IQ_929_AUDIT_SCRIPT_READ_FAILED'; exit 1; }
              python3 "$rr_temporary/audit.py" "$IQ_OPS_MODE" "$IQ_OPS_BEFORE" "$IQ_OPS_TARGET" "$IQ_OPS_BACKUP" "$rr_temporary/source.json"
            else
              python3 "$rr_temporary/ops.py" "$IQ_OPS_MODE" "$IQ_OPS_BEFORE" "$IQ_OPS_TARGET" "$IQ_OPS_BACKUP" "$rr_temporary/source.json"
            fi
