name: Indo Shipping Diag

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-cloud
  queue: max
  cancel-in-progress: false

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate SSH host fingerprint
        shell: bash
        env:
          CLOUD_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
        run: |
          set -euo pipefail
          if [[ ! "$CLOUD_HOST_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]{43}=?$ ]]; then
            echo 'CLOUD_HOST_FINGERPRINT must be a non-empty OpenSSH SHA256 fingerprint.' >&2
            exit 1
          fi

      - name: Inspect purchase and stock records via SSH
        env:
          CLOUD_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        with:
          host: ${{ secrets.CLOUD_HOST }}
          username: ${{ secrets.CLOUD_USER }}
          key: ${{ secrets.CLOUD_SSH_KEY }}
          fingerprint: ${{ env.CLOUD_HOST_FINGERPRINT }}
          command_timeout: 5m
          script: |
            set -euo pipefail
            cd /opt/rr-portal
            docker compose -f docker-compose.cloud.yml --env-file .env.cloud.production exec -T db sh -c 'exec psql -X -v ON_ERROR_STOP=1 -U "${POSTGRES_USER:-rrportal}" -d "${POSTGRES_DB:-rrportal}"' <<'SQL'
            BEGIN READ ONLY;
            SELECT jsonb_build_object(
              'purchase_orders', (SELECT COUNT(*) FROM indo_shipping.purchase_orders),
              'po_items', (SELECT COUNT(*) FROM indo_shipping.po_items),
              'po_receipts', (SELECT COUNT(*) FROM indo_shipping.po_receipts),
              'outbound', (SELECT COUNT(*) FROM indo_shipping.outbound),
              'shipment_links', (SELECT COUNT(*) FROM indo_shipping.shipment_items WHERE outbound_id IS NOT NULL),
              'shipments', (SELECT COUNT(*) FROM indo_shipping.shipments),
              'shipment_items', (SELECT COUNT(*) FROM indo_shipping.shipment_items),
              'products', (SELECT COUNT(*) FROM indo_shipping.products),
              'materials', (SELECT COUNT(*) FROM indo_shipping.materials),
              'suppliers', (SELECT COUNT(*) FROM indo_shipping.dict_supplier),
              'schedules', (SELECT COUNT(*) FROM indo_shipping.schedules)
            ) AS cleanup_preview;
            SELECT conrelid::regclass AS referencing_table, confrelid::regclass AS referenced_table, pg_get_constraintdef(oid) AS definition
            FROM pg_constraint WHERE contype='f'
              AND confrelid IN ('indo_shipping.purchase_orders'::regclass,'indo_shipping.po_items'::regclass,'indo_shipping.po_receipts'::regclass,'indo_shipping.outbound'::regclass);
            COMMIT;
            SQL
