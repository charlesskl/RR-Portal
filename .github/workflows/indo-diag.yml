name: PR940 PrintLink Private Backup and Read-only Verification

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'printlink only: private backup or read-only verification'
        type: choice
        required: true
        options: [backup, verify]
        default: backup
      before_commit:
        description: 'Exact pre-deployment main SHA'
        type: string
        required: true
        default: '1510ca5f5f7e8a6132075400e50a36710f1447c0'
      target_commit:
        description: 'Exact main SHA; same as before_commit for preflight/backup'
        type: string
        required: true
      backup_path:
        description: 'Exact private backup path returned by backup; verify only'
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: deploy-cloud
  queue: max
  cancel-in-progress: false

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate exact branch, SHA arguments and SSH fingerprint
        shell: bash
        env:
          CLOUD_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
          PRINTLINK_OPS_BRANCH: ${{ github.ref }}
          PRINTLINK_OPS_REF: ${{ github.sha }}
          PRINTLINK_OPS_MODE: ${{ inputs.mode }}
          PRINTLINK_OPS_BEFORE: ${{ inputs.before_commit }}
          PRINTLINK_OPS_TARGET: ${{ inputs.target_commit }}
          PRINTLINK_OPS_BACKUP: ${{ inputs.backup_path }}
        run: |
          set -euo pipefail
          [[ "$PRINTLINK_OPS_BRANCH" = refs/heads/ops/printlink-940-20261019 ]] || exit 1
          [[ "$CLOUD_HOST_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]{43}=?$ ]] || exit 1
          [[ "$PRINTLINK_OPS_REF" =~ ^[a-f0-9]{40}$ && "$PRINTLINK_OPS_MODE" =~ ^(backup|verify)$ ]] || exit 1
          [[ "$PRINTLINK_OPS_BEFORE" = 1510ca5f5f7e8a6132075400e50a36710f1447c0 && "$PRINTLINK_OPS_TARGET" =~ ^[a-f0-9]{40}$ ]] || exit 1
          if [[ "$PRINTLINK_OPS_MODE" != backup ]]; then
            [[ "$PRINTLINK_OPS_TARGET" != "$PRINTLINK_OPS_BEFORE" && "$PRINTLINK_OPS_BACKUP" =~ ^/opt/rr-portal/deploy/backups/printlink-pre-940-[0-9]{8}T[0-9]{12}Z$ ]] || exit 1
          else
            [[ "$PRINTLINK_OPS_TARGET" = "$PRINTLINK_OPS_BEFORE" && -z "$PRINTLINK_OPS_BACKUP" ]] || exit 1
          fi

      - name: Fixed printlink private backup or read-only verification
        env:
          CLOUD_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
          PRINTLINK_OPS_BRANCH: ${{ github.ref }}
          PRINTLINK_OPS_REF: ${{ github.sha }}
          PRINTLINK_OPS_MODE: ${{ inputs.mode }}
          PRINTLINK_OPS_BEFORE: ${{ inputs.before_commit }}
          PRINTLINK_OPS_TARGET: ${{ inputs.target_commit }}
          PRINTLINK_OPS_BACKUP: ${{ inputs.backup_path }}
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        with:
          host: ${{ secrets.CLOUD_HOST }}
          username: ${{ secrets.CLOUD_USER }}
          key: ${{ secrets.CLOUD_SSH_KEY }}
          fingerprint: ${{ env.CLOUD_HOST_FINGERPRINT }}
          command_timeout: 12m
          envs: PRINTLINK_OPS_BRANCH,PRINTLINK_OPS_REF,PRINTLINK_OPS_MODE,PRINTLINK_OPS_BEFORE,PRINTLINK_OPS_TARGET,PRINTLINK_OPS_BACKUP
          script: |
            set -euo pipefail
            [[ "$PRINTLINK_OPS_BRANCH" = refs/heads/ops/printlink-940-20261019 ]] || exit 1
            [[ "$PRINTLINK_OPS_REF" =~ ^[a-f0-9]{40}$ && "$PRINTLINK_OPS_MODE" =~ ^(backup|verify)$ ]] || exit 1
            [[ "$PRINTLINK_OPS_BEFORE" = 1510ca5f5f7e8a6132075400e50a36710f1447c0 && "$PRINTLINK_OPS_TARGET" =~ ^[a-f0-9]{40}$ ]] || exit 1
            if [[ "$PRINTLINK_OPS_MODE" != backup ]]; then
              [[ "$PRINTLINK_OPS_TARGET" != "$PRINTLINK_OPS_BEFORE" && "$PRINTLINK_OPS_BACKUP" =~ ^/opt/rr-portal/deploy/backups/printlink-pre-940-[0-9]{8}T[0-9]{12}Z$ ]] || exit 1
            else
              [[ "$PRINTLINK_OPS_TARGET" = "$PRINTLINK_OPS_BEFORE" && -z "$PRINTLINK_OPS_BACKUP" ]] || exit 1
            fi
            cd /opt/rr-portal
            git fetch origin main ops/printlink-940-20261019 refs/pull/940/head >/dev/null 2>&1 || { echo 'PRINTLINK_940_SCRIPT_FETCH_FAILED'; exit 1; }
            [[ "$(git rev-parse origin/ops/printlink-940-20261019)" = "$PRINTLINK_OPS_REF" ]] || exit 1
            umask 077
            rr_temporary=$(mktemp -d /tmp/printlink-940.XXXXXX)
            trap 'rm -rf "$rr_temporary"' EXIT
            git show "$PRINTLINK_OPS_REF:deploy/ops/printlink-940.py" > "$rr_temporary/ops.py" 2>/dev/null || { echo 'PRINTLINK_940_SCRIPT_READ_FAILED'; exit 1; }
            git show "$PRINTLINK_OPS_REF:deploy/ops/printlink-940-source.json" > "$rr_temporary/source.json" 2>/dev/null || { echo 'PRINTLINK_940_SOURCE_PIN_READ_FAILED'; exit 1; }
            python3 "$rr_temporary/ops.py" "$PRINTLINK_OPS_MODE" "$PRINTLINK_OPS_BEFORE" "$PRINTLINK_OPS_TARGET" "$PRINTLINK_OPS_BACKUP" "$rr_temporary/source.json"
