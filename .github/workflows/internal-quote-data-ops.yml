name: Internal Quote PR922 Diag

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Private PostgreSQL/uploads/config backup or read-only PR922 verification"
        type: choice
        required: true
        options: [backup, verify]
        default: backup

permissions:
  contents: read

concurrency:
  group: deploy-cloud
  queue: max
  cancel-in-progress: false

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate SSH host fingerprint
        shell: bash
        env:
          CLOUD_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
        run: |
          set -euo pipefail
          if [[ ! "$CLOUD_HOST_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]{43}=?$ ]]; then
            echo 'CLOUD_HOST_FINGERPRINT must be a non-empty OpenSSH SHA256 fingerprint.' >&2
            exit 1
          fi

      - name: Private quote backup or read-only deployment verification
        env:
          CLOUD_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
          IQ_OPS_MODE: ${{ inputs.mode }}
          IQ_OPS_REF: ${{ github.sha }}
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        with:
          host: ${{ secrets.CLOUD_HOST }}
          username: ${{ secrets.CLOUD_USER }}
          key: ${{ secrets.CLOUD_SSH_KEY }}
          fingerprint: ${{ env.CLOUD_HOST_FINGERPRINT }}
          command_timeout: 12m
          envs: IQ_OPS_MODE,IQ_OPS_REF
          script: |
            set -euo pipefail
            [[ "$IQ_OPS_MODE" =~ ^(backup|verify)$ && "$IQ_OPS_REF" =~ ^[a-f0-9]{40}$ ]] || exit 1
            cd /opt/rr-portal
            git fetch origin ops/internal-quote-922-20261014 >/dev/null 2>&1 || { echo 'IQ_922_SCRIPT_FETCH_FAILED'; exit 1; }
            umask 077
            iq_temporary=$(mktemp -d /tmp/internal-quote-922.XXXXXX)
            trap 'rm -rf "$iq_temporary"' EXIT
            git show "$IQ_OPS_REF:deploy/ops/internal-quote-922.py" > "$iq_temporary/ops.py" 2>/dev/null || { echo 'IQ_922_SCRIPT_READ_FAILED'; exit 1; }
            python3 "$iq_temporary/ops.py" "$IQ_OPS_MODE"
