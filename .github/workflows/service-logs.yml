name: Service Logs - Fixed Reviewed Seven-Service Recovery V3
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        required: true
        options: [deploy]
permissions:
  contents: read
  actions: read
concurrency:
  group: deploy-cloud
  queue: max
  cancel-in-progress: false
env:
  RELEASE_DEPLOY_WORKFLOW_FROZEN: 'true'
  RELEASE_DEPLOY_HELPER_SHA256: '40f501d28bcc0fdbbca630be41440b1d2a7f9b89eec2fd0b7a0ee7f81a0ecc01'
jobs:
  deploy-reviewed-scope:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Validate frozen source and disabled regular deployment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_BRANCH: ${{ github.ref }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_ATTEMPT: ${{ github.run_attempt }}
          RELEASE_MODE: ${{ inputs.mode }}
          CLOUD_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_DEPLOY_WORKFLOW_FROZEN" = true && "$RELEASE_DEPLOY_HELPER_SHA256" =~ ^[a-f0-9]{64}$ ]] || exit 1
          [[ "$RELEASE_BRANCH" = refs/heads/ops/release-937-943-944-945-946-950-20261019 && "$RELEASE_ATTEMPT" = 1 && "$RELEASE_MODE" = deploy ]] || exit 1
          [[ "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ && "$CLOUD_HOST_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]{43}=?$ ]] || exit 1
          gh api "repos/$GH_REPO/actions/workflows/deploy.yml" > "$RUNNER_TEMP/regular-deploy-state.json"
          python3 -c 'import json,sys; assert json.load(open(sys.argv[1]))["state"]=="disabled_manually"' "$RUNNER_TEMP/regular-deploy-state.json"
          for state in queued in_progress waiting requested pending; do
            gh api --method GET "repos/$GH_REPO/actions/workflows/deploy.yml/runs" -f status="$state" -f per_page=1 > "$RUNNER_TEMP/regular-deploy-runs.json"
            python3 -c 'import json,sys; assert json.load(open(sys.argv[1]))["total_count"]==0' "$RUNNER_TEMP/regular-deploy-runs.json"
          done
      - name: Deploy only the fixed seven services
        env:
          CLOUD_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
          RELEASE_BRANCH: ${{ github.ref }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_ATTEMPT: ${{ github.run_attempt }}
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        with:
          host: ${{ secrets.CLOUD_HOST }}
          username: ${{ secrets.CLOUD_USER }}
          key: ${{ secrets.CLOUD_SSH_KEY }}
          fingerprint: ${{ env.CLOUD_HOST_FINGERPRINT }}
          command_timeout: 110m
          envs: RELEASE_BRANCH,RELEASE_SHA,RELEASE_ATTEMPT,RELEASE_DEPLOY_WORKFLOW_FROZEN,RELEASE_DEPLOY_HELPER_SHA256
          script: |
            set -euo pipefail
            [[ "$RELEASE_DEPLOY_WORKFLOW_FROZEN" = true && "$RELEASE_DEPLOY_HELPER_SHA256" =~ ^[a-f0-9]{64}$ ]] || exit 1
            [[ "$RELEASE_BRANCH" = refs/heads/ops/release-937-943-944-945-946-950-20261019 && "$RELEASE_ATTEMPT" = 1 && "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]] || exit 1
            cd /opt/rr-portal
            timeout --signal=TERM --kill-after=2s 60s git -c core.hooksPath=/dev/null fetch origin ops/release-937-943-944-945-946-950-20261019 >/dev/null 2>&1 || exit 1
            [[ "$(git rev-parse FETCH_HEAD)" = "$RELEASE_SHA" ]] || exit 1
            umask 077
            scoped_release_tmp=$(mktemp -d /tmp/scoped-release.XXXXXX)
            trap 'rm -rf "$scoped_release_tmp"' EXIT
            git show "$RELEASE_SHA:deploy/ops/release-batch-scoped-deploy-v3.py" > "$scoped_release_tmp/run.py" 2>/dev/null || exit 1
            git show "$RELEASE_SHA:deploy/ops/release-937-943-944-945-946-950.py" > "$scoped_release_tmp/release-data-ops-library.py" 2>/dev/null || exit 1
            git show "$RELEASE_SHA:deploy/ops/release-data-library.py" > "$scoped_release_tmp/release-data-library.py" 2>/dev/null || exit 1
            [[ "$(sha256sum "$scoped_release_tmp/run.py" | cut -d ' ' -f1)" = "$RELEASE_DEPLOY_HELPER_SHA256" ]] || exit 1
            [[ "$(sha256sum "$scoped_release_tmp/release-data-ops-library.py" | cut -d ' ' -f1)" = ff9138a1d5bfed1b10077112da6ebcda2d65240f583e2d0e12ce1325cfbaafd5 ]] || exit 1
            [[ "$(sha256sum "$scoped_release_tmp/release-data-library.py" | cut -d ' ' -f1)" = d63168fd3057f4f2aba2d93f9fab31d2d65c6dd0f3234877d71fcff1e04e62b9 ]] || exit 1
            timeout --signal=TERM --kill-after=30s 105m python3 -B "$scoped_release_tmp/run.py"
      - name: Report explicit regular-workflow restoration requirement
        if: always()
        shell: bash
        run: |
          echo 'MANUAL_ATTENTION: After inspecting this result, the release owner must re-enable deploy.yml and verify its state. This read-only-token workflow cannot enable it.'
