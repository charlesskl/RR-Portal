name: PR 1039 Scoped ZURU Release
on:
  workflow_dispatch:
    inputs:
      mode: {type: choice, required: true, options: [prepare]}
permissions:
  contents: read
concurrency:
  group: deploy-cloud
  queue: max
  cancel-in-progress: false
env:
  SCOPED_RELEASE_WORKFLOW_PIN: 'true'
  SCOPED_RELEASE_HELPER_SHA256: 'd99b9c688deab1e6e5d2ad2edde766d6f70574dbfdcb7f5afd222417d1421e8d'
jobs:
  fixed-zuru-phase:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Validate exact reviewed phase and SSH host fingerprint
        shell: bash
        env:
          RELEASE_BRANCH: ${{ github.ref }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_ATTEMPT: ${{ github.run_attempt }}
          RELEASE_MODE: ${{ inputs.mode }}
          CLOUD_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
        run: |
          set -euo pipefail
          [[ "$SCOPED_RELEASE_WORKFLOW_PIN" = true && "$SCOPED_RELEASE_HELPER_SHA256" = d99b9c688deab1e6e5d2ad2edde766d6f70574dbfdcb7f5afd222417d1421e8d ]] || exit 1
          [[ "$RELEASE_BRANCH" = refs/heads/ops/pr-1039-20261029-zuru && "$RELEASE_ATTEMPT" = 1 && "$RELEASE_MODE" = prepare && "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]] || exit 1
          [[ "$CLOUD_HOST_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]{43}=?$ ]] || exit 1
      - name: Run exact ZURU prepare helper
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        env:
          RELEASE_BRANCH: ${{ github.ref }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_ATTEMPT: ${{ github.run_attempt }}
          RELEASE_MODE: ${{ inputs.mode }}
          CLOUD_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
        with:
          host: ${{ secrets.CLOUD_HOST }}
          username: ${{ secrets.CLOUD_USER }}
          key: ${{ secrets.CLOUD_SSH_KEY }}
          fingerprint: ${{ env.CLOUD_HOST_FINGERPRINT }}
          command_timeout: 24m
          envs: RELEASE_BRANCH,RELEASE_SHA,RELEASE_ATTEMPT,RELEASE_MODE,SCOPED_RELEASE_WORKFLOW_PIN,SCOPED_RELEASE_HELPER_SHA256
          script: |
            set -euo pipefail
            [[ "$SCOPED_RELEASE_WORKFLOW_PIN" = true && "$SCOPED_RELEASE_HELPER_SHA256" = d99b9c688deab1e6e5d2ad2edde766d6f70574dbfdcb7f5afd222417d1421e8d ]] || exit 1
            [[ "$RELEASE_BRANCH" = refs/heads/ops/pr-1039-20261029-zuru && "$RELEASE_ATTEMPT" = 1 && "$RELEASE_MODE" = prepare && "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]] || exit 1
            cd /opt/rr-portal
            timeout --signal=TERM --kill-after=2s 60s git -c core.hooksPath=/dev/null fetch --no-write-fetch-head origin +refs/heads/ops/pr-1039-20261029-zuru:refs/remotes/origin/ops/pr-1039-20261029-zuru >/dev/null 2>&1 || exit 1
            [[ "$(git rev-parse refs/remotes/origin/ops/pr-1039-20261029-zuru)" = "$RELEASE_SHA" ]] || exit 1
            umask 077
            zuru_tmp=$(mktemp -d /tmp/pr1039-zuru.XXXXXX)
            trap 'rm -rf "$zuru_tmp"' EXIT
            git show "$RELEASE_SHA:deploy/ops/pr1039-zuru-release.py" > "$zuru_tmp/run.py" 2>/dev/null || exit 1
            [[ "$(sha256sum "$zuru_tmp/run.py" | cut -d ' ' -f1)" = d99b9c688deab1e6e5d2ad2edde766d6f70574dbfdcb7f5afd222417d1421e8d ]] || exit 1
            git show "$RELEASE_SHA:deploy/ops/pr1039-zuru-preflight.py" > "$zuru_tmp/pr1039-zuru-preflight.py" 2>/dev/null || exit 1
            [[ "$(sha256sum "$zuru_tmp/pr1039-zuru-preflight.py" | cut -d ' ' -f1)" = 6cc564926777e9a042cc80a23598838917b6e1518bb378b4576e81dbda8d2367 ]] || exit 1
            git show "$RELEASE_SHA:deploy/ops/pr1035-quote-preflight.py" > "$zuru_tmp/pr1035-quote-preflight.py" 2>/dev/null || exit 1
            [[ "$(sha256sum "$zuru_tmp/pr1035-quote-preflight.py" | cut -d ' ' -f1)" = 2b2739aa00cad03bfce8472b7416d725364b8d4ed354a5a7e9ca905a47aaffa5 ]] || exit 1
            git show "$RELEASE_SHA:deploy/ops/pr1030-engineering-preflight.py" > "$zuru_tmp/pr1030-engineering-preflight.py" 2>/dev/null || exit 1
            [[ "$(sha256sum "$zuru_tmp/pr1030-engineering-preflight.py" | cut -d ' ' -f1)" = 3d06b2aef715f75740826ff75f91c1cb78e0927e030717795ef2733f0595a4d0 ]] || exit 1
            git show "$RELEASE_SHA:deploy/ops/batch1003-image-library.py" > "$zuru_tmp/batch1003-image-library.py" 2>/dev/null || exit 1
            [[ "$(sha256sum "$zuru_tmp/batch1003-image-library.py" | cut -d ' ' -f1)" = 94d9dc30f1e21ee1346f89ac231bbc28ebc21d210d08298f54c56cc0103fab02 ]] || exit 1
            timeout --signal=TERM --kill-after=30s 22m python3 -B "$zuru_tmp/run.py" prepare
