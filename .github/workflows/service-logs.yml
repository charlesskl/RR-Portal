name: VoyagePlex Exact Seven Failed Mail Readonly Raw Capture
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: voyageplex-maildiag-20261019
  queue: max
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate fixed branch and SSH fingerprint
        shell: bash
        env:
          CLOUD_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
          MAILDIAG_BRANCH: ${{ github.ref }}
          MAILDIAG_REF: ${{ github.sha }}
          MAILDIAG_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          [[ "$MAILDIAG_BRANCH" = refs/heads/ops/voyageplex-maildiag-20261019 && "$MAILDIAG_ATTEMPT" = 1 ]] || exit 1
          [[ "$MAILDIAG_REF" =~ ^[a-f0-9]{40}$ && "$CLOUD_HOST_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]{43}=?$ ]] || exit 1
      - name: Fixed exact UID readonly raw capture
        env:
          CLOUD_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
          MAILDIAG_BRANCH: ${{ github.ref }}
          MAILDIAG_REF: ${{ github.sha }}
          MAILDIAG_ATTEMPT: ${{ github.run_attempt }}
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        with:
          host: ${{ secrets.CLOUD_HOST }}
          username: ${{ secrets.CLOUD_USER }}
          key: ${{ secrets.CLOUD_SSH_KEY }}
          fingerprint: ${{ env.CLOUD_HOST_FINGERPRINT }}
          command_timeout: 8m
          envs: MAILDIAG_BRANCH,MAILDIAG_REF,MAILDIAG_ATTEMPT
          script: |
            set -euo pipefail
            [[ "$MAILDIAG_BRANCH" = refs/heads/ops/voyageplex-maildiag-20261019 && "$MAILDIAG_ATTEMPT" = 1 ]] || exit 1
            [[ "$MAILDIAG_REF" =~ ^[a-f0-9]{40}$ ]] || exit 1
            cd /opt/rr-portal
            timeout --signal=TERM --kill-after=2s 60s git fetch origin ops/voyageplex-maildiag-20261019 >/dev/null 2>&1 || { echo 'MAILDIAG_FIXED_SCRIPT_FETCH_FAILED'; exit 1; }
            [[ "$(git rev-parse FETCH_HEAD)" = "$MAILDIAG_REF" ]] || { echo MAILDIAG_FIXED_HEAD_MISMATCH; exit 1; }
            umask 077
            mailbox_diagnostic_tmp=$(mktemp -d /tmp/maildiag-current-raw.XXXXXX)
            trap 'rm -rf "$mailbox_diagnostic_tmp"' EXIT
            git show "$MAILDIAG_REF:deploy/ops/voyageplex-current-failed-raw.py" > "$mailbox_diagnostic_tmp/run.py" 2>/dev/null || { echo 'MAILDIAG_FIXED_SCRIPT_READ_FAILED'; exit 1; }
            timeout --signal=TERM --kill-after=3s 365s python3 "$mailbox_diagnostic_tmp/run.py"
