name: PR 960 966 967 968 Sealed Voyage Difference Classification
on:
  workflow_dispatch:
    inputs:
      mode: {type: choice, required: true, options: [classify]}
permissions:
  contents: read
concurrency:
  group: deploy-cloud
  queue: max
  cancel-in-progress: false
env:
  SEALED_CLASSIFY_WORKFLOW_PIN: 'true'
  SEALED_CLASSIFY_HELPER_SHA256: '1a646fd2e6eb4fe2b315aaf7322bbdd29596841cbc5147b6f2e5e83d4b346452'
jobs:
  fixed-sealed-voyage-classification:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Validate fixed source and first attempt
        shell: bash
        env:
          RELEASE_BRANCH: ${{ github.ref }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_ATTEMPT: ${{ github.run_attempt }}
          RELEASE_MODE: ${{ inputs.mode }}
          CLOUD_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
        run: |
          set -euo pipefail
          [[ "$SEALED_CLASSIFY_WORKFLOW_PIN" = true && "$SEALED_CLASSIFY_HELPER_SHA256" =~ ^[a-f0-9]{64}$ ]] || exit 1
          [[ "$RELEASE_BRANCH" = refs/heads/ops/batch-960-966-967-968-20261020 && "$RELEASE_ATTEMPT" = 1 && "$RELEASE_MODE" = classify ]] || exit 1
          [[ "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ && "$CLOUD_HOST_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]{43}=?$ ]] || exit 1
      - name: Classify sealed Voyage differences without database or service mutation
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        env:
          RELEASE_BRANCH: ${{ github.ref }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_ATTEMPT: ${{ github.run_attempt }}
          RELEASE_MODE: ${{ inputs.mode }}
          CLOUD_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
        with:
          host: ${{ secrets.CLOUD_HOST }}
          username: ${{ secrets.CLOUD_USER }}
          key: ${{ secrets.CLOUD_SSH_KEY }}
          fingerprint: ${{ env.CLOUD_HOST_FINGERPRINT }}
          command_timeout: 32m
          envs: RELEASE_BRANCH,RELEASE_SHA,RELEASE_ATTEMPT,RELEASE_MODE,SEALED_CLASSIFY_WORKFLOW_PIN,SEALED_CLASSIFY_HELPER_SHA256
          script: |
            set -euo pipefail
            [[ "$SEALED_CLASSIFY_WORKFLOW_PIN" = true && "$SEALED_CLASSIFY_HELPER_SHA256" =~ ^[a-f0-9]{64}$ ]] || exit 1
            [[ "$RELEASE_BRANCH" = refs/heads/ops/batch-960-966-967-968-20261020 && "$RELEASE_ATTEMPT" = 1 && "$RELEASE_MODE" = classify && "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]] || exit 1
            cd /opt/rr-portal
            timeout --signal=TERM --kill-after=2s 60s git -c core.hooksPath=/dev/null fetch origin ops/batch-960-966-967-968-20261020 >/dev/null 2>&1 || exit 1
            [[ "$(git rev-parse FETCH_HEAD)" = "$RELEASE_SHA" ]] || exit 1
            umask 077
            batch_backup_tmp=$(mktemp -d /tmp/batch-960-966-967-968-backup.XXXXXX)
            trap 'rm -rf "$batch_backup_tmp"' EXIT
            git show "$RELEASE_SHA:deploy/ops/batch-voyageplex-sealed-classify.py" > "$batch_backup_tmp/run.py" 2>/dev/null || exit 1
            [[ "$(sha256sum "$batch_backup_tmp/run.py" | cut -d ' ' -f1)" = "$SEALED_CLASSIFY_HELPER_SHA256" ]] || exit 1
            git show "$RELEASE_SHA:deploy/ops/release-data-library.py" > "$batch_backup_tmp/release-data-library.py" 2>/dev/null || exit 1
            [[ "$(sha256sum "$batch_backup_tmp/release-data-library.py" | cut -d ' ' -f1)" = d63168fd3057f4f2aba2d93f9fab31d2d65c6dd0f3234877d71fcff1e04e62b9 ]] || exit 1
            git show "$RELEASE_SHA:deploy/ops/batch-voyageplex-sqlite-compat.py" > "$batch_backup_tmp/batch-voyageplex-sqlite-compat.py" 2>/dev/null || exit 1
            [[ "$(sha256sum "$batch_backup_tmp/batch-voyageplex-sqlite-compat.py" | cut -d ' ' -f1)" = fbb6ed5498654e2e9e73a636d87ad95abe9bfbdb97b30f17a6c99600578bae8a ]] || exit 1
            timeout --signal=TERM --kill-after=20s 30m python3 -B "$batch_backup_tmp/run.py" classify
