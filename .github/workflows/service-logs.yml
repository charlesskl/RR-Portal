name: VoyagePlex 942 Reviewed Backup
on:
  workflow_dispatch:
    inputs:
      mode: {type: choice, required: true, options: [backup]}
permissions:
  contents: read
concurrency:
  group: deploy-cloud
  queue: max
  cancel-in-progress: false
env:
  VOYAGEPLEX_BACKUP_WORKFLOW_PIN: 'true'
  VOYAGEPLEX_BACKUP_HELPER_SHA256: '6c37650f2631f698b42b0bc517f01d1816b10553114b0173c7c4c42b5dfc14fe'
jobs:
  fixed-voyageplex-backup:
    runs-on: ubuntu-latest
    timeout-minutes: 23
    steps:
      - name: Validate fixed source and first attempt
        shell: bash
        env:
          RELEASE_BRANCH: ${{ github.ref }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_ATTEMPT: ${{ github.run_attempt }}
          RELEASE_MODE: ${{ inputs.mode }}
          CLOUD_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
        run: |
          set -euo pipefail
          [[ "$VOYAGEPLEX_BACKUP_WORKFLOW_PIN" = true && "$VOYAGEPLEX_BACKUP_HELPER_SHA256" =~ ^[a-f0-9]{64}$ ]] || exit 1
          [[ "$RELEASE_BRANCH" = refs/heads/ops/voyageplex-942-20261019 && "$RELEASE_ATTEMPT" = 1 && "$RELEASE_MODE" = backup ]] || exit 1
          [[ "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ && "$CLOUD_HOST_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]{43}=?$ ]] || exit 1
      - name: Capture VoyagePlex SQLite and full runtime storage without sync
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        env:
          RELEASE_BRANCH: ${{ github.ref }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_ATTEMPT: ${{ github.run_attempt }}
          RELEASE_MODE: ${{ inputs.mode }}
          CLOUD_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
        with:
          host: ${{ secrets.CLOUD_HOST }}
          username: ${{ secrets.CLOUD_USER }}
          key: ${{ secrets.CLOUD_SSH_KEY }}
          fingerprint: ${{ env.CLOUD_HOST_FINGERPRINT }}
          command_timeout: 21m
          envs: RELEASE_BRANCH,RELEASE_SHA,RELEASE_ATTEMPT,RELEASE_MODE,VOYAGEPLEX_BACKUP_WORKFLOW_PIN,VOYAGEPLEX_BACKUP_HELPER_SHA256
          script: |
            set -euo pipefail
            [[ "$VOYAGEPLEX_BACKUP_WORKFLOW_PIN" = true && "$VOYAGEPLEX_BACKUP_HELPER_SHA256" =~ ^[a-f0-9]{64}$ ]] || exit 1
            [[ "$RELEASE_BRANCH" = refs/heads/ops/voyageplex-942-20261019 && "$RELEASE_ATTEMPT" = 1 && "$RELEASE_MODE" = backup && "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]] || exit 1
            cd /opt/rr-portal
            timeout --signal=TERM --kill-after=2s 60s git -c core.hooksPath=/dev/null fetch origin ops/voyageplex-942-20261019 >/dev/null 2>&1 || exit 1
            [[ "$(git rev-parse FETCH_HEAD)" = "$RELEASE_SHA" ]] || exit 1
            umask 077
            voyageplex_backup_tmp=$(mktemp -d /tmp/voyageplex-942-backup.XXXXXX)
            trap 'rm -rf "$voyageplex_backup_tmp"' EXIT
            git show "$RELEASE_SHA:deploy/ops/voyageplex-942-backup.py" > "$voyageplex_backup_tmp/run.py" 2>/dev/null || exit 1
            git show "$RELEASE_SHA:deploy/ops/release-data-ops-library.py" > "$voyageplex_backup_tmp/release-data-ops-library.py" 2>/dev/null || exit 1
            git show "$RELEASE_SHA:deploy/ops/release-data-library.py" > "$voyageplex_backup_tmp/release-data-library.py" 2>/dev/null || exit 1
            [[ "$(sha256sum "$voyageplex_backup_tmp/run.py" | cut -d ' ' -f1)" = "$VOYAGEPLEX_BACKUP_HELPER_SHA256" ]] || exit 1
            [[ "$(sha256sum "$voyageplex_backup_tmp/release-data-ops-library.py" | cut -d ' ' -f1)" = ff9138a1d5bfed1b10077112da6ebcda2d65240f583e2d0e12ce1325cfbaafd5 ]] || exit 1
            [[ "$(sha256sum "$voyageplex_backup_tmp/release-data-library.py" | cut -d ' ' -f1)" = d63168fd3057f4f2aba2d93f9fab31d2d65c6dd0f3234877d71fcff1e04e62b9 ]] || exit 1
            timeout --signal=TERM --kill-after=20s 18m python3 -B "$voyageplex_backup_tmp/run.py" backup
