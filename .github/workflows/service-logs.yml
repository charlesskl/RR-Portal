name: PR 1013 Factory Review Scoped Release
on:
  workflow_dispatch:
    inputs:
      mode: {type: choice, required: true, options: [prepare]}
permissions:
  contents: read
concurrency:
  group: deploy-cloud
  queue: max
  cancel-in-progress: false
env:
  SCOPED_RELEASE_WORKFLOW_PIN: 'true'
  SCOPED_RELEASE_HELPER_SHA256: 'a320deec08889a8eece812a3893638c248fbe5614242638c7c1adffda35126a4'
jobs:
  fixed-scoped-release:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Validate exact phase, branch and first attempt
        shell: bash
        env:
          RELEASE_BRANCH: ${{ github.ref }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_ATTEMPT: ${{ github.run_attempt }}
          RELEASE_MODE: ${{ inputs.mode }}
          CLOUD_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
        run: |
          set -euo pipefail
          [[ "$SCOPED_RELEASE_WORKFLOW_PIN" = true && "$SCOPED_RELEASE_HELPER_SHA256" =~ ^[a-f0-9]{64}$ ]] || exit 1
          [[ "$RELEASE_BRANCH" = refs/heads/ops/pr-1013-20261026 && "$RELEASE_ATTEMPT" = 1 && "$RELEASE_MODE" = prepare ]] || exit 1
          [[ "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ && "$CLOUD_HOST_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]{43}=?$ ]] || exit 1
      - name: Run only reviewed factory-review prepare
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        env:
          RELEASE_BRANCH: ${{ github.ref }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_ATTEMPT: ${{ github.run_attempt }}
          RELEASE_MODE: ${{ inputs.mode }}
          CLOUD_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
        with:
          host: ${{ secrets.CLOUD_HOST }}
          username: ${{ secrets.CLOUD_USER }}
          key: ${{ secrets.CLOUD_SSH_KEY }}
          fingerprint: ${{ env.CLOUD_HOST_FINGERPRINT }}
          command_timeout: 70m
          envs: RELEASE_BRANCH,RELEASE_SHA,RELEASE_ATTEMPT,RELEASE_MODE,SCOPED_RELEASE_WORKFLOW_PIN,SCOPED_RELEASE_HELPER_SHA256
          script: |
            set -euo pipefail
            [[ "$SCOPED_RELEASE_WORKFLOW_PIN" = true && "$SCOPED_RELEASE_HELPER_SHA256" =~ ^[a-f0-9]{64}$ ]] || exit 1
            [[ "$RELEASE_BRANCH" = refs/heads/ops/pr-1013-20261026 && "$RELEASE_ATTEMPT" = 1 && "$RELEASE_MODE" = prepare && "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]] || exit 1
            cd /opt/rr-portal
            timeout --signal=TERM --kill-after=2s 60s git -c core.hooksPath=/dev/null fetch --no-write-fetch-head origin +refs/heads/ops/pr-1013-20261026:refs/remotes/origin/ops/pr-1013-20261026 >/dev/null 2>&1 || exit 1
            [[ "$(git rev-parse refs/remotes/origin/ops/pr-1013-20261026)" = "$RELEASE_SHA" ]] || exit 1
            umask 077
            scoped_release_tmp=$(mktemp -d /tmp/pr1013-scoped.XXXXXX)
            trap 'rm -rf "$scoped_release_tmp"' EXIT
            git show "$RELEASE_SHA:deploy/ops/pr1013-release.py" > "$scoped_release_tmp/run.py" 2>/dev/null || exit 1
            [[ "$(sha256sum "$scoped_release_tmp/run.py" | cut -d ' ' -f1)" = a320deec08889a8eece812a3893638c248fbe5614242638c7c1adffda35126a4 ]] || exit 1
            git show "$RELEASE_SHA:deploy/ops/batch1003-data-library.py" > "$scoped_release_tmp/batch1003-data-library.py" 2>/dev/null || exit 1
            [[ "$(sha256sum "$scoped_release_tmp/batch1003-data-library.py" | cut -d ' ' -f1)" = f40fdf266b765a9a1fedcb04190b413e2d979aaa8e7548c030c1eed5560e50c6 ]] || exit 1
            git show "$RELEASE_SHA:deploy/ops/batch1003-image-library.py" > "$scoped_release_tmp/batch1003-image-library.py" 2>/dev/null || exit 1
            [[ "$(sha256sum "$scoped_release_tmp/batch1003-image-library.py" | cut -d ' ' -f1)" = 94d9dc30f1e21ee1346f89ac231bbc28ebc21d210d08298f54c56cc0103fab02 ]] || exit 1
            git show "$RELEASE_SHA:deploy/ops/release-data-library.py" > "$scoped_release_tmp/release-data-library.py" 2>/dev/null || exit 1
            [[ "$(sha256sum "$scoped_release_tmp/release-data-library.py" | cut -d ' ' -f1)" = d63168fd3057f4f2aba2d93f9fab31d2d65c6dd0f3234877d71fcff1e04e62b9 ]] || exit 1
            timeout --signal=TERM --kill-after=20s 68m python3 -B "$scoped_release_tmp/run.py" "$RELEASE_MODE"
