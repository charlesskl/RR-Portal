name: PR941 One-time Read-only Live Deployment Diagnosis

on:
  workflow_dispatch:

permissions:
  contents: read

# This exact diagnostic only reads state/process metrics; it does not share the
# deployment lock because the purpose is to inspect an active deployment.
concurrency:
  group: pr941-live-readonly-diagnostic
  queue: max
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate fixed branch, first run attempt and SSH fingerprint
        shell: bash
        env:
          CLOUD_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
          FR941_BRANCH: ${{ github.ref }}
          FR941_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          [[ "$FR941_BRANCH" = refs/heads/ops/factory-review-941-20261019 ]] || exit 1
          [[ "$FR941_ATTEMPT" = 1 ]] || exit 1
          [[ "$CLOUD_HOST_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]{43}=?$ ]] || exit 1

      - name: Read fixed deployment phase and bounded safe process metrics
        env:
          CLOUD_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
          FR941_BRANCH: ${{ github.ref }}
          FR941_ATTEMPT: ${{ github.run_attempt }}
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        with:
          host: ${{ secrets.CLOUD_HOST }}
          username: ${{ secrets.CLOUD_USER }}
          key: ${{ secrets.CLOUD_SSH_KEY }}
          fingerprint: ${{ env.CLOUD_HOST_FINGERPRINT }}
          command_timeout: 2m
          envs: FR941_BRANCH,FR941_ATTEMPT
          script: |
            set -euo pipefail
            [[ "$FR941_BRANCH" = refs/heads/ops/factory-review-941-20261019 ]] || exit 1
            [[ "$FR941_ATTEMPT" = 1 ]] || exit 1
            python3 - <<'PY_DIAG'
            import json, math, pathlib, re, stat, subprocess
            ROOT = pathlib.Path('/opt/rr-portal')
            TARGET = '4932408a0375058b781b9a9c050d4eef65f8728b'
            def command(args):
                result = subprocess.run(args, stdout=subprocess.PIPE, stderr=subprocess.PIPE, timeout=15)
                return result.stdout if result.returncode == 0 else None
            def emit(section, value):
                line = json.dumps({'section': section, 'data': value}, sort_keys=True, separators=(',', ':'), allow_nan=False)
                if len(line.encode()) > 6000:
                    raise ValueError('bounded_output')
                print(line, flush=True)
            def diagnostic():
                state = ROOT / 'deploy/.deploy-state'
                exists = state.exists()
                phase = None
                # update-server.sh save_state writes exactly one phase string.
                if exists and not state.is_symlink() and stat.S_ISREG(state.stat().st_mode) and state.stat().st_size <= 64:
                    value = state.read_text().strip()
                    phase = value if value in {'pulling','analyze','cleanup','directories','backup','deploy'} else 'unrecognized'
                head = command(['git','--no-optional-locks','-C',str(ROOT),'rev-parse','HEAD'])
                head = head.decode().strip() if head else ''
                head = head if re.fullmatch('[a-f0-9]{40}', head) else None
                emit('deployment', {'stateExists':exists,'phase':phase,'checkoutCommit':head,'expectedTarget':TARGET,'checkoutMatchesExpectedTarget':head == TARGET})
                memory = {}
                allowed_memory = {'MemTotal','MemAvailable','MemFree','SwapTotal','SwapFree'}
                for line in pathlib.Path('/proc/meminfo').read_text().splitlines():
                    match = re.fullmatch(r'([A-Za-z_()]+):\s+([0-9]+) kB', line)
                    if match and match[1] in allowed_memory:
                        memory[match[1] + 'Bytes'] = int(match[2]) * 1024
                emit('memory', memory)
                raw = command(['ps','-eo','pid=,ppid=,comm=,etime=,pcpu=,pmem='])
                allowed = {'node','npm','npm ci','npm run build','wget','apk','docker','dockerd','docker-compose','buildkitd','buildkit-runc','buildx','containerd','git','vue-tsc','tsc','vite','rollup','esbuild','unzip'}
                processes = []
                for line in (raw.decode().splitlines() if raw else []):
                    match = re.fullmatch(r'\s*([0-9]+)\s+([0-9]+)\s+(.+?)\s+([0-9:-]+)\s+([0-9.]+)\s+([0-9.]+)\s*', line)
                    if not match or match[3] not in allowed:
                        continue
                    cpu, mem = float(match[5]), float(match[6])
                    if math.isfinite(cpu) and math.isfinite(mem):
                        processes.append({'pid':int(match[1]),'ppid':int(match[2]),'command':match[3],'elapsed':match[4],'cpuPercent':cpu,'memoryPercent':mem})
                for index in range(0, min(len(processes),100),20):
                    emit('processes', {'offset':index,'totalMatching':len(processes),'items':processes[index:index+20]})
                emit('processSummary', {'querySucceeded':raw is not None,'totalMatching':len(processes),'maxEmitted':100})
                template = '{"id":{{json .Id}},"imageId":{{json .Image}},"status":{{json .State.Status}},"running":{{json .State.Running}},"oomKilled":{{json .State.OOMKilled}},"startedAt":{{json .State.StartedAt}},"restartCount":{{json .RestartCount}},"health":{{if .State.Health}}{{json .State.Health.Status}}{{else}}"none"{{end}}}'
                for service in ['factory-review','factory-review-test']:
                    raw = command(['docker','inspect','--format',template,'rr-portal-' + service + '-1'])
                    value = json.loads(raw) if raw else None
                    if value and (not re.fullmatch('[a-f0-9]{64}',value['id']) or not re.fullmatch('sha256:[a-f0-9]{64}',value['imageId']) or value['status'] not in {'created','running','paused','restarting','removing','exited','dead'} or value['health'] not in {'none','starting','healthy','unhealthy'}):
                        value = None
                    emit('targetContainer', {'service':service,'present':raw is not None,'safeState':value})
                # Exact Node20 ancestry + /build + exact npm command identifies a
                # build process category. It does not prove which app owns it.
                candidates = command(['docker','ps','--filter','ancestor=node:20-alpine','--no-trunc','-q'])
                command_classes = {('/bin/sh','-c','npm ci'):'npm-ci',('/bin/sh','-c','npm run build'):'npm-build'}
                temporary = []
                for identifier in (candidates.decode().split() if candidates else [])[:20]:
                    if not re.fullmatch('[a-f0-9]{64}',identifier):
                        continue
                    raw = command(['docker','inspect','--format','{"workdir":{{json .Config.WorkingDir}},"command":{{json .Config.Cmd}},"service":{{json (index .Config.Labels "com.docker.compose.service")}},"state":{{json .State.Status}}}',identifier])
                    if not raw:
                        continue
                    value = json.loads(raw)
                    category = command_classes.get(tuple(value['command'])) if isinstance(value.get('command'),list) else None
                    if value.get('workdir') == '/build' and not value.get('service') and category and value.get('state') == 'running':
                        temporary.append({'containerId':identifier,'commandCategory':category,'applicationAttribution':'unproven'})
                emit('temporaryNode20BuildCategories', temporary)
                emit('facts', {'readOnly':True,'businessApiCalls':False,'containerChanges':False,'rawLogsOrArgumentsPrinted':False})
            try:
                diagnostic()
            except Exception as error:
                emit('failure', {'safeError':'PR941_READ_ONLY_DIAG_FAILED','errorType':type(error).__name__ if type(error).__name__ in {'ValueError','KeyError','TypeError','FileNotFoundError','TimeoutExpired','PermissionError'} else 'Other'})
                raise SystemExit(1)
            PY_DIAG
