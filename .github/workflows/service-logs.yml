            V4=R/'deploy/backups/release-937-943-944-945-946-950-deploy-20261019-v4';OUT=R/'deploy/backups/release-qc-report-original-image-evidence-20261019'
            WEB='c4a4386e1b79b072d9a86bca5fba024791b7b99682cab04295045a4d4da3ead7';STAGE='preflight';LAST_COMMAND=None
            def need(x):
             if not x:raise RuntimeError('REPORT_IMAGE_EVIDENCE_REJECTED')
            def enc(x):return json.dumps(x,sort_keys=True,ensure_ascii=True,separators=(',',':'),allow_nan=False).encode()
            def sha(x):return hashlib.sha256(x).hexdigest()
            def run(args):
             global LAST_COMMAND
             LAST_COMMAND='git-read'if args[0]=='git'else'images'if args[:2]==['docker','image']else'compose-config'if args[:2]==['docker','compose']else'containers'
             need(time.monotonic()<END);p=subprocess.run(args,stdout=subprocess.PIPE,stderr=subprocess.DEVNULL,cwd=R,timeout=max(.1,min(15,END-time.monotonic())));need(p.returncode==0 and len(p.stdout)<=32*1024**2);return p.stdout
            def save(name,value):
