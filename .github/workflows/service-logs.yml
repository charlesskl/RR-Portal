name: QC Only Readonly Portable Backup
on:
  workflow_dispatch:
    inputs:
      mode: {type: choice, required: true, options: [backup]}
permissions:
  contents: read
concurrency:
  group: deploy-cloud
  queue: max
  cancel-in-progress: false
env:
  QC_BACKUP_WORKFLOW_PIN: 'true'
  QC_BACKUP_HELPER_SHA256: '063ca0b80c23e96a3a25af18ee442ecf33b14e8cfb7f0754b19c153bcbe85428'
jobs:
  fixed-qc-portable-backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate fixed source and first attempt
        shell: bash
        env:
          RELEASE_BRANCH: ${{ github.ref }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_ATTEMPT: ${{ github.run_attempt }}
          RELEASE_MODE: ${{ inputs.mode }}
          CLOUD_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
        run: |
          set -euo pipefail
          [[ "$QC_BACKUP_WORKFLOW_PIN" = true && "$QC_BACKUP_HELPER_SHA256" =~ ^[a-f0-9]{64}$ ]] || exit 1
          [[ "$RELEASE_BRANCH" = refs/heads/ops/qc-provider-429-20261021 && "$RELEASE_ATTEMPT" = 1 && "$RELEASE_MODE" = backup ]] || exit 1
          [[ "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ && "$CLOUD_HOST_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]{43}=?$ ]] || exit 1
      - name: Back up QC database, attachments and existing failed jobs
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        env:
          RELEASE_BRANCH: ${{ github.ref }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_ATTEMPT: ${{ github.run_attempt }}
          RELEASE_MODE: ${{ inputs.mode }}
          CLOUD_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
        with:
          host: ${{ secrets.CLOUD_HOST }}
          username: ${{ secrets.CLOUD_USER }}
          key: ${{ secrets.CLOUD_SSH_KEY }}
          fingerprint: ${{ env.CLOUD_HOST_FINGERPRINT }}
          command_timeout: 12m
          envs: RELEASE_BRANCH,RELEASE_SHA,RELEASE_ATTEMPT,RELEASE_MODE,QC_BACKUP_WORKFLOW_PIN,QC_BACKUP_HELPER_SHA256
          script: |
            set -euo pipefail
            [[ "$QC_BACKUP_WORKFLOW_PIN" = true && "$QC_BACKUP_HELPER_SHA256" =~ ^[a-f0-9]{64}$ ]] || exit 1
            [[ "$RELEASE_BRANCH" = refs/heads/ops/qc-provider-429-20261021 && "$RELEASE_ATTEMPT" = 1 && "$RELEASE_MODE" = backup && "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]] || exit 1
            cd /opt/rr-portal
            timeout --signal=TERM --kill-after=2s 60s git -c core.hooksPath=/dev/null fetch --no-write-fetch-head origin +refs/heads/ops/qc-provider-429-20261021:refs/remotes/origin/ops/qc-provider-429-20261021 >/dev/null 2>&1 || exit 1
            [[ "$(git rev-parse refs/remotes/origin/ops/qc-provider-429-20261021)" = "$RELEASE_SHA" ]] || exit 1
            umask 077
            qc_backup_tmp=$(mktemp -d /tmp/qc-provider-429-backup.XXXXXX)
            trap 'rm -rf "$qc_backup_tmp"' EXIT
            git show "$RELEASE_SHA:deploy/ops/qc-provider-429-backup.py" > "$qc_backup_tmp/run.py" 2>/dev/null || exit 1
            [[ "$(sha256sum "$qc_backup_tmp/run.py" | cut -d ' ' -f1)" = "$QC_BACKUP_HELPER_SHA256" ]] || exit 1
            git show "$RELEASE_SHA:deploy/ops/qc-source-library.py" > "$qc_backup_tmp/qc-source-library.py" 2>/dev/null || exit 1
            [[ "$(sha256sum "$qc_backup_tmp/qc-source-library.py" | cut -d ' ' -f1)" = 4745c90f126cf46106b0f170a3ebc6b24ccb64c0e963e427d13308d5cb5b54f5 ]] || exit 1
            git show "$RELEASE_SHA:deploy/ops/release-data-ops-library.py" > "$qc_backup_tmp/release-data-ops-library.py" 2>/dev/null || exit 1
            [[ "$(sha256sum "$qc_backup_tmp/release-data-ops-library.py" | cut -d ' ' -f1)" = ff9138a1d5bfed1b10077112da6ebcda2d65240f583e2d0e12ce1325cfbaafd5 ]] || exit 1
            git show "$RELEASE_SHA:deploy/ops/release-data-library.py" > "$qc_backup_tmp/release-data-library.py" 2>/dev/null || exit 1
            [[ "$(sha256sum "$qc_backup_tmp/release-data-library.py" | cut -d ' ' -f1)" = d63168fd3057f4f2aba2d93f9fab31d2d65c6dd0f3234877d71fcff1e04e62b9 ]] || exit 1
            timeout --signal=TERM --kill-after=10s 10m python3 -B "$qc_backup_tmp/run.py" backup
