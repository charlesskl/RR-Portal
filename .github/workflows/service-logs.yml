name: Fixed Healthy QC Flag Clear Only
on:
  workflow_dispatch:
    inputs:
      mode: {type: choice, required: true, options: [clear-qc]}
permissions: {contents: read}
concurrency:
  group: deploy-cloud
  queue: max
  cancel-in-progress: false
jobs:
  rescue:
    runs-on: ubuntu-latest
    timeout-minutes: 5
