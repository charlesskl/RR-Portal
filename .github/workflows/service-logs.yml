             result={'readOnly':True,'businessWritesPerformed':False,'sourceAndEnvFileFrozen':True,'services':{},'evidenceOnlyNotPermissionToChangeConfiguration':True}
             for service in SERVICES:
              SAFE_STAGE='per-service';SAFE_SERVICE=service
              old,new=old_by_service[service],new_by_service[service];explicit=compose['services'][service].get('environment',{});need(type(explicit)is dict and all(type(k)is str and type(v)is str for k,v in explicit.items()));explicit=proof['environments']([k+'='+v for k,v in explicit.items()])
              old_env=proof['environments'](old['Config']['Env']);new_env=proof['environments'](new['Config']['Env']);old_default=proof['environments'](image_map[old['Image']]['Config'].get('Env')or[]);new_default=proof['environments'](image_map[new['Image']]['Config'].get('Env')or[])
              row=key_evidence(old_env,new_env,old_default,new_default,explicit);row.update(currentContainer=new['Id'],oldImageIdentifierSHA256=sha(old['Image'].encode()),newImageIdentifierSHA256=sha(new['Image'].encode()),strictOrderedArrayIdentical=old['Config']['Env']==new['Config']['Env'],healthcheckSame=old['Config'].get('Healthcheck')==new['Config'].get('Healthcheck'),mountsSame=sorted(old.get('Mounts',[]),key=enc)==sorted(new.get('Mounts',[]),key=enc),memorySame=old['HostConfig'].get('Memory')==new['HostConfig'].get('Memory'),swapSame=old['HostConfig'].get('MemorySwap')==new['HostConfig'].get('MemorySwap'),running=new['State']['Running'],health=new['State'].get('Health',{}).get('Status'),oom=new['State']['OOMKilled'],restarts=new['RestartCount']);result['services'][service]=row
             SAFE_STAGE='final';SAFE_SERVICE=None;need(run(['git','rev-parse','HEAD']).decode().strip()==TARGET and sha((R/'.env.cloud.production').read_bytes())==baseline['envSHA256']and(R/'docker-compose.cloud.yml').read_bytes()==run(['git','show',BASE+':docker-compose.cloud.yml']));print(enc(result).decode(),flush=True)
            if __name__=='__main__':
             try:main()
             except BaseException as error:
              name=type(error).__name__;allowed={'RuntimeError','EnvironmentEvidenceError','TimeoutExpired','JSONDecodeError','KeyError','TypeError','ValueError','FileNotFoundError','PermissionError','OSError','SystemExit'}
              print(enc({'safeFailure':'FIXED_ENVIRONMENT_DRIFT_PROBE_FAILED','stage':SAFE_STAGE,'service':SAFE_SERVICE,'exceptionType':name if name in allowed else'OtherError','lastReadCommandCategory':LAST_COMMAND,'commandFailure':COMMAND_FAILURE,'failureKind':'json-shape-or-key'if name in {'JSONDecodeError','KeyError','TypeError'}else'read-or-validation'}).decode(),flush=True);sys.exit(1)
