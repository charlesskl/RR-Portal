name: PR 960 966 967 968 Fixed Read Only Backup Probe
on:
  workflow_dispatch:
    inputs:
      mode: {type: choice, required: true, options: [probe]}
permissions:
  contents: read
concurrency:
  group: deploy-cloud
  queue: max
  cancel-in-progress: false
env:
  BATCH_BACKUP_WORKFLOW_PIN: 'false'
  BATCH_BACKUP_HELPER_SHA256: 'd91e1c7872ddf62a02627c4f49766b12535a5551f4dd12bf6ac819c645cdbacc'
jobs:
  fixed-six-service-backup:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - name: Validate fixed source and first attempt
        shell: bash
        env:
          RELEASE_BRANCH: ${{ github.ref }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_ATTEMPT: ${{ github.run_attempt }}
          RELEASE_MODE: ${{ inputs.mode }}
          CLOUD_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
        run: |
          set -euo pipefail
          [[ "$BATCH_BACKUP_WORKFLOW_PIN" = true && "$BATCH_BACKUP_HELPER_SHA256" =~ ^[a-f0-9]{64}$ ]] || exit 1
          [[ "$RELEASE_BRANCH" = refs/heads/ops/batch-960-966-967-968-20261020 && "$RELEASE_ATTEMPT" = 1 && "$RELEASE_MODE" = probe ]] || exit 1
          [[ "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ && "$CLOUD_HOST_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]{43}=?$ ]] || exit 1
      - name: Read sealed failed backup and database file headers only
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        env:
          RELEASE_BRANCH: ${{ github.ref }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_ATTEMPT: ${{ github.run_attempt }}
          RELEASE_MODE: ${{ inputs.mode }}
          CLOUD_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
        with:
          host: ${{ secrets.CLOUD_HOST }}
          username: ${{ secrets.CLOUD_USER }}
          key: ${{ secrets.CLOUD_SSH_KEY }}
          fingerprint: ${{ env.CLOUD_HOST_FINGERPRINT }}
          command_timeout: 26m
          envs: RELEASE_BRANCH,RELEASE_SHA,RELEASE_ATTEMPT,RELEASE_MODE,BATCH_BACKUP_WORKFLOW_PIN,BATCH_BACKUP_HELPER_SHA256
          script: |
            set -euo pipefail
            [[ "$BATCH_BACKUP_WORKFLOW_PIN" = true && "$BATCH_BACKUP_HELPER_SHA256" =~ ^[a-f0-9]{64}$ ]] || exit 1
            [[ "$RELEASE_BRANCH" = refs/heads/ops/batch-960-966-967-968-20261020 && "$RELEASE_ATTEMPT" = 1 && "$RELEASE_MODE" = probe && "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]] || exit 1
            cd /opt/rr-portal
            timeout --signal=TERM --kill-after=2s 60s git -c core.hooksPath=/dev/null fetch origin ops/batch-960-966-967-968-20261020 >/dev/null 2>&1 || exit 1
            [[ "$(git rev-parse FETCH_HEAD)" = "$RELEASE_SHA" ]] || exit 1
            umask 077
            batch_backup_tmp=$(mktemp -d /tmp/batch-960-966-967-968-backup.XXXXXX)
            trap 'rm -rf "$batch_backup_tmp"' EXIT
            git show "$RELEASE_SHA:deploy/ops/batch-960-968-backup-probe.py" > "$batch_backup_tmp/run.py" 2>/dev/null || exit 1
            git show "$RELEASE_SHA:deploy/ops/release-data-ops-library.py" > "$batch_backup_tmp/release-data-ops-library.py" 2>/dev/null || exit 1
            git show "$RELEASE_SHA:deploy/ops/release-data-library.py" > "$batch_backup_tmp/release-data-library.py" 2>/dev/null || exit 1
            git show "$RELEASE_SHA:deploy/ops/internal-quote-readonly-library.py" > "$batch_backup_tmp/internal-quote-readonly-library.py" 2>/dev/null || exit 1
            git show "$RELEASE_SHA:deploy/ops/portable-pdb-library.py" > "$batch_backup_tmp/portable-pdb-library.py" 2>/dev/null || exit 1
            [[ "$(sha256sum "$batch_backup_tmp/run.py" | cut -d ' ' -f1)" = "$BATCH_BACKUP_HELPER_SHA256" ]] || exit 1
            [[ "$(sha256sum "$batch_backup_tmp/release-data-ops-library.py" | cut -d ' ' -f1)" = ff9138a1d5bfed1b10077112da6ebcda2d65240f583e2d0e12ce1325cfbaafd5 ]] || exit 1
            [[ "$(sha256sum "$batch_backup_tmp/release-data-library.py" | cut -d ' ' -f1)" = d63168fd3057f4f2aba2d93f9fab31d2d65c6dd0f3234877d71fcff1e04e62b9 ]] || exit 1
            [[ "$(sha256sum "$batch_backup_tmp/internal-quote-readonly-library.py" | cut -d ' ' -f1)" = be4f901f3444154e5de06766a2d8a0801dba9b847a4ac25f34a84ccebe354e69 ]] || exit 1
            [[ "$(sha256sum "$batch_backup_tmp/portable-pdb-library.py" | cut -d ' ' -f1)" = cf66f655a1e166491c4da67da0824f42ac8cdae3f844044cb5d8f7233ba105c5 ]] || exit 1
            git show "$RELEASE_SHA:deploy/ops/batch-960-968-backup.py" > "$batch_backup_tmp/batch-backup-library.py" 2>/dev/null || exit 1
            [[ "$(sha256sum "$batch_backup_tmp/batch-backup-library.py" | cut -d ' ' -f1)" = c71c9515eb03a200353e581da44f3c43827c5d5b1515e443cda535ee84c55e3d ]] || exit 1
            timeout --signal=TERM --kill-after=20s 4m python3 -B "$batch_backup_tmp/run.py" probe
