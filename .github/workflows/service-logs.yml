name: Factory Review 954 Reviewed Backup
on:
  workflow_dispatch:
    inputs:
      mode: {type: choice, required: true, options: [backup]}
permissions:
  contents: read
concurrency:
  group: deploy-cloud
  queue: max
  cancel-in-progress: false
env:
  FACTORY_BACKUP_WORKFLOW_PIN: 'true'
  FACTORY_BACKUP_HELPER_SHA256: '9cf0a547cb8563a00b66dc166a0d968b9f410c035897c7b52f08b857431c0232'
jobs:
  fixed-factory-review-backup:
    runs-on: ubuntu-latest
    timeout-minutes: 23
    steps:
      - name: Validate fixed source and first attempt
        shell: bash
        env:
          RELEASE_BRANCH: ${{ github.ref }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_ATTEMPT: ${{ github.run_attempt }}
          RELEASE_MODE: ${{ inputs.mode }}
          CLOUD_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
        run: |
          set -euo pipefail
          [[ "$FACTORY_BACKUP_WORKFLOW_PIN" = true && "$FACTORY_BACKUP_HELPER_SHA256" =~ ^[a-f0-9]{64}$ ]] || exit 1
          [[ "$RELEASE_BRANCH" = refs/heads/ops/factory-review-954-20261019 && "$RELEASE_ATTEMPT" = 1 && "$RELEASE_MODE" = backup ]] || exit 1
          [[ "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ && "$CLOUD_HOST_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]{43}=?$ ]] || exit 1
      - name: Capture two factory-review PocketBase roots and storage
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        env:
          RELEASE_BRANCH: ${{ github.ref }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_ATTEMPT: ${{ github.run_attempt }}
          RELEASE_MODE: ${{ inputs.mode }}
          CLOUD_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
        with:
          host: ${{ secrets.CLOUD_HOST }}
          username: ${{ secrets.CLOUD_USER }}
          key: ${{ secrets.CLOUD_SSH_KEY }}
          fingerprint: ${{ env.CLOUD_HOST_FINGERPRINT }}
          command_timeout: 21m
          envs: RELEASE_BRANCH,RELEASE_SHA,RELEASE_ATTEMPT,RELEASE_MODE,FACTORY_BACKUP_WORKFLOW_PIN,FACTORY_BACKUP_HELPER_SHA256
          script: |
            set -euo pipefail
            [[ "$FACTORY_BACKUP_WORKFLOW_PIN" = true && "$FACTORY_BACKUP_HELPER_SHA256" =~ ^[a-f0-9]{64}$ ]] || exit 1
            [[ "$RELEASE_BRANCH" = refs/heads/ops/factory-review-954-20261019 && "$RELEASE_ATTEMPT" = 1 && "$RELEASE_MODE" = backup && "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]] || exit 1
            cd /opt/rr-portal
            timeout --signal=TERM --kill-after=2s 60s git -c core.hooksPath=/dev/null fetch origin ops/factory-review-954-20261019 >/dev/null 2>&1 || exit 1
            [[ "$(git rev-parse FETCH_HEAD)" = "$RELEASE_SHA" ]] || exit 1
            umask 077
            factory_backup_tmp=$(mktemp -d /tmp/factory-954-backup.XXXXXX)
            trap 'rm -rf "$factory_backup_tmp"' EXIT
            git show "$RELEASE_SHA:deploy/ops/factory-review-954.py" > "$factory_backup_tmp/run.py" 2>/dev/null || exit 1
            git show "$RELEASE_SHA:deploy/ops/release-data-ops-library.py" > "$factory_backup_tmp/release-data-ops-library.py" 2>/dev/null || exit 1
            git show "$RELEASE_SHA:deploy/ops/release-data-library.py" > "$factory_backup_tmp/release-data-library.py" 2>/dev/null || exit 1
            [[ "$(sha256sum "$factory_backup_tmp/run.py" | cut -d ' ' -f1)" = "$FACTORY_BACKUP_HELPER_SHA256" ]] || exit 1
            [[ "$(sha256sum "$factory_backup_tmp/release-data-ops-library.py" | cut -d ' ' -f1)" = ff9138a1d5bfed1b10077112da6ebcda2d65240f583e2d0e12ce1325cfbaafd5 ]] || exit 1
            [[ "$(sha256sum "$factory_backup_tmp/release-data-library.py" | cut -d ' ' -f1)" = d63168fd3057f4f2aba2d93f9fab31d2d65c6dd0f3234877d71fcff1e04e62b9 ]] || exit 1
            timeout --signal=TERM --kill-after=20s 18m python3 -B "$factory_backup_tmp/run.py" backup
