name: VoyagePlex Exact V3 Interrupted Run Read Only Reconciliation
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: voyageplex-maildiag-20261019
  queue: max
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Validate fixed branch and SSH fingerprint
        shell: bash
        env:
          CLOUD_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
          MAILDIAG_BRANCH: ${{ github.ref }}
          MAILDIAG_REF: ${{ github.sha }}
          MAILDIAG_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          [[ "$MAILDIAG_BRANCH" = refs/heads/ops/voyageplex-maildiag-20261019 && "$MAILDIAG_ATTEMPT" = 1 ]] || exit 1
          [[ "$MAILDIAG_REF" =~ ^[a-f0-9]{40}$ && "$CLOUD_HOST_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]{43}=?$ ]] || exit 1
      - name: Read only external partial run reconciliation
        env:
          CLOUD_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
          MAILDIAG_BRANCH: ${{ github.ref }}
          MAILDIAG_REF: ${{ github.sha }}
          MAILDIAG_ATTEMPT: ${{ github.run_attempt }}
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        with:
          host: ${{ secrets.CLOUD_HOST }}
          username: ${{ secrets.CLOUD_USER }}
          key: ${{ secrets.CLOUD_SSH_KEY }}
          fingerprint: ${{ env.CLOUD_HOST_FINGERPRINT }}
          command_timeout: 11m
          envs: MAILDIAG_BRANCH,MAILDIAG_REF,MAILDIAG_ATTEMPT
          script: |
            set -euo pipefail
            [[ "$MAILDIAG_BRANCH" = refs/heads/ops/voyageplex-maildiag-20261019 && "$MAILDIAG_ATTEMPT" = 1 ]] || exit 1
            [[ "$MAILDIAG_REF" =~ ^[a-f0-9]{40}$ ]] || exit 1
            cd /opt/rr-portal
            git fetch origin ops/voyageplex-maildiag-20261019 >/dev/null 2>&1 || { echo 'MAILDIAG_FIXED_SCRIPT_FETCH_FAILED'; exit 1; }
            [[ "$(git rev-parse FETCH_HEAD)" = "$MAILDIAG_REF" ]] || { echo MAILDIAG_FIXED_HEAD_MISMATCH; exit 1; }
            umask 077
            mailbox_diagnostic_tmp=$(mktemp -d /tmp/maildiag-partial-v3-reconciliation.XXXXXX)
            trap 'rm -rf "$mailbox_diagnostic_tmp"' EXIT
            git show "$MAILDIAG_REF:deploy/ops/voyageplex-partial-run-v3-reconciliation-v2.py" > "$mailbox_diagnostic_tmp/run.py" 2>/dev/null || { echo 'MAILDIAG_FIXED_SCRIPT_READ_FAILED'; exit 1; }
            timeout --signal=TERM --kill-after=5s 600s python3 "$mailbox_diagnostic_tmp/run.py"
