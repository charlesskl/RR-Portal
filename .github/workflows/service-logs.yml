name: Indo outbound picker frontend release
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        required: true
        options: [prepare, deploy]
      prepared_sha256:
        type: string
        required: false
        default: ''
permissions:
  contents: read
concurrency:
  group: deploy-cloud
  queue: max
  cancel-in-progress: false
env:
  SCOPED_RELEASE_HELPER_SHA256: '44de8d98b2c5f0f29d07d045e05cb338f9a4fe212489568dd7c3c897f9aa7d0a'
jobs:
  indo-picker-only:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Validate pinned release scope
        shell: bash
        env:
          RELEASE_BRANCH: ${{ github.ref }}
          RELEASE_ATTEMPT: ${{ github.run_attempt }}
          RELEASE_MODE: ${{ inputs.mode }}
          PREPARED_SHA256: ${{ inputs.prepared_sha256 }}
          CLOUD_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_BRANCH" = refs/heads/ops/indo-picker-web-20261028 && "$RELEASE_ATTEMPT" = 1 ]] || exit 1
          [[ "$CLOUD_HOST_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]{43}=?$ ]] || exit 1
          if [[ "$RELEASE_MODE" = prepare ]]; then
            [[ -z "$PREPARED_SHA256" ]] || exit 1
          elif [[ "$RELEASE_MODE" = deploy ]]; then
            [[ "$PREPARED_SHA256" =~ ^[a-f0-9]{64}$ ]] || exit 1
          else exit 1; fi
      - name: Prepare or publish only the reviewed picker static files
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        env:
          RELEASE_BRANCH: ${{ github.ref }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_ATTEMPT: ${{ github.run_attempt }}
          RELEASE_MODE: ${{ inputs.mode }}
          PREPARED_SHA256: ${{ inputs.prepared_sha256 }}
          CLOUD_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
        with:
          host: ${{ secrets.CLOUD_HOST }}
          username: ${{ secrets.CLOUD_USER }}
          key: ${{ secrets.CLOUD_SSH_KEY }}
          fingerprint: ${{ env.CLOUD_HOST_FINGERPRINT }}
          command_timeout: 35m
          envs: RELEASE_BRANCH,RELEASE_SHA,RELEASE_ATTEMPT,RELEASE_MODE,PREPARED_SHA256,SCOPED_RELEASE_HELPER_SHA256
          script: |
            set -euo pipefail
            [[ "$RELEASE_BRANCH" = refs/heads/ops/indo-picker-web-20261028 && "$RELEASE_ATTEMPT" = 1 && "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]] || exit 1
            cd /opt/rr-portal
            timeout --signal=TERM --kill-after=2s 60s git -c core.hooksPath=/dev/null fetch --no-write-fetch-head origin +refs/heads/ops/indo-picker-web-20261028:refs/remotes/origin/ops/indo-picker-web-20261028 >/dev/null 2>&1
            [[ "$(git rev-parse refs/remotes/origin/ops/indo-picker-web-20261028)" = "$RELEASE_SHA" ]] || exit 1
            umask 077
            release_picker_tmp=$(mktemp -d /tmp/indo-picker-release.XXXXXX)
            trap 'rm -rf "$release_picker_tmp"' EXIT
            git show "$RELEASE_SHA:deploy/ops/indo-picker-static-release.py" > "$release_picker_tmp/run.py"
            [[ "$(sha256sum "$release_picker_tmp/run.py" | cut -d ' ' -f1)" = "$SCOPED_RELEASE_HELPER_SHA256" ]] || exit 1
            timeout --signal=TERM --kill-after=20s 32m python3 -B "$release_picker_tmp/run.py" "$RELEASE_MODE"
