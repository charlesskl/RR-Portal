name: Service Logs

# 通用服务日志诊断（手动触发）：查看任意 compose 服务的容器状态、健康检查结果与日志。
# 背景：2026-09-15 voyageplex 上线时 api 容器 unhealthy，仓库里没有一个能看任意服务日志的
# 入口，只能靠猜。此 workflow 填补该空缺。
#   service —— compose 服务名（如 voyageplex-api）；容器名按 rr-portal-<service>-1 推导
#   tail    —— 日志行数，默认 100

on:
  workflow_dispatch:
    inputs:
      service:
        description: "compose 服务名（如 voyageplex-api）"
        type: string
        required: true
      tail:
        description: "日志行数"
        type: string
        required: false
        default: "100"
      tomy_smoke:
        description: "仅 TOMY：使用合成文件验证上传核对及 ZIP 下载"
        type: boolean
        required: false
        default: false
      peise_ocr_ops:
        description: "Peise safe OCR configuration and synthetic provider diagnostics"
        type: choice
        options: [none, diagnose, smoke, candidates, configure, verify, status]
        default: none

permissions:
  contents: read

concurrency:
  group: ${{ inputs.peise_ocr_ops == 'status' && 'peise-readonly-status' || 'deploy-cloud' }}
  queue: max
  cancel-in-progress: false

jobs:
  logs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate SSH host fingerprint
        shell: bash
        env:
          CLOUD_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
          OPS_SERVICE: ${{ inputs.service }}
          PEISE_OCR_OPS: ${{ inputs.peise_ocr_ops }}
        run: |
          set -euo pipefail
          if [[ ! "$CLOUD_HOST_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]{43}=?$ ]]; then
            echo 'CLOUD_HOST_FINGERPRINT must be a non-empty OpenSSH SHA256 fingerprint.' >&2
            exit 1
          fi
          if [[ "$PEISE_OCR_OPS" == status && "$OPS_SERVICE" != peise ]]; then
            echo 'The read-only status mode requires service=peise.' >&2
            exit 1
          fi

      - name: Read Peise deployment status via SSH
        if: inputs.peise_ocr_ops == 'status'
        env:
          CLOUD_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        with:
          host: ${{ secrets.CLOUD_HOST }}
          username: ${{ secrets.CLOUD_USER }}
          key: ${{ secrets.CLOUD_SSH_KEY }}
          fingerprint: ${{ env.CLOUD_HOST_FINGERPRINT }}
          command_timeout: 1m
          script: |
            set -euo pipefail
            cd /opt/rr-portal
            status_head=$(git rev-parse HEAD 2>/dev/null || true)
            if [[ "$status_head" =~ ^[a-f0-9]{40,64}$ ]]; then
              printf 'head=%s\n' "$status_head"
            else
              printf 'head=unknown\n'
            fi
            status_phase=$(head -c 128 deploy/.deploy-state 2>/dev/null || true)
            case "$status_phase" in
              pulling|analyze|cleanup|directories|backup|deploy) ;;
              *) status_phase=unknown ;;
            esac
            printf 'deploy_phase=%s\n' "$status_phase"
            docker inspect --format 'status={{.State.Status}} health={{if .State.Health}}{{.State.Health.Status}}{{else}}unknown{{end}} restart_count={{.RestartCount}} started_at={{.State.StartedAt}} oom_killed={{.State.OOMKilled}}' rr-portal-peise-1 2>/dev/null || printf 'container_status=unknown\n'
            ps -eo pid=,etime=,comm= | awk '$3 ~ /^(git(-remote-http(s)?)?|docker(-compose|-buildx)?|curl|python([0-9]+(\.[0-9]+)*)?|tar|gzip|pigz|cp|chown|rsync|ssh)$/ {printf "process pid=%s elapsed=%s comm=%s\n", $1, $2, $3}'

      - name: Fetch service logs via SSH
        if: inputs.peise_ocr_ops != 'status'
        env:
          CLOUD_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
          OPS_SERVICE: ${{ inputs.service }}
          OPS_TAIL: ${{ inputs.tail }}
          TOMY_SMOKE: ${{ inputs.tomy_smoke }}
          PEISE_OCR_OPS: ${{ inputs.peise_ocr_ops }}
          PEISE_OPS_REF: ${{ github.sha }}
          PEISE_CONFIGURED_SECRET: ${{ secrets.PEISE_BAILIAN_API_KEY }}
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        with:
          host: ${{ secrets.CLOUD_HOST }}
          username: ${{ secrets.CLOUD_USER }}
          key: ${{ secrets.CLOUD_SSH_KEY }}
          fingerprint: ${{ env.CLOUD_HOST_FINGERPRINT }}
          command_timeout: 5m
          envs: OPS_SERVICE,OPS_TAIL,TOMY_SMOKE,PEISE_OCR_OPS,PEISE_OPS_REF,PEISE_CONFIGURED_SECRET
          script: |
            set -euo pipefail
            if [[ "${PEISE_OCR_OPS:-none}" != none ]]; then
              [[ "$OPS_SERVICE" == peise && "$PEISE_OCR_OPS" =~ ^(diagnose|smoke|candidates|configure|verify)$ && "$PEISE_OPS_REF" =~ ^[a-f0-9]{40}$ ]] || exit 1
              cd /opt/rr-portal
              git fetch origin ops/peise-ocr-diagnostics-20261013
              umask 077
              peise_temporary=$(mktemp -d /tmp/peise-ocr.XXXXXX)
              trap 'rm -rf "$peise_temporary"' EXIT
              git show "$PEISE_OPS_REF:deploy/ops/peise-ocr.py" > "$peise_temporary/diagnose.py"
              python3 "$peise_temporary/diagnose.py" "$PEISE_OCR_OPS"
              exit 0
            fi
            # 服务名只允许字母数字和连字符，防止注入
            if [[ ! "$OPS_SERVICE" =~ ^[a-z0-9-]+$ ]]; then
              echo "非法服务名: $OPS_SERVICE" >&2
              exit 1
            fi
            [[ "$OPS_TAIL" =~ ^[0-9]+$ ]] || OPS_TAIL=100
            CTR="rr-portal-${OPS_SERVICE}-1"

            echo "=== 容器状态 ==="
            docker ps -a --filter "name=^${CTR}$" --format 'table {{.Names}}\t{{.Status}}\t{{.Image}}' || true

            echo ""
            echo "=== 健康检查最近结果 ==="
            docker inspect --format '{{json .State.Health}}' "$CTR" 2>/dev/null | head -c 3000 || echo "(无健康检查信息)"

            echo ""
            echo "=== 最近 ${OPS_TAIL} 行日志 ==="
            docker logs --timestamps --tail "$OPS_TAIL" "$CTR" 2>&1 || true

            echo ""
            echo "=== 重启次数 ==="
            docker inspect --format 'RestartCount={{.RestartCount}} StartedAt={{.State.StartedAt}}' "$CTR" 2>/dev/null || true

            if [ "$OPS_SERVICE" = "tomy-paiqi" ]; then
              echo "=== TOMY 实际内存配置（只读） ==="
              docker inspect --format 'Memory={{.HostConfig.Memory}} MemorySwap={{.HostConfig.MemorySwap}} OOMKilled={{.State.OOMKilled}} ExitCode={{.State.ExitCode}}' "$CTR" || true
              docker exec "$CTR" node -e 'console.log(JSON.stringify({nodeOptions:process.env.NODE_OPTIONS,heapLimit:require("v8").getHeapStatistics().heap_size_limit}))' || true
              echo "=== 最近内存终止记录（只读） ==="
              journalctl -k --since '2 hours ago' --no-pager 2>/dev/null | grep -Ei 'oom-kill|killed process|memory cgroup out of memory' | tail -20 || true
              if [ "${TOMY_SMOKE:-false}" = "true" ]; then
                echo "=== TOMY 合成上传与下载验证 ==="
                docker exec "$CTR" node server/upload-smoke.mjs
                docker inspect --format 'RestartCountAfterSmoke={{.RestartCount}} Health={{.State.Health.Status}}' "$CTR"
              fi
            fi
