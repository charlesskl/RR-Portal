name: Release V4 Read Only Build Progress
on:
  workflow_dispatch:
    inputs:
      mode: {type: choice, required: true, options: [progress]}
permissions:
  contents: read
concurrency:
  group: release-read-only-progress
  cancel-in-progress: false
jobs:
  progress:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - shell: bash
        env:
          RELEASE_REF: ${{ github.ref }}
          RELEASE_ATTEMPT: ${{ github.run_attempt }}
          RELEASE_MODE: ${{ inputs.mode }}
          CLOUD_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
        run: |
          [[ "$RELEASE_REF" = refs/heads/ops/release-progress-v4-20261019 && "$RELEASE_ATTEMPT" = 1 && "$RELEASE_MODE" = progress && "$CLOUD_HOST_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]{43}=?$ ]] || exit 1
      - name: Read fixed container and deployment summaries
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        env:
          RELEASE_REF: ${{ github.ref }}
          RELEASE_ATTEMPT: ${{ github.run_attempt }}
          RELEASE_MODE: ${{ inputs.mode }}
        with:
          host: ${{ secrets.CLOUD_HOST }}
          username: ${{ secrets.CLOUD_USER }}
          key: ${{ secrets.CLOUD_SSH_KEY }}
          fingerprint: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
          command_timeout: 90s
          envs: RELEASE_REF,RELEASE_ATTEMPT,RELEASE_MODE
          script: |
            set -euo pipefail
            [[ "$RELEASE_REF" = refs/heads/ops/release-progress-v4-20261019 && "$RELEASE_ATTEMPT" = 1 && "$RELEASE_MODE" = progress ]] || exit 1
            umask 077
            python3 -B - <<'PY'
            import hashlib,json,os,pathlib,re,stat,subprocess,sys,time
            sys.excepthook=lambda *_:print('{"safeFailure":"RELEASE_PROGRESS_READ_FAILED"}')
            services=('qc','indo-shipping','internal-quote','factory-review','factory-review-test','qc-report','qc-report-worker')
            stages={'source-root-tree', 'source-dirty-snapshot', 'verify-environment-maps', 'preflight', 'before-build', 'wait-healthy', 'final-guards', 'validate-prior-seal', 'validate-six-baseline-and-qc', 'source-fixed-inputs', 'repair-source-modes', 'switch', 'validate-environment-maps', 'source-current-head', 'source-current-branch', 'build', 'validate-backup', 'validate-qc-clear-receipt'}
            root=pathlib.Path('/opt/rr-portal/deploy/backups');directory=root/'release-937-943-944-945-946-950-deploy-20261019-v4'
            assert root.is_dir() and not root.is_symlink() and directory.is_dir() and not directory.is_symlink()
            def call(args):
             p=subprocess.run(args,stdout=subprocess.PIPE,stderr=subprocess.DEVNULL,timeout=8);assert p.returncode==0 and len(p.stdout)<=65536;return p.stdout
            fmt='{"id":{{json .Id}},"image":{{json .Image}},"running":{{json .State.Running}},"oom":{{json .State.OOMKilled}},"restarts":{{json .RestartCount}},"status":{{json .State.Status}},"health":{{if .State.Health}}{{json .State.Health.Status}}{{else}}"none"{{end}}}'
            rows={}
            for service in services:
             ids=call(['docker','ps','-aq','--no-trunc','--filter','label=com.docker.compose.project=rr-portal','--filter','label=com.docker.compose.service='+service]).decode().split();assert len(ids)<=1 and all(re.fullmatch('[a-f0-9]{64}',v)for v in ids)
             rows[service]=json.loads(call(['docker','inspect','--format',fmt,ids[0]]))if ids else{'missing':True}
            files=list(directory.iterdir());assert len(files)<=5000
            pattern=r'([0-9]{3,4})-('+ '|'.join((*services,'release')) +r')-([a-z-]+)\.(log|stdout\.private)'
            logs=sorted((int(m[1]),p.name)for p in files if (m:=re.fullmatch(pattern,p.name)) and m[3]in stages and p.is_file() and not p.is_symlink())
            result={'containers':rows,'latestDeployLog':logs[-1][1]if logs else None,'safeReceipt':None}
            receipt=directory/'first-result.json'
            if receipt.is_file() and not receipt.is_symlink() and receipt.stat().st_size<=1048576:
             r=json.loads(receipt.read_bytes());result['safeReceipt']={k:r[k]for k in ['success','globalHooksRun','globalMaintenanceChanged','envFileModified','automaticRollback','businessCrudPerformed','allSevenHealthy','onlySixContainersRebuilt','qcContainerPreserved','nonTargetContainersUnchanged','fourPreexistingTrackedChangesPreserved','exactEnvironmentMapsVerifiedWithoutChangingRawArrayEvidence']if type(r.get(k))is bool};result['safeReceipt'].update({'failedStage':r.get('failedStage')if r.get('failedStage')in stages else None,'failedService':r.get('failedService')if r.get('failedService')in services else None})
            build=directory/'257-factory-review-build.log'
            assert build.is_file() and not build.is_symlink()
            fd=os.open(build,os.O_RDONLY|os.O_NOFOLLOW)
            try:
             before=os.fstat(fd);assert stat.S_ISREG(before.st_mode);offset=max(0,before.st_size-65536);os.lseek(fd,offset,os.SEEK_SET);tail=os.read(fd,min(65536,before.st_size-offset));after=os.fstat(fd);assert (before.st_dev,before.st_ino)==(after.st_dev,after.st_ino)
            finally:os.close(fd)
            text=tail.decode('utf-8','replace')
            step_patterns={'npm-install':r'\bnpm\s+(?:ci|install)\b','frontend-build':r'\bnpm\s+run\s+build\b|\bvite\s+(?:v[0-9]|build)','pocketbase-download':r'pocketbase_[0-9.]+_linux_amd64\.zip|github\.com/pocketbase/pocketbase/releases','apk-install':r'\bapk\s+add\b','copy-source':r'\bCOPY\s','export-image':r'exporting to image|writing image sha256','step-completed':r'#[0-9]+\s+(?:DONE|CACHED)\b'}
            token_patterns={'ETIMEDOUT':r'\bETIMEDOUT\b','ECONNRESET':r'\bECONNRESET\b','EAI_AGAIN':r'\bEAI_AGAIN\b','ENOTFOUND':r'\bENOTFOUND\b','ERESOLVE':r'\bERESOLVE\b','ENOSPC':r'\bENOSPC\b','TLS-timeout':r'TLS handshake timeout|TLS connection.*timed out','certificate-verification':r'certificate verify failed|certificate has expired|CERT_HAS_EXPIRED|UNABLE_TO_VERIFY_LEAF_SIGNATURE','operation-timed-out':r'operation timed out|connection timed out','network-unreachable':r'network is unreachable|no route to host','connection-refused':r'connection refused','build-error':r'failed to solve|ERROR: process|npm ERR!'}
            known={label:len(re.findall(pattern,text,re.I))for label,pattern in step_patterns.items()};errors={label:len(re.findall(pattern,text,re.I))for label,pattern in token_patterns.items()};last=[(m.start(),label)for label,pattern in step_patterns.items()for m in re.finditer(pattern,text,re.I)]
            result['fixedBuildLogMetadata']={'bytesAtReadStart':before.st_size,'bytesAtReadEnd':after.st_size,'mtimeAgeSeconds':round(max(0,time.time()-after.st_mtime),3),'tailBytes':len(tail),'tailSHA256':hashlib.sha256(tail).hexdigest(),'tailStartOffset':offset,'tailStableDuringRead':before.st_size==after.st_size and before.st_mtime_ns==after.st_mtime_ns,'knownStepCounts':{k:v for k,v in known.items()if v},'latestKnownStepCategory':max(last)[1]if last else None,'fixedErrorTokenCounts':{k:v for k,v in errors.items()if v},'reportedOnlyNotBuildOutcomeOrRootCause':True}
            print(json.dumps(result,sort_keys=True))
            PY
