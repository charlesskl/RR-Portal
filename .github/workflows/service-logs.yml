name: PrintLink Health Checked Maintenance Recovery
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: printlink-clear-maintenance-20261019
  queue: max
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Validate fixed diagnostic ref and SSH fingerprint
        shell: bash
        env:
          CLOUD_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
          PRINTLINK_CLEAR_BRANCH: ${{ github.ref }}
          PRINTLINK_CLEAR_REF: ${{ github.sha }}
          PRINTLINK_CLEAR_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          [[ "$PRINTLINK_CLEAR_BRANCH" = refs/heads/ops/printlink-clear-maintenance-20261019 && "$PRINTLINK_CLEAR_ATTEMPT" = 1 ]] || exit 1
          [[ "$PRINTLINK_CLEAR_REF" =~ ^[a-f0-9]{40}$ && "$CLOUD_HOST_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]{43}=?$ ]] || exit 1
      - name: Clear only the healthy PrintLink maintenance flag
        env:
          CLOUD_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
          PRINTLINK_CLEAR_BRANCH: ${{ github.ref }}
          PRINTLINK_CLEAR_REF: ${{ github.sha }}
          PRINTLINK_CLEAR_ATTEMPT: ${{ github.run_attempt }}
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        with:
          host: ${{ secrets.CLOUD_HOST }}
          username: ${{ secrets.CLOUD_USER }}
          key: ${{ secrets.CLOUD_SSH_KEY }}
          fingerprint: ${{ env.CLOUD_HOST_FINGERPRINT }}
          command_timeout: 3m
          envs: PRINTLINK_CLEAR_BRANCH,PRINTLINK_CLEAR_REF,PRINTLINK_CLEAR_ATTEMPT
          script: |
            set -euo pipefail
            [[ "$PRINTLINK_CLEAR_BRANCH" = refs/heads/ops/printlink-clear-maintenance-20261019 && "$PRINTLINK_CLEAR_ATTEMPT" = 1 ]] || exit 1
            [[ "$PRINTLINK_CLEAR_REF" =~ ^[a-f0-9]{40}$ ]] || exit 1
            cd /opt/rr-portal
            timeout --signal=TERM --kill-after=2s 60s git fetch origin ops/printlink-clear-maintenance-20261019 >/dev/null 2>&1 || { echo PRINTLINK_CLEAR_FETCH_FAILED; exit 1; }
            [[ "$(git rev-parse FETCH_HEAD)" = "$PRINTLINK_CLEAR_REF" ]] || { echo PRINTLINK_CLEAR_HEAD_MISMATCH; exit 1; }
            umask 077
            printlink_diagnostic_tmp=$(mktemp -d /tmp/printlink-clear-maintenance.XXXXXX)
            trap 'rm -rf "$printlink_diagnostic_tmp"' EXIT
            git show "$PRINTLINK_CLEAR_REF:deploy/ops/printlink-clear-maintenance.py" > "$printlink_diagnostic_tmp/run.py" 2>/dev/null || { echo PRINTLINK_CLEAR_SCRIPT_READ_FAILED; exit 1; }
            timeout --signal=TERM --kill-after=5s 55s python3 "$printlink_diagnostic_tmp/run.py"
