name: VoyagePlex 942 Reviewed Sealed Sync Metadata Supplement
on:
  workflow_dispatch:
    inputs:
      mode: {type: choice, required: true, options: [sync-metadata-supplement]}
permissions:
  contents: read
concurrency:
  group: deploy-cloud
  queue: max
  cancel-in-progress: false
env:
  VOYAGEPLEX_SYNC_METADATA_SUPPLEMENT_PIN: 'true'
  VOYAGEPLEX_SYNC_METADATA_SUPPLEMENT_SHA256: '49898a79db3592fb46cfa9e1c8cfe9e4e8b36a82c39b72987164c7e6bc4ebb9d'
jobs:
  fixed-sync-metadata-supplement:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate fixed source and first attempt
        shell: bash
        env:
          RELEASE_BRANCH: ${{ github.ref }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_ATTEMPT: ${{ github.run_attempt }}
          RELEASE_MODE: ${{ inputs.mode }}
          CLOUD_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
        run: |
          set -euo pipefail
          [[ "$VOYAGEPLEX_SYNC_METADATA_SUPPLEMENT_PIN" = true && "$VOYAGEPLEX_SYNC_METADATA_SUPPLEMENT_SHA256" =~ ^[a-f0-9]{64}$ ]] || exit 1
          [[ "$RELEASE_BRANCH" = refs/heads/ops/voyageplex-942-20261019 && "$RELEASE_ATTEMPT" = 1 && "$RELEASE_MODE" = sync-metadata-supplement ]] || exit 1
          [[ "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ && "$CLOUD_HOST_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]{43}=?$ ]] || exit 1
      - name: Classify sealed sync metadata without business requests
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        env:
          RELEASE_BRANCH: ${{ github.ref }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_ATTEMPT: ${{ github.run_attempt }}
          RELEASE_MODE: ${{ inputs.mode }}
          CLOUD_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
        with:
          host: ${{ secrets.CLOUD_HOST }}
          username: ${{ secrets.CLOUD_USER }}
          key: ${{ secrets.CLOUD_SSH_KEY }}
          fingerprint: ${{ env.CLOUD_HOST_FINGERPRINT }}
          command_timeout: 9m
          envs: RELEASE_BRANCH,RELEASE_SHA,RELEASE_ATTEMPT,RELEASE_MODE,VOYAGEPLEX_SYNC_METADATA_SUPPLEMENT_PIN,VOYAGEPLEX_SYNC_METADATA_SUPPLEMENT_SHA256
          script: |
            set -euo pipefail
            [[ "$VOYAGEPLEX_SYNC_METADATA_SUPPLEMENT_PIN" = true && "$VOYAGEPLEX_SYNC_METADATA_SUPPLEMENT_SHA256" =~ ^[a-f0-9]{64}$ ]] || exit 1
            [[ "$RELEASE_BRANCH" = refs/heads/ops/voyageplex-942-20261019 && "$RELEASE_ATTEMPT" = 1 && "$RELEASE_MODE" = sync-metadata-supplement && "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]] || exit 1
            cd /opt/rr-portal
            timeout --signal=TERM --kill-after=2s 30s git -c core.hooksPath=/dev/null fetch origin ops/voyageplex-942-20261019 >/dev/null 2>&1 || exit 1
            [[ "$(git rev-parse FETCH_HEAD)" = "$RELEASE_SHA" ]] || exit 1
            umask 077
            voyageplex_metadata_tmp=$(mktemp -d /tmp/voyageplex-942-sync-metadata-supplement.XXXXXX)
            trap 'rm -rf "$voyageplex_metadata_tmp"' EXIT
            git show "$RELEASE_SHA:deploy/ops/voyageplex-942-sync-metadata-supplement.py" > "$voyageplex_metadata_tmp/run.py" 2>/dev/null || exit 1
            git show "$RELEASE_SHA:deploy/ops/voyageplex-942-release-v3.py" > "$voyageplex_metadata_tmp/voyageplex-release-library.py" 2>/dev/null || exit 1
            git show "$RELEASE_SHA:deploy/ops/voyageplex-942-backup-v3.py" > "$voyageplex_metadata_tmp/voyageplex-backup-library.py" 2>/dev/null || exit 1
            git show "$RELEASE_SHA:deploy/ops/release-data-ops-library.py" > "$voyageplex_metadata_tmp/release-data-ops-library.py" 2>/dev/null || exit 1
            git show "$RELEASE_SHA:deploy/ops/release-data-library.py" > "$voyageplex_metadata_tmp/release-data-library.py" 2>/dev/null || exit 1
            git show "$RELEASE_SHA:deploy/ops/voyageplex-template-proof.py" > "$voyageplex_metadata_tmp/voyageplex-template-proof.py" 2>/dev/null || exit 1
            [[ "$(sha256sum "$voyageplex_metadata_tmp/run.py" | cut -d ' ' -f1)" = "$VOYAGEPLEX_SYNC_METADATA_SUPPLEMENT_SHA256" ]] || exit 1
            [[ "$(sha256sum "$voyageplex_metadata_tmp/voyageplex-release-library.py" | cut -d ' ' -f1)" = 5f6ab3ef3aee34fdfa6ce5805ef58e1a37305f26ccdad9cfa4c9c999b6f1d6cb ]] || exit 1
            [[ "$(sha256sum "$voyageplex_metadata_tmp/voyageplex-backup-library.py" | cut -d ' ' -f1)" = 779331f8b03b944d18b96f3e0a6778a290f25fe7f7500cee867b4a3f02c4a660 ]] || exit 1
            [[ "$(sha256sum "$voyageplex_metadata_tmp/release-data-ops-library.py" | cut -d ' ' -f1)" = ff9138a1d5bfed1b10077112da6ebcda2d65240f583e2d0e12ce1325cfbaafd5 ]] || exit 1
            [[ "$(sha256sum "$voyageplex_metadata_tmp/release-data-library.py" | cut -d ' ' -f1)" = d63168fd3057f4f2aba2d93f9fab31d2d65c6dd0f3234877d71fcff1e04e62b9 ]] || exit 1
            [[ "$(sha256sum "$voyageplex_metadata_tmp/voyageplex-template-proof.py" | cut -d ' ' -f1)" = b40a7a8fbc0aec7efa78a7e7415d35b7c8895e7fc17892efbea59d8ba32b9aed ]] || exit 1
            timeout --signal=TERM --kill-after=10s 8m python3 -B "$voyageplex_metadata_tmp/run.py" sync-metadata-supplement
