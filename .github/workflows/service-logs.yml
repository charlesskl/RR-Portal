name: ERP P112 P113 Scoped Release

# This workflow exists only on the dedicated ops branch. It does not replace
# main's service diagnostics or run the portal's legacy compose/db-init deploy.
on:
  workflow_dispatch:
    inputs:
      action:
        description: "Prepare, verify the fixed completed 8d build, activate a verified release, or inspect evidence"
        type: choice
        required: true
        options: [prepare, verify-built, activate, status]
      source_sha:
        description: "Exact reviewed ERP source commit (40 lowercase hexadecimal characters)"
        type: string
        required: true

permissions:
  contents: read

concurrency:
  # Read-only diagnostics may inspect a running build; mutations retain the portal lock.
  group: ${{ inputs.action == 'status' && 'erp-p113-readonly-status' || 'deploy-cloud' }}
  queue: max
  cancel-in-progress: false

jobs:
  scoped-erp:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Validate SSH host fingerprint and immutable inputs
        shell: bash
        env:
          CLOUD_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          RELEASE_ACTION: ${{ inputs.action }}
        run: |
          set -euo pipefail
          [[ "$CLOUD_HOST_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]{43}=?$ ]]
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$RELEASE_ACTION" =~ ^(prepare|verify-built|activate|status)$ ]]
          if [[ "$RELEASE_ACTION" == "verify-built" ]]; then
            [[ "$SOURCE_SHA" == "8d0a955487883d29a54aed883c66592c24722306" ]]
          fi

      - name: Run reviewed ERP-only operator through verified SSH
        env:
          CLOUD_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          RELEASE_ACTION: ${{ inputs.action }}
          OPERATOR_SHA: ${{ github.sha }}
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        with:
          host: ${{ secrets.CLOUD_HOST }}
          username: ${{ secrets.CLOUD_USER }}
          key: ${{ secrets.CLOUD_SSH_KEY }}
          fingerprint: ${{ env.CLOUD_HOST_FINGERPRINT }}
          command_timeout: 55m
          envs: SOURCE_SHA,RELEASE_ACTION,OPERATOR_SHA
          script: |
            set -euo pipefail
            python3 - <<'P113_OPERATOR'
            import hashlib,json,os,re,shutil,stat,subprocess,tempfile
            from collections import deque
            from pathlib import Path
            source=os.environ['SOURCE_SHA']; revision=os.environ['OPERATOR_SHA']; action=os.environ['RELEASE_ACTION']
            assert re.fullmatch('[a-f0-9]{40}',source) and re.fullmatch('[a-f0-9]{40}',revision)
            assert action in ['prepare','verify-built','activate','status']
            assert action!='verify-built' or source=='8d0a955487883d29a54aed883c66592c24722306'
            os.umask(0o077)
            root=Path('/opt/rr-portal')
            if action=='status':
                directory=Path('/opt/erp-p113-releases')/source
                assert directory.parent.resolve()==directory.parent and not directory.is_symlink()
                if directory.exists():
                    info=directory.stat()
                    assert stat.S_ISDIR(info.st_mode) and info.st_uid==os.geteuid() and not info.st_mode & 0o077
                def regular_file(path):
                    info=path.lstat()
                    assert stat.S_ISREG(info.st_mode) and info.st_uid==os.geteuid() and not info.st_mode & 0o077
                    descriptor=os.open(path,os.O_RDONLY|os.O_NOFOLLOW)
                    current=os.fstat(descriptor)
                    if (current.st_dev,current.st_ino)!=(info.st_dev,info.st_ino):
                        os.close(descriptor)
                        raise RuntimeError('Diagnostic file identity changed')
                    return os.fdopen(descriptor,'r',encoding='utf-8',errors='replace')
                result={'sourceSha':source,'exists':directory.is_dir()}
                for filename in ['prepared.private.json','activation-journal.private.json','activation.private.json']:
                    file=directory/filename
                    if file.is_file() and not file.is_symlink():
                        with regular_file(file) as handle: value=json.load(handle)
                        result[filename]={k:value[k] for k in ['prepared','ok','sourceSha','imageId','apiId','candidateId','steps','failureType','rollbackFailureType','runtimeChanges','databaseCommands','sqlIdentityUnchanged','runtimeEnvironmentUnchanged','runtimeConfigurationUnchanged','uploadsMountUnchanged'] if k in value}
                names=['source','old-static','published','original-api.private.json','original-sql.private.json','original-nginx.private.json','build-budget.private.json','fetch.private.log','source-files.private.json','build-context-files.private.json','build.private.log','prepared.private.json','activation-journal.private.json','activation.private.json']
                result['staging']={}
                for name in names:
                    path=directory/name
                    try: info=path.lstat()
                    except FileNotFoundError: result['staging'][name]={'exists':False}; continue
                    kind='file' if stat.S_ISREG(info.st_mode) else 'directory' if stat.S_ISDIR(info.st_mode) else 'rejected'
                    result['staging'][name]={'exists':True,'type':kind,'bytes':info.st_size if kind=='file' else None}
                result['retryPolicy']='Existing release directory is preserved; inspect and review recovery separately. No overwrite or cleanup is performed.'
                result['diagnosticSha256']={}
                for name in ['build.private.log','build-context-files.private.json','source-files.private.json','original-api.private.json','original-sql.private.json','original-nginx.private.json','build-budget.private.json']:
                    path=directory/name
                    if path.exists():
                        with regular_file(path) as handle:
                            digest=hashlib.sha256()
                            for chunk in iter(lambda:handle.buffer.read(1024*1024),b''): digest.update(chunk)
                            result['diagnosticSha256'][name]=digest.hexdigest()
                build_log=directory/'build.private.log'
                if build_log.exists():
                    # Whole-line redaction is intentionally conservative; no private config is printed.
                    sensitive=re.compile(r'password|passwd|\bpwd\b|token|secret|credential|authorization|connection[ _-]?strings?|ERP_DB|ERP_JWT|(?:server|data source|user id|uid|accountkey|accesskey)\s*=|api[ _-]?key|client[ _-]?secret|[?&](?:key|sig|signature)=|https?://[^\s/@]+:[^\s/@]+@|BEGIN .*PRIVATE KEY|END .*PRIVATE KEY|[A-Za-z0-9_+/=-]{40,}',re.I)
                    with regular_file(build_log) as handle: tail=list(deque(handle,maxlen=120))
                    sanitized=[]; private_key=False
                    for line in tail:
                        line=re.sub(r'\x1b\[[0-?]*[ -/]*[@-~]','',line)
                        line=''.join(char for char in line if char=='\t' or ord(char)>=32).rstrip()
                        if 'BEGIN ' in line and 'PRIVATE KEY' in line: private_key=True
                        hidden=private_key or sensitive.search(line) is not None
                        sanitized.append('[REDACTED sensitive build output]' if hidden else line[:4096])
                        if 'END ' in line and 'PRIVATE KEY' in line: private_key=False
                    result['buildLogTail']={'maxLines':120,'redactedLines':sum(line=='[REDACTED sensitive build output]' for line in sanitized),'lines':sanitized}
                result['resources']={'dockerVersion':subprocess.check_output(['docker','version','--format','{{.Server.Version}}'],text=True).strip(),'availableMemoryKiB':next((x.split()[1] for x in Path('/proc/meminfo').read_text().splitlines() if x.startswith('MemAvailable:')),None)}
                if source=='8d0a955487883d29a54aed883c66592c24722306':
                    # Match identity_equal exactly; report JSON-pointer paths, never private values or value hashes.
                    def identity_fields(item):
                        value={key:item[key] for key in ['Id','Name','Image','Created','Config','HostConfig','Mounts','NetworkSettings']}
                        value['State']={key:item['State'][key] for key in ['StartedAt','Running']}
                        value['RestartCount']=item.get('RestartCount')
                        return value
                    def changed_paths(before,after,path=''):
                        if before==after: return []
                        if isinstance(before,dict) and isinstance(after,dict):
                            changes=[]
                            for key in sorted(before.keys()|after.keys()):
                                child=path+'/'+key.replace('~','~0').replace('/','~1')
                                changes.extend([child] if key not in before or key not in after else changed_paths(before[key],after[key],child))
                            return changes
                        if isinstance(before,list) and isinstance(after,list):
                            changes=[]
                            for index in range(max(len(before),len(after))):
                                child=path+'/'+str(index)
                                changes.extend([child] if index>=len(before) or index>=len(after) else changed_paths(before[index],after[index],child))
                            return changes
                        return [path]
                    def safe_identity(item):
                        value={key:item[key] for key in ['Id','Image','Name']}
                        value['State']={key:item['State'][key] for key in ['StartedAt','Running']}
                        value['RestartCount']=item.get('RestartCount')
                        return value
                    result['originalIdentityDiff']={}
                    for kind,name in [('api','rr-portal-erp-api-1'),('sql','rr-portal-erp-sqlserver-1'),('nginx','rr-portal-nginx-1')]:
                        with regular_file(directory/('original-'+kind+'.private.json')) as handle: before=json.load(handle)
                        actual=json.loads(subprocess.check_output(['docker','inspect','--type','container',name],stderr=subprocess.DEVNULL,text=True,timeout=15))
                        assert len(actual)==1
                        after=actual[0]
                        changes=changed_paths(identity_fields(before),identity_fields(after))
                        result['originalIdentityDiff'][kind]={'equal':not changes,'changedPaths':changes,'before':safe_identity(before),'after':safe_identity(after),
                            'mountRecordsEqualIgnoringOrder':sorted(json.dumps(item,sort_keys=True,separators=(',',':')) for item in before['Mounts'])==sorted(json.dumps(item,sort_keys=True,separators=(',',':')) for item in after['Mounts']),
                            'beforeMountCount':len(before['Mounts']),'afterMountCount':len(after['Mounts'])}
                    # Read only fixed build evidence and metadata; never inspect volume contents or delete caches.
                    docker_root=json.loads(subprocess.check_output(['docker','info','--format','{{json .DockerRootDir}}'],text=True,timeout=15))
                    assert isinstance(docker_root,str) and Path(docker_root).is_absolute()
                    result['diskUsage']={name:dict(path=path,**dict(zip(['total','used','free'],shutil.disk_usage(path)))) for name,path in [('opt','/opt'),('dockerRoot',docker_root)]}
                    df=subprocess.check_output(['docker','system','df','--format','{{json .}}'],text=True,timeout=60)
                    result['dockerSystemDf']=[]
                    for line in df.splitlines():
                        item=json.loads(line)
                        assert item['Type'] in ['Images','Containers','Local Volumes','Build Cache']
                        result['dockerSystemDf'].append({key:item[key] for key in ['Type','TotalCount','Active','Size','Reclaimable']})
                    with regular_file(directory/'build.private.log') as handle:
                        prefixes=sorted({match.group(1) for line in handle if (match:=re.fullmatch(r'\s*---> ([a-f0-9]{12})\s*',line))})
                    assert prefixes and 'fcec04803bab' in prefixes
                    template='{"Id":{{json .Id}},"Parent":{{if index . "Parent"}}{{json (index . "Parent")}}{{else}}""{{end}},"Created":{{json .Created}},"Size":{{json .Size}},"RepoTagsEmpty":{{if .RepoTags}}false{{else}}true{{end}}}'
                    records=[json.loads(line) for line in subprocess.check_output(['docker','image','inspect','--format',template,*prefixes],text=True,stderr=subprocess.DEVNULL,timeout=60).splitlines()]
                    assert len(records)==len(prefixes) and {item['Id'][7:19] for item in records}==set(prefixes)
                    assert all(re.fullmatch(r'sha256:[a-f0-9]{64}',item['Id']) and (item['Parent']=='' or re.fullmatch(r'sha256:[a-f0-9]{64}',item['Parent'])) and isinstance(item['RepoTagsEmpty'],bool) for item in records)
                    selected_ids={item['Id'] for item in records}
                    container_ids=subprocess.check_output(['docker','container','ls','--all','--quiet','--no-trunc'],text=True,timeout=15).splitlines()
                    assert all(re.fullmatch(r'[a-f0-9]{64}',value) for value in container_ids)
                    references=subprocess.check_output(['docker','container','inspect','--format','{{.Image}}',*container_ids],text=True,stderr=subprocess.DEVNULL,timeout=60).splitlines() if container_ids else []
                    assert len(references)==len(container_ids) and all(re.fullmatch(r'sha256:[a-f0-9]{64}',value) for value in references)
                    all_ids=sorted(set(subprocess.check_output(['docker','image','ls','--all','--quiet','--no-trunc'],text=True,timeout=15).splitlines()))
                    assert selected_ids.issubset(all_ids) and all(re.fullmatch(r'sha256:[a-f0-9]{64}',value) for value in all_ids)
                    parents=[json.loads(line) for line in subprocess.check_output(['docker','image','inspect','--format','{"Id":{{json .Id}},"Parent":{{if index . "Parent"}}{{json (index . "Parent")}}{{else}}""{{end}}}',*all_ids],text=True,stderr=subprocess.DEVNULL,timeout=60).splitlines()]
                    assert len(parents)==len(all_ids) and {item['Id'] for item in parents}==set(all_ids)
                    protected={item[side]['Image'] for item in result['originalIdentityDiff'].values() for side in ['before','after']}
                    protected.update(item['Id'] for item in records if item['Id'].startswith('sha256:fcec04803bab'))
                    result['buildImageDiagnostics']={'sourceSha':source,'protectedImageIds':sorted(protected),'images':[
                        dict({key:item[key] for key in ['Id','Parent','Created','Size','RepoTagsEmpty']},containerReferenceCount=references.count(item['Id']),outsideSetChildImageCount=sum(child['Parent']==item['Id'] and child['Id'] not in selected_ids for child in parents),protected=item['Id'] in protected) for item in records]}
                    # Only the identified bounded apt build step may expose whitelisted diagnostics.
                    try:
                        values=json.loads(subprocess.check_output(['docker','inspect','--type','container','2786a7dec984'],stderr=subprocess.DEVNULL,text=True,timeout=15))
                        assert len(values)==1
                        item=values[0]; limits=item['HostConfig']; state=item['State']
                        assert re.fullmatch(r'2786a7dec984[a-f0-9]{52}',item['Id']) and item['Mounts']==[]
                        assert limits['Memory']==2*1024**3 and limits['MemorySwap']==2*1024**3 and limits['CpuQuota']==75000 and limits['CpuPeriod']==100000
                        assert item['Config']['Cmd']==['/bin/sh','-c','apt-get update && apt-get install -y --no-install-recommends curl && rm -rf /var/lib/apt/lists/*']
                        assert state['Running'] and state['Status']=='running'
                        sample=json.loads(subprocess.check_output(['docker','stats','--no-stream','--format','{{json .}}',item['Id']],stderr=subprocess.DEVNULL,text=True,timeout=20))
                        result['knownBuildContainer']={'ID':item['Id'],'Status':state['Status'],'StartedAt':state['StartedAt'],'Image':item['Image'],'Memory':limits['Memory'],'CpuQuota':limits['CpuQuota'],'CPU':sample['CPUPerc'],'Mem':sample['MemUsage'],'NetIO':sample['NetIO'],'PIDs':sample['PIDs']}
                    except (AssertionError,KeyError,ValueError,subprocess.SubprocessError):
                        result['knownBuildContainer']={'available':False}
                print(json.dumps(result)); raise SystemExit(0)
            subprocess.run(['git','-C',str(root),'fetch','origin',revision],check=True,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
            with tempfile.TemporaryDirectory(prefix='erp-p113-reviewed-') as scratch:
                directory=Path(scratch)
                names=['erp-p113-scoped-release.py','erp-p113-verify-built.py' if action=='verify-built' else 'erp-p113-activate.py']
                if action=='activate': names.append('erp-p113-ready.json')
                for name in names:
                    content=subprocess.check_output(['git','-C',str(root),'show',revision+':deploy/'+name])
                    (directory/name).write_bytes(content)
                if action=='prepare':
                    command=['python3',str(directory/'erp-p113-scoped-release.py'),'prepare','--source-sha',source]
                elif action=='verify-built':
                    command=['python3',str(directory/'erp-p113-verify-built.py'),'--source-sha',source]
                else:
                    command=['python3',str(directory/'erp-p113-activate.py'),'--source-sha',source,'--ready',str(directory/'erp-p113-ready.json')]
                subprocess.run(command,check=True)
            P113_OPERATOR
