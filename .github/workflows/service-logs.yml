name: Internal Quote 959 Sealed Sequence Supplement
on:
  workflow_dispatch:
    inputs:
      mode: {type: choice, required: true, options: [sequence-supplement]}
permissions:
  contents: read
concurrency:
  group: deploy-cloud
  queue: max
  cancel-in-progress: false
env:
  IQ_SEQUENCE_WORKFLOW_PIN: 'true'
  IQ_SEQUENCE_HELPER_SHA256: '5f30fd0589fbcb77806e9ca5a5da73ddf13be9ab29330b3325d625ace8036eb2'
jobs:
  sealed-sequence-supplement:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate fixed source and first attempt
        shell: bash
        env:
          RELEASE_BRANCH: ${{ github.ref }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_ATTEMPT: ${{ github.run_attempt }}
          RELEASE_MODE: ${{ inputs.mode }}
          CLOUD_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
        run: |
          set -euo pipefail
          [[ "$IQ_SEQUENCE_WORKFLOW_PIN" = true && "$IQ_SEQUENCE_HELPER_SHA256" =~ ^[a-f0-9]{64}$ ]] || exit 1
          [[ "$RELEASE_BRANCH" = refs/heads/ops/internal-quote-959-20261020 && "$RELEASE_ATTEMPT" = 1 && "$RELEASE_MODE" = sequence-supplement ]] || exit 1
          [[ "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ && "$CLOUD_HOST_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]{43}=?$ ]] || exit 1
      - name: Read only the fixed sealed metadata and preserve original receipts
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        env:
          RELEASE_BRANCH: ${{ github.ref }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_ATTEMPT: ${{ github.run_attempt }}
          RELEASE_MODE: ${{ inputs.mode }}
          CLOUD_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
        with:
          host: ${{ secrets.CLOUD_HOST }}
          username: ${{ secrets.CLOUD_USER }}
          key: ${{ secrets.CLOUD_SSH_KEY }}
          fingerprint: ${{ env.CLOUD_HOST_FINGERPRINT }}
          command_timeout: 4m
          envs: RELEASE_BRANCH,RELEASE_SHA,RELEASE_ATTEMPT,RELEASE_MODE,IQ_SEQUENCE_WORKFLOW_PIN,IQ_SEQUENCE_HELPER_SHA256
          script: |
            set -euo pipefail
            [[ "$IQ_SEQUENCE_WORKFLOW_PIN" = true && "$IQ_SEQUENCE_HELPER_SHA256" =~ ^[a-f0-9]{64}$ ]] || exit 1
            [[ "$RELEASE_BRANCH" = refs/heads/ops/internal-quote-959-20261020 && "$RELEASE_ATTEMPT" = 1 && "$RELEASE_MODE" = sequence-supplement && "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]] || exit 1
            cd /opt/rr-portal
            timeout --signal=TERM --kill-after=2s 60s git -c core.hooksPath=/dev/null fetch origin ops/internal-quote-959-20261020 >/dev/null 2>&1 || exit 1
            [[ "$(git rev-parse FETCH_HEAD)" = "$RELEASE_SHA" ]] || exit 1
            umask 077
            iq_sequence_tmp=$(mktemp -d /tmp/iq-959-sequence.XXXXXX)
            trap 'rm -rf "$iq_sequence_tmp"' EXIT
            git show "$RELEASE_SHA:deploy/ops/internal-quote-959-sequence-supplement.py" > "$iq_sequence_tmp/run.py" 2>/dev/null || exit 1
            git show "$RELEASE_SHA:deploy/ops/release-data-library.py" > "$iq_sequence_tmp/release-data-library.py" 2>/dev/null || exit 1
            [[ "$(sha256sum "$iq_sequence_tmp/run.py" | cut -d ' ' -f1)" = "$IQ_SEQUENCE_HELPER_SHA256" ]] || exit 1
            [[ "$(sha256sum "$iq_sequence_tmp/release-data-library.py" | cut -d ' ' -f1)" = d63168fd3057f4f2aba2d93f9fab31d2d65c6dd0f3234877d71fcff1e04e62b9 ]] || exit 1
            timeout --signal=TERM --kill-after=5s 105s python3 -B "$iq_sequence_tmp/run.py" sequence-supplement
