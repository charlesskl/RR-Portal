name: Reviewed Batch Post-Deploy Data and Code Acceptance V3
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        required: true
        options: [verify, acceptance]
permissions:
  contents: read
concurrency:
  group: deploy-cloud
  queue: max
  cancel-in-progress: false
env:
  RELEASE_POST_WORKFLOW_FROZEN: 'true'
  RELEASE_VERIFY_HELPER_SHA256: '6748311ec6ddeec8c9ac2d11dbc4d1b5d22ef3478362470aaea64664f3b3487c'
  RELEASE_ACCEPTANCE_HELPER_SHA256: 'a548a856b460808428261db4349081c261d64dfd315631975c20507eb15c47ca'
  RELEASE_ENVIRONMENT_PROOF_SHA256: '6294323fec201ebb1929fada673f99de6b824a546898c9052843a81fe2f6f1d7'
jobs:
  reviewed-post-deploy-operation:
    runs-on: ubuntu-latest
    timeout-minutes: 23
    steps:
      - name: Validate frozen source, exact branch and first attempt
        shell: bash
        env:
          RELEASE_BRANCH: ${{ github.ref }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_ATTEMPT: ${{ github.run_attempt }}
          RELEASE_MODE: ${{ inputs.mode }}
          CLOUD_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_POST_WORKFLOW_FROZEN" = true && "$RELEASE_VERIFY_HELPER_SHA256" =~ ^[a-f0-9]{64}$ && "$RELEASE_ACCEPTANCE_HELPER_SHA256" =~ ^[a-f0-9]{64}$ && "$RELEASE_ENVIRONMENT_PROOF_SHA256" =~ ^[a-f0-9]{64}$ ]] || exit 1
          [[ "$RELEASE_BRANCH" = refs/heads/ops/release-937-943-944-945-946-950-20261019 && "$RELEASE_ATTEMPT" = 1 ]] || exit 1
          [[ "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ && "$RELEASE_MODE" =~ ^(verify|acceptance)$ && "$CLOUD_HOST_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]{43}=?$ ]] || exit 1
      - name: Run fixed read-only verification or synthetic acceptance
        env:
          RELEASE_BRANCH: ${{ github.ref }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_ATTEMPT: ${{ github.run_attempt }}
          RELEASE_MODE: ${{ inputs.mode }}
          CLOUD_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        with:
          host: ${{ secrets.CLOUD_HOST }}
          username: ${{ secrets.CLOUD_USER }}
          key: ${{ secrets.CLOUD_SSH_KEY }}
          fingerprint: ${{ env.CLOUD_HOST_FINGERPRINT }}
          command_timeout: 21m
          envs: RELEASE_BRANCH,RELEASE_SHA,RELEASE_ATTEMPT,RELEASE_MODE,RELEASE_POST_WORKFLOW_FROZEN,RELEASE_VERIFY_HELPER_SHA256,RELEASE_ACCEPTANCE_HELPER_SHA256,RELEASE_ENVIRONMENT_PROOF_SHA256
          script: |
            set -euo pipefail
            [[ "$RELEASE_POST_WORKFLOW_FROZEN" = true && "$RELEASE_VERIFY_HELPER_SHA256" =~ ^[a-f0-9]{64}$ && "$RELEASE_ACCEPTANCE_HELPER_SHA256" =~ ^[a-f0-9]{64}$ && "$RELEASE_ENVIRONMENT_PROOF_SHA256" =~ ^[a-f0-9]{64}$ ]] || exit 1
            [[ "$RELEASE_BRANCH" = refs/heads/ops/release-937-943-944-945-946-950-20261019 && "$RELEASE_ATTEMPT" = 1 ]] || exit 1
            [[ "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ && "$RELEASE_MODE" =~ ^(verify|acceptance)$ ]] || exit 1
            cd /opt/rr-portal
            timeout --signal=TERM --kill-after=2s 60s git -c core.hooksPath=/dev/null fetch origin ops/release-937-943-944-945-946-950-20261019 >/dev/null 2>&1 || { echo RELEASE_FETCH_FAILED; exit 1; }
            [[ "$(git rev-parse FETCH_HEAD)" = "$RELEASE_SHA" ]] || { echo RELEASE_HEAD_MISMATCH; exit 1; }
            umask 077
            release_private_tmp=$(mktemp -d /tmp/release-post-reviewed.XXXXXX)
            trap 'rm -rf "$release_private_tmp"' EXIT
            case "$RELEASE_MODE" in
              verify)
                git show "$RELEASE_SHA:deploy/ops/release-batch-post-verify-v3.py" > "$release_private_tmp/run.py" 2>/dev/null || exit 1
                release_expected_sha="$RELEASE_VERIFY_HELPER_SHA256"
                release_arguments=(verify)
                ;;
              acceptance)
                git show "$RELEASE_SHA:deploy/ops/release-code-acceptance-v3.py" > "$release_private_tmp/run.py" 2>/dev/null || exit 1
                release_expected_sha="$RELEASE_ACCEPTANCE_HELPER_SHA256"
                release_arguments=()
                ;;
              *) exit 1 ;;
            esac
            git show "$RELEASE_SHA:deploy/ops/release-data-library.py" > "$release_private_tmp/release-data-library.py" 2>/dev/null || exit 1
            git show "$RELEASE_SHA:deploy/ops/release-environment-proof-v2.py" > "$release_private_tmp/release-environment-proof-v2.py" 2>/dev/null || exit 1
            [[ "$(sha256sum "$release_private_tmp/release-environment-proof-v2.py" | cut -d ' ' -f1)" = "$RELEASE_ENVIRONMENT_PROOF_SHA256" ]] || { echo RELEASE_ENVIRONMENT_PROOF_MISMATCH; exit 1; }
            [[ "$(sha256sum "$release_private_tmp/run.py" | cut -d ' ' -f1)" = "$release_expected_sha" ]] || { echo RELEASE_HELPER_MISMATCH; exit 1; }
            [[ "$(sha256sum "$release_private_tmp/release-data-library.py" | cut -d ' ' -f1)" = d63168fd3057f4f2aba2d93f9fab31d2d65c6dd0f3234877d71fcff1e04e62b9 ]] || { echo RELEASE_LIBRARY_MISMATCH; exit 1; }
            timeout --signal=TERM --kill-after=20s 18m python3 -B "$release_private_tmp/run.py" "${release_arguments[@]}"
