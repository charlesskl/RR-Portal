              old=old_records[baseline['runtime']['services'][service]['id']];proof['bound_environment'](old,baseline['runtime']['services'][service],service);new=current[cid];proof['bound_environment'](new,{'id':cid,'image':new['Image'],'environmentSHA256':sha(enc(new['Config']['Env']))},service);old_by_service[service]=old;new_by_service[service]=new;image_ids.update([old['Image'],new['Image']])
