name: PrintLink Private Online Backup
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: printlink-health-backup-20261019
  queue: max
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Validate fixed diagnostic ref and SSH fingerprint
        shell: bash
        env:
          CLOUD_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
          PRINTLINK_BACKUP_BRANCH: ${{ github.ref }}
          PRINTLINK_BACKUP_REF: ${{ github.sha }}
          PRINTLINK_BACKUP_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          [[ "$PRINTLINK_BACKUP_BRANCH" = refs/heads/ops/printlink-health-backup-20261019 && "$PRINTLINK_BACKUP_ATTEMPT" = 1 ]] || exit 1
          [[ "$PRINTLINK_BACKUP_REF" =~ ^[a-f0-9]{40}$ && "$CLOUD_HOST_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]{43}=?$ ]] || exit 1
      - name: Create exact private online backup
        env:
          CLOUD_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
          PRINTLINK_BACKUP_BRANCH: ${{ github.ref }}
          PRINTLINK_BACKUP_REF: ${{ github.sha }}
          PRINTLINK_BACKUP_ATTEMPT: ${{ github.run_attempt }}
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        with:
          host: ${{ secrets.CLOUD_HOST }}
          username: ${{ secrets.CLOUD_USER }}
          key: ${{ secrets.CLOUD_SSH_KEY }}
          fingerprint: ${{ env.CLOUD_HOST_FINGERPRINT }}
          command_timeout: 11m
          envs: PRINTLINK_BACKUP_BRANCH,PRINTLINK_BACKUP_REF,PRINTLINK_BACKUP_ATTEMPT
          script: |
            set -euo pipefail
            [[ "$PRINTLINK_BACKUP_BRANCH" = refs/heads/ops/printlink-health-backup-20261019 && "$PRINTLINK_BACKUP_ATTEMPT" = 1 ]] || exit 1
            [[ "$PRINTLINK_BACKUP_REF" =~ ^[a-f0-9]{40}$ ]] || exit 1
            cd /opt/rr-portal
            timeout --signal=TERM --kill-after=2s 60s git fetch origin ops/printlink-health-backup-20261019 >/dev/null 2>&1 || { echo PRINTLINK_BACKUP_FETCH_FAILED; exit 1; }
            [[ "$(git rev-parse FETCH_HEAD)" = "$PRINTLINK_BACKUP_REF" ]] || { echo PRINTLINK_BACKUP_HEAD_MISMATCH; exit 1; }
            umask 077
            printlink_diagnostic_tmp=$(mktemp -d /tmp/printlink-health-backup.XXXXXX)
            trap 'rm -rf "$printlink_diagnostic_tmp"' EXIT
            git show "$PRINTLINK_BACKUP_REF:deploy/ops/printlink-health-backup.py" > "$printlink_diagnostic_tmp/run.py" 2>/dev/null || { echo PRINTLINK_BACKUP_SCRIPT_READ_FAILED; exit 1; }
            timeout --signal=TERM --kill-after=5s 600s python3 "$printlink_diagnostic_tmp/run.py"
