name: PR 1040 Scoped Quote Release
on:
  workflow_dispatch:
    inputs:
      mode: {type: choice, required: true, options: [diagnose]}
permissions:
  contents: read
concurrency:
  group: deploy-cloud
  queue: max
  cancel-in-progress: false
env:
  SCOPED_RELEASE_WORKFLOW_PIN: 'true'
  SCOPED_RELEASE_HELPER_SHA256: 'de1fe120bb875bee34f38062b52391c7bcbbbef08106ed6c6398e68b30effae5'
jobs:
  fixed-quote-phase:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Validate exact reviewed phase and SSH host fingerprint
        shell: bash
        env:
          RELEASE_BRANCH: ${{ github.ref }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_ATTEMPT: ${{ github.run_attempt }}
          RELEASE_MODE: ${{ inputs.mode }}
          CLOUD_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
        run: |
          set -euo pipefail
          [[ "$SCOPED_RELEASE_WORKFLOW_PIN" = true && "$SCOPED_RELEASE_HELPER_SHA256" = de1fe120bb875bee34f38062b52391c7bcbbbef08106ed6c6398e68b30effae5 ]] || exit 1
          [[ "$RELEASE_BRANCH" = refs/heads/ops/pr-1040-20261030-quote && "$RELEASE_ATTEMPT" = 1 && "$RELEASE_MODE" = diagnose && "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]] || exit 1
          [[ "$CLOUD_HOST_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]{43}=?$ ]] || exit 1
      - name: Run exact Quote diagnose helper
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        env:
          RELEASE_BRANCH: ${{ github.ref }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_ATTEMPT: ${{ github.run_attempt }}
          RELEASE_MODE: ${{ inputs.mode }}
          CLOUD_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
        with:
          host: ${{ secrets.CLOUD_HOST }}
          username: ${{ secrets.CLOUD_USER }}
          key: ${{ secrets.CLOUD_SSH_KEY }}
          fingerprint: ${{ env.CLOUD_HOST_FINGERPRINT }}
          command_timeout: 24m
          envs: RELEASE_BRANCH,RELEASE_SHA,RELEASE_ATTEMPT,RELEASE_MODE,SCOPED_RELEASE_WORKFLOW_PIN,SCOPED_RELEASE_HELPER_SHA256
          script: |
            set -euo pipefail
            [[ "$SCOPED_RELEASE_WORKFLOW_PIN" = true && "$SCOPED_RELEASE_HELPER_SHA256" = de1fe120bb875bee34f38062b52391c7bcbbbef08106ed6c6398e68b30effae5 ]] || exit 1
            [[ "$RELEASE_BRANCH" = refs/heads/ops/pr-1040-20261030-quote && "$RELEASE_ATTEMPT" = 1 && "$RELEASE_MODE" = diagnose && "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]] || exit 1
            cd /opt/rr-portal
            timeout --signal=TERM --kill-after=2s 60s git -c core.hooksPath=/dev/null fetch --no-write-fetch-head origin +refs/heads/ops/pr-1040-20261030-quote:refs/remotes/origin/ops/pr-1040-20261030-quote >/dev/null 2>&1 || exit 1
            [[ "$(git rev-parse refs/remotes/origin/ops/pr-1040-20261030-quote)" = "$RELEASE_SHA" ]] || exit 1
            umask 077
            quote_tmp=$(mktemp -d /tmp/pr1040-quote.XXXXXX)
            trap 'rm -rf "$quote_tmp"' EXIT
            git show "$RELEASE_SHA:deploy/ops/pr1040-quote-prepare-failure-read.py" > "$quote_tmp/run.py" 2>/dev/null || exit 1
            [[ "$(sha256sum "$quote_tmp/run.py" | cut -d ' ' -f1)" = de1fe120bb875bee34f38062b52391c7bcbbbef08106ed6c6398e68b30effae5 ]] || exit 1
            timeout --signal=TERM --kill-after=30s 22m python3 -B "$quote_tmp/run.py" diagnose
