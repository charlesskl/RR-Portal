name: PrintLink Portal Read Only Diagnosis
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: printlink-current-diagnosis-20261019
  queue: max
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Validate fixed diagnostic ref and SSH fingerprint
        shell: bash
        env:
          CLOUD_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
          PRINTLINK_DIAG_BRANCH: ${{ github.ref }}
          PRINTLINK_DIAG_REF: ${{ github.sha }}
          PRINTLINK_DIAG_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          [[ "$PRINTLINK_DIAG_BRANCH" = refs/heads/ops/printlink-current-diagnosis-20261019 && "$PRINTLINK_DIAG_ATTEMPT" = 1 ]] || exit 1
          [[ "$PRINTLINK_DIAG_REF" =~ ^[a-f0-9]{40}$ && "$CLOUD_HOST_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]{43}=?$ ]] || exit 1
      - name: Read only PrintLink portal and runtime checks
        env:
          CLOUD_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
          PRINTLINK_DIAG_BRANCH: ${{ github.ref }}
          PRINTLINK_DIAG_REF: ${{ github.sha }}
          PRINTLINK_DIAG_ATTEMPT: ${{ github.run_attempt }}
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        with:
          host: ${{ secrets.CLOUD_HOST }}
          username: ${{ secrets.CLOUD_USER }}
          key: ${{ secrets.CLOUD_SSH_KEY }}
          fingerprint: ${{ env.CLOUD_HOST_FINGERPRINT }}
          command_timeout: 2m
          envs: PRINTLINK_DIAG_BRANCH,PRINTLINK_DIAG_REF,PRINTLINK_DIAG_ATTEMPT
          script: |
            set -euo pipefail
            [[ "$PRINTLINK_DIAG_BRANCH" = refs/heads/ops/printlink-current-diagnosis-20261019 && "$PRINTLINK_DIAG_ATTEMPT" = 1 ]] || exit 1
            [[ "$PRINTLINK_DIAG_REF" =~ ^[a-f0-9]{40}$ ]] || exit 1
            cd /opt/rr-portal
            git fetch origin ops/printlink-current-diagnosis-20261019 >/dev/null 2>&1 || { echo PRINTLINK_DIAG_FETCH_FAILED; exit 1; }
            [[ "$(git rev-parse FETCH_HEAD)" = "$PRINTLINK_DIAG_REF" ]] || { echo PRINTLINK_DIAG_HEAD_MISMATCH; exit 1; }
            umask 077
            printlink_diagnostic_tmp=$(mktemp -d /tmp/printlink-current-diagnosis.XXXXXX)
            trap 'rm -rf "$printlink_diagnostic_tmp"' EXIT
            git show "$PRINTLINK_DIAG_REF:deploy/ops/printlink-current-diagnosis.py" > "$printlink_diagnostic_tmp/run.py" 2>/dev/null || { echo PRINTLINK_DIAG_SCRIPT_READ_FAILED; exit 1; }
            timeout --signal=TERM --kill-after=5s 65s python3 "$printlink_diagnostic_tmp/run.py"
