name: VoyagePlex 942 Reviewed Source Diagnostic
on:
  workflow_dispatch:
    inputs:
      mode: {type: choice, required: true, options: [source-diagnostic]}
permissions:
  contents: read
concurrency:
  group: deploy-cloud
  queue: max
  cancel-in-progress: false
env:
  VOYAGEPLEX_SOURCE_DIAGNOSTIC_PIN: 'true'
  VOYAGEPLEX_SOURCE_DIAGNOSTIC_SHA256: '69f6e8db5396217fb4100623adf3b9b8a2298ca19e1c0a7cc41eecbf3e19bd39'
jobs:
  fixed-source-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Validate fixed source and first attempt
        shell: bash
        env:
          RELEASE_BRANCH: ${{ github.ref }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_ATTEMPT: ${{ github.run_attempt }}
          RELEASE_MODE: ${{ inputs.mode }}
          CLOUD_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
        run: |
          set -euo pipefail
          [[ "$VOYAGEPLEX_SOURCE_DIAGNOSTIC_PIN" = true && "$VOYAGEPLEX_SOURCE_DIAGNOSTIC_SHA256" =~ ^[a-f0-9]{64}$ ]] || exit 1
          [[ "$RELEASE_BRANCH" = refs/heads/ops/voyageplex-942-20261019 && "$RELEASE_ATTEMPT" = 1 && "$RELEASE_MODE" = source-diagnostic ]] || exit 1
          [[ "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ && "$CLOUD_HOST_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]{43}=?$ ]] || exit 1
      - name: Diagnose source proof without backup or business requests
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        env:
          RELEASE_BRANCH: ${{ github.ref }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_ATTEMPT: ${{ github.run_attempt }}
          RELEASE_MODE: ${{ inputs.mode }}
          CLOUD_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
        with:
          host: ${{ secrets.CLOUD_HOST }}
          username: ${{ secrets.CLOUD_USER }}
          key: ${{ secrets.CLOUD_SSH_KEY }}
          fingerprint: ${{ env.CLOUD_HOST_FINGERPRINT }}
          command_timeout: 7m
          envs: RELEASE_BRANCH,RELEASE_SHA,RELEASE_ATTEMPT,RELEASE_MODE,VOYAGEPLEX_SOURCE_DIAGNOSTIC_PIN,VOYAGEPLEX_SOURCE_DIAGNOSTIC_SHA256
          script: |
            set -euo pipefail
            [[ "$VOYAGEPLEX_SOURCE_DIAGNOSTIC_PIN" = true && "$VOYAGEPLEX_SOURCE_DIAGNOSTIC_SHA256" =~ ^[a-f0-9]{64}$ ]] || exit 1
            [[ "$RELEASE_BRANCH" = refs/heads/ops/voyageplex-942-20261019 && "$RELEASE_ATTEMPT" = 1 && "$RELEASE_MODE" = source-diagnostic && "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]] || exit 1
            cd /opt/rr-portal
            timeout --signal=TERM --kill-after=2s 30s git -c core.hooksPath=/dev/null fetch origin ops/voyageplex-942-20261019 >/dev/null 2>&1 || exit 1
            [[ "$(git rev-parse FETCH_HEAD)" = "$RELEASE_SHA" ]] || exit 1
            umask 077
            voyageplex_source_tmp=$(mktemp -d /tmp/voyageplex-942-source-diagnostic.XXXXXX)
            trap 'rm -rf "$voyageplex_source_tmp"' EXIT
            git show "$RELEASE_SHA:deploy/ops/voyageplex-942-source-diagnostic.py" > "$voyageplex_source_tmp/run.py" 2>/dev/null || exit 1
            git show "$RELEASE_SHA:deploy/ops/voyageplex-942-backup-v2.py" > "$voyageplex_source_tmp/voyageplex-942-backup-v2.py" 2>/dev/null || exit 1
            git show "$RELEASE_SHA:deploy/ops/release-data-ops-library.py" > "$voyageplex_source_tmp/release-data-ops-library.py" 2>/dev/null || exit 1
            git show "$RELEASE_SHA:deploy/ops/release-data-library.py" > "$voyageplex_source_tmp/release-data-library.py" 2>/dev/null || exit 1
            [[ "$(sha256sum "$voyageplex_source_tmp/run.py" | cut -d ' ' -f1)" = "$VOYAGEPLEX_SOURCE_DIAGNOSTIC_SHA256" ]] || exit 1
            [[ "$(sha256sum "$voyageplex_source_tmp/voyageplex-942-backup-v2.py" | cut -d ' ' -f1)" = df7bd36ec986b0b7456dc4794fd287c772a08941771ea59fc631ec6d920404b2 ]] || exit 1
            [[ "$(sha256sum "$voyageplex_source_tmp/release-data-ops-library.py" | cut -d ' ' -f1)" = ff9138a1d5bfed1b10077112da6ebcda2d65240f583e2d0e12ce1325cfbaafd5 ]] || exit 1
            [[ "$(sha256sum "$voyageplex_source_tmp/release-data-library.py" | cut -d ' ' -f1)" = d63168fd3057f4f2aba2d93f9fab31d2d65c6dd0f3234877d71fcff1e04e62b9 ]] || exit 1
            timeout --signal=TERM --kill-after=10s 360s python3 -B "$voyageplex_source_tmp/run.py" source-diagnostic
