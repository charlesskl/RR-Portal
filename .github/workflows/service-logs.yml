name: Fixed QC Report Environment Evidence
on:
  workflow_dispatch:
    inputs:
      mode: {type: choice, required: true, options: [report-env]}
permissions: {contents: read}
concurrency: {group: release-read-only-progress, cancel-in-progress: false}
env:
  RELEASE_REPORT_ENV_FROZEN: 'true'
jobs:
  report-env:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - shell: bash
        env:
          RELEASE_REF: ${{ github.ref }}
          RELEASE_ATTEMPT: ${{ github.run_attempt }}
          RELEASE_MODE: ${{ inputs.mode }}
          CLOUD_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
        run: |
          [[ "$RELEASE_REPORT_ENV_FROZEN" = true && "$RELEASE_REF" = refs/heads/ops/release-progress-v4-20261019 && "$RELEASE_ATTEMPT" = 1 && "$RELEASE_MODE" = report-env && "$CLOUD_HOST_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]{43}=?$ ]] || exit 1
      - uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        env:
          RELEASE_REF: ${{ github.ref }}
          RELEASE_ATTEMPT: ${{ github.run_attempt }}
          RELEASE_MODE: ${{ inputs.mode }}
        with:
          host: ${{ secrets.CLOUD_HOST }}
          username: ${{ secrets.CLOUD_USER }}
          key: ${{ secrets.CLOUD_SSH_KEY }}
          fingerprint: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
          command_timeout: 90s
          envs: RELEASE_REF,RELEASE_ATTEMPT,RELEASE_MODE,RELEASE_REPORT_ENV_FROZEN
          script: |
            set -euo pipefail
            [[ "$RELEASE_REPORT_ENV_FROZEN" = true && "$RELEASE_REF" = refs/heads/ops/release-progress-v4-20261019 && "$RELEASE_ATTEMPT" = 1 && "$RELEASE_MODE" = report-env ]] || exit 1
            cd /opt/rr-portal
            python3 -B - <<'PY'
            import hashlib,json,pathlib,subprocess,sys
            stage='source-bytes';R=pathlib.Path('/opt/rr-portal');CID='c4a4386e1b79b072d9a86bca5fba024791b7b99682cab04295045a4d4da3ead7'
            def read(args):
             p=subprocess.run(args,stdout=subprocess.PIPE,stderr=subprocess.DEVNULL,timeout=15,cwd=R);assert p.returncode==0 and len(p.stdout)<=33554432;return p.stdout
            try:
             raw=read(['git','show','ce7588d3c181f9ca7d9806541c0dd572d552665c:deploy/ops/release-environment-proof.py']);assert hashlib.sha256(raw).hexdigest()=='9ba097453d46298d6e16e8a3ea5051f08dbe1e3cf39711ef4c8f75bc4f257480'
             m={'__name__':'reviewed_readonly_environment','__file__':'reviewed-git-object'};exec(compile(raw,'reviewed-environment-proof','exec'),m)
             stage='original-baseline';B=R/'deploy/backups/release-937-943-944-945-946-950-20261019-v2';manifest=m['private_read'](B/'manifest.json',1048576);assert m['sha'](manifest)=='22483bb8f1a2e799ad6bcd14f48c2b60c2913d74ad9a03207c39c8b6f761f93f'
             index=m['decoded'](manifest);baseline=m['private_read'](B/'baseline.private.json',33554432);assert m['sha'](baseline)==index['baseline.private.json'];expected=m['decoded'](baseline)['runtime']['services']['qc-report']
             stage='old-inspection';old=m['records'](m['old_inspections']())[expected['id']];oldrows,a=m['bound_environment'](old,expected,'qc-report')
             stage='current-inspection';new=m['records'](m['decoded'](read(['docker','inspect',CID])))[CID];actual={'id':CID,'image':new['Image'],'environmentSHA256':m['sha'](m['encoded'](new['Config']['Env']))};newrows,b=m['bound_environment'](new,actual,'qc-report')
             changed=sorted(k for k in a.keys()&b.keys()if a[k]!=b[k]);added=sorted(b.keys()-a.keys());removed=sorted(a.keys()-b.keys())
             print(json.dumps({'success':None,'stage':'runtime-key-delta','changedKeys':changed,'addedKeys':added,'removedKeys':removed,'strictMapEqual':a==b},sort_keys=True),flush=True)
             stage='two-image-defaults';imageids=sorted({expected['image'],actual['image']});imagerows=m['decoded'](read(['docker','image','inspect',*imageids]));assert type(imagerows)is list and len(imagerows)==len(imageids);images={v['Id']:v for v in imagerows};assert set(images)==set(imageids)
             oldimage=m['environments'](images[expected['image']]['Config']['Env']);newimage=m['environments'](images[actual['image']]['Config']['Env'])
             stage='compose-key-presence';compose=m['decoded'](read(['docker','compose','-p','rr-portal','-f',str(R/'docker-compose.cloud.yml'),'--env-file',str(R/'.env.cloud.production'),'config','--format','json']));explicit=compose['services']['qc-report'].get('environment',{});assert type(explicit)is dict
             proof={k:{'oldMatchesOwnImageDefault':k in a and k in oldimage and a[k]==oldimage[k],'newMatchesOwnImageDefault':k in b and k in newimage and b[k]==newimage[k],'composeExplicitKeyPresent':k in explicit}for k in sorted(set(changed+added+removed))}
             print(json.dumps({'success':True,'stage':'completed','changedKeys':changed,'addedKeys':added,'removedKeys':removed,'uniqueEnvironmentMapsEqual':a==b,'strictArraySHAEqual':m['sha'](m['encoded'](oldrows))==actual['environmentSHA256'],'imageDefaultProof':proof},sort_keys=True))
            except Exception as e:print(json.dumps({'success':False,'stage':stage,'exceptionType':type(e).__name__},sort_keys=True));sys.exit(1)
            PY
