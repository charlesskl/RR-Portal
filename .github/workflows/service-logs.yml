name: PR 1046-1049 Scoped Release
on:
  workflow_dispatch:
    inputs:
      mode: {type: choice, required: true, options: [maintain]}
permissions:
  contents: read
concurrency:
  group: deploy-cloud
  queue: max
  cancel-in-progress: false
env:
  SCOPED_RELEASE_WORKFLOW_PIN: 'true'
  SCOPED_RELEASE_HELPER_SHA256: '13a1c67f86ee396cab40dbc3e93ed7d589d3a987ca5807861a2a6ac73dbc0bfa'
jobs:
  fixed-scoped-phase:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Validate exact reviewed phase and SSH host fingerprint
        shell: bash
        env:
          RELEASE_BRANCH: ${{ github.ref }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_ATTEMPT: ${{ github.run_attempt }}
          RELEASE_MODE: ${{ inputs.mode }}
          CLOUD_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
        run: |
          set -euo pipefail
          [[ "$SCOPED_RELEASE_WORKFLOW_PIN" = true && "$SCOPED_RELEASE_HELPER_SHA256" = 13a1c67f86ee396cab40dbc3e93ed7d589d3a987ca5807861a2a6ac73dbc0bfa ]] || exit 1
          [[ "$RELEASE_BRANCH" = refs/heads/codex/ops-pr-1046-1049-20261031 && "$RELEASE_ATTEMPT" = 1 && "$RELEASE_MODE" = maintain && "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]] || exit 1
          [[ "$CLOUD_HOST_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]{43}=?$ ]] || exit 1
      - name: Run exact scoped maintain helper
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        env:
          RELEASE_BRANCH: ${{ github.ref }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_ATTEMPT: ${{ github.run_attempt }}
          RELEASE_MODE: ${{ inputs.mode }}
          CLOUD_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
        with:
          host: ${{ secrets.CLOUD_HOST }}
          username: ${{ secrets.CLOUD_USER }}
          key: ${{ secrets.CLOUD_SSH_KEY }}
          fingerprint: ${{ env.CLOUD_HOST_FINGERPRINT }}
          command_timeout: 24m
          envs: RELEASE_BRANCH,RELEASE_SHA,RELEASE_ATTEMPT,RELEASE_MODE,SCOPED_RELEASE_WORKFLOW_PIN,SCOPED_RELEASE_HELPER_SHA256
          script: |
            set -euo pipefail
            [[ "$SCOPED_RELEASE_WORKFLOW_PIN" = true && "$SCOPED_RELEASE_HELPER_SHA256" = 13a1c67f86ee396cab40dbc3e93ed7d589d3a987ca5807861a2a6ac73dbc0bfa ]] || exit 1
            [[ "$RELEASE_BRANCH" = refs/heads/codex/ops-pr-1046-1049-20261031 && "$RELEASE_ATTEMPT" = 1 && "$RELEASE_MODE" = maintain && "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]] || exit 1
            cd /opt/rr-portal
            timeout --signal=TERM --kill-after=2s 60s git -c core.hooksPath=/dev/null fetch --no-write-fetch-head origin +refs/heads/codex/ops-pr-1046-1049-20261031:refs/remotes/origin/codex/ops-pr-1046-1049-20261031 >/dev/null 2>&1 || exit 1
            [[ "$(git rev-parse refs/remotes/origin/codex/ops-pr-1046-1049-20261031)" = "$RELEASE_SHA" ]] || exit 1
            umask 077
            indo_tmp=$(mktemp -d /tmp/batch1046-1049.XXXXXX)
            trap 'rm -rf "$indo_tmp"' EXIT
            git show "$RELEASE_SHA:deploy/ops/pr1048-selected-cache-cleanup-r3.py" > "$indo_tmp/run.py" 2>/dev/null || exit 1
            [[ "$(sha256sum "$indo_tmp/run.py" | cut -d ' ' -f1)" = 13a1c67f86ee396cab40dbc3e93ed7d589d3a987ca5807861a2a6ac73dbc0bfa ]] || exit 1
            git show "$RELEASE_SHA:deploy/ops/pr1048-owned-allocation-diagnose.py" > "$indo_tmp/pr1048-owned-allocation-diagnose.py" 2>/dev/null || exit 1
            [[ "$(sha256sum "$indo_tmp/pr1048-owned-allocation-diagnose.py" | cut -d ' ' -f1)" = 23dbbb93db30922dbc7ac922293a246bcb8340574b3850c6c5b508a86d5d6658 ]] || exit 1
            timeout --signal=TERM --kill-after=30s 22m python3 -B "$indo_tmp/run.py" maintain
