name: PR 969 970 972 974 Reviewed Release
on:
  workflow_dispatch:
    inputs:
      mode: {type: choice, required: true, options: [prepare, deploy, verify]}
permissions:
  contents: read
concurrency:
  group: deploy-cloud
  queue: max
  cancel-in-progress: false
env:
  BATCH_EXECUTION_WORKFLOW_PIN: 'true'
  BATCH_EXECUTION_HELPER_SHA256: '6273469870b4e49e70136a8c953b58bfb40947fd7355debe6e6ac39de99ede43'
  BATCH_CORE_LIBRARY_SHA256: '4745c90f126cf46106b0f170a3ebc6b24ccb64c0e963e427d13308d5cb5b54f5'
  BATCH_SOURCE_MANIFEST_SHA256: '7efb90de8b783dee9241c6e239d6a72cd9946dccad5f509d86cac62ac2041799'
jobs:
  fixed-four-service-release:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Validate reviewed workflow, branch and first attempt
        shell: bash
        env:
          RELEASE_BRANCH: ${{ github.ref }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_ATTEMPT: ${{ github.run_attempt }}
          RELEASE_MODE: ${{ inputs.mode }}
          CLOUD_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
        run: |
          set -euo pipefail
          [[ "$BATCH_EXECUTION_WORKFLOW_PIN" = true && "$BATCH_EXECUTION_HELPER_SHA256" =~ ^[a-f0-9]{64}$ && "$BATCH_CORE_LIBRARY_SHA256" =~ ^[a-f0-9]{64}$ && "$BATCH_SOURCE_MANIFEST_SHA256" =~ ^[a-f0-9]{64}$ ]] || exit 1
          [[ "$RELEASE_BRANCH" = refs/heads/ops/batch-969-970-972-974-20261021 && "$RELEASE_ATTEMPT" = 1 && "$RELEASE_MODE" =~ ^(prepare|deploy|verify)$ ]] || exit 1
          [[ "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ && "$CLOUD_HOST_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]{43}=?$ ]] || exit 1
      - name: Execute only fixed reviewed release phase
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        env:
          RELEASE_BRANCH: ${{ github.ref }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_ATTEMPT: ${{ github.run_attempt }}
          RELEASE_MODE: ${{ inputs.mode }}
          CLOUD_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
        with:
          host: ${{ secrets.CLOUD_HOST }}
          username: ${{ secrets.CLOUD_USER }}
          key: ${{ secrets.CLOUD_SSH_KEY }}
          fingerprint: ${{ env.CLOUD_HOST_FINGERPRINT }}
          command_timeout: 65m
          envs: RELEASE_BRANCH,RELEASE_SHA,RELEASE_ATTEMPT,RELEASE_MODE,BATCH_EXECUTION_WORKFLOW_PIN,BATCH_EXECUTION_HELPER_SHA256,BATCH_CORE_LIBRARY_SHA256,BATCH_SOURCE_MANIFEST_SHA256
          script: |
            set -euo pipefail
            [[ "$BATCH_EXECUTION_WORKFLOW_PIN" = true && "$BATCH_EXECUTION_HELPER_SHA256" =~ ^[a-f0-9]{64}$ && "$BATCH_CORE_LIBRARY_SHA256" =~ ^[a-f0-9]{64}$ && "$BATCH_SOURCE_MANIFEST_SHA256" =~ ^[a-f0-9]{64}$ ]] || exit 1
            [[ "$RELEASE_BRANCH" = refs/heads/ops/batch-969-970-972-974-20261021 && "$RELEASE_ATTEMPT" = 1 && "$RELEASE_MODE" =~ ^(prepare|deploy|verify)$ && "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]] || exit 1
            cd /opt/rr-portal
            timeout --signal=TERM --kill-after=2s 60s git -c core.hooksPath=/dev/null fetch --no-write-fetch-head origin ops/batch-969-970-972-974-20261021:refs/rr-portal-batch/969-974-ops >/dev/null 2>&1 || exit 1
            [[ "$(git rev-parse refs/rr-portal-batch/969-974-ops)" = "$RELEASE_SHA" ]] || exit 1
            umask 077
            batch_task_tmp=$(mktemp -d /tmp/batch-969-974-release.XXXXXX)
            trap 'rm -rf "$batch_task_tmp"' EXIT
            git show "$RELEASE_SHA:deploy/ops/batch-969-970-972-974-release-04.py" > "$batch_task_tmp/run.py" 2>/dev/null || exit 1
            [[ "$(sha256sum "$batch_task_tmp/run.py" | cut -d ' ' -f1)" = "$BATCH_EXECUTION_HELPER_SHA256" ]] || exit 1
            git show "$RELEASE_SHA:deploy/ops/batch-backup-library.py" > "$batch_task_tmp/batch-backup-library.py" 2>/dev/null || exit 1
            [[ "$(sha256sum "$batch_task_tmp/batch-backup-library.py" | cut -d ' ' -f1)" = "$BATCH_CORE_LIBRARY_SHA256" ]] || exit 1
            git show "$RELEASE_SHA:deploy/ops/batch-969-970-972-974-reviewed-files.json" > "$batch_task_tmp/batch-969-970-972-974-reviewed-files.json" 2>/dev/null || exit 1
            [[ "$(sha256sum "$batch_task_tmp/batch-969-970-972-974-reviewed-files.json" | cut -d ' ' -f1)" = "$BATCH_SOURCE_MANIFEST_SHA256" ]] || exit 1
            git show "$RELEASE_SHA:deploy/ops/release-data-ops-library.py" > "$batch_task_tmp/release-data-ops-library.py" 2>/dev/null || exit 1
            [[ "$(sha256sum "$batch_task_tmp/release-data-ops-library.py" | cut -d ' ' -f1)" = ff9138a1d5bfed1b10077112da6ebcda2d65240f583e2d0e12ce1325cfbaafd5 ]] || exit 1
            git show "$RELEASE_SHA:deploy/ops/release-data-library.py" > "$batch_task_tmp/release-data-library.py" 2>/dev/null || exit 1
            [[ "$(sha256sum "$batch_task_tmp/release-data-library.py" | cut -d ' ' -f1)" = d63168fd3057f4f2aba2d93f9fab31d2d65c6dd0f3234877d71fcff1e04e62b9 ]] || exit 1
            git show "$RELEASE_SHA:deploy/ops/internal-quote-readonly-library.py" > "$batch_task_tmp/internal-quote-readonly-library.py" 2>/dev/null || exit 1
            [[ "$(sha256sum "$batch_task_tmp/internal-quote-readonly-library.py" | cut -d ' ' -f1)" = be4f901f3444154e5de06766a2d8a0801dba9b847a4ac25f34a84ccebe354e69 ]] || exit 1
            git show "$RELEASE_SHA:deploy/ops/portable-pdb-library.py" > "$batch_task_tmp/portable-pdb-library.py" 2>/dev/null || exit 1
            [[ "$(sha256sum "$batch_task_tmp/portable-pdb-library.py" | cut -d ' ' -f1)" = cf66f655a1e166491c4da67da0824f42ac8cdae3f844044cb5d8f7233ba105c5 ]] || exit 1
            timeout --signal=TERM --kill-after=20s 60m python3 -B "$batch_task_tmp/run.py" "$RELEASE_MODE"
