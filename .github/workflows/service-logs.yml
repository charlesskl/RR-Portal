name: QC Provider 429 Readonly Diagnostic
on:
  workflow_dispatch:
    inputs:
      mode: {type: choice, required: true, options: [diagnose]}
permissions:
  contents: read
concurrency:
  group: deploy-cloud
  queue: max
  cancel-in-progress: false
env:
  QC_DIAGNOSE_WORKFLOW_PIN: 'true'
  QC_DIAGNOSE_HELPER_SHA256: '5bbbe59a627624c8485964bece85d3884583a372a5bcbd90e7f2bb7e87431403'
jobs:
  fixed-qc-provider-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Validate fixed source and first attempt
        shell: bash
        env:
          RELEASE_BRANCH: ${{ github.ref }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_ATTEMPT: ${{ github.run_attempt }}
          RELEASE_MODE: ${{ inputs.mode }}
          CLOUD_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
        run: |
          set -euo pipefail
          [[ "$QC_DIAGNOSE_WORKFLOW_PIN" = true && "$QC_DIAGNOSE_HELPER_SHA256" =~ ^[a-f0-9]{64}$ ]] || exit 1
          [[ "$RELEASE_BRANCH" = refs/heads/ops/qc-provider-429-20261021 && "$RELEASE_ATTEMPT" = 1 && "$RELEASE_MODE" = diagnose ]] || exit 1
          [[ "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ && "$CLOUD_HOST_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]{43}=?$ ]] || exit 1
      - name: Capture bounded private logs and one synthetic error diagnostic
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        env:
          RELEASE_BRANCH: ${{ github.ref }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_ATTEMPT: ${{ github.run_attempt }}
          RELEASE_MODE: ${{ inputs.mode }}
          CLOUD_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
        with:
          host: ${{ secrets.CLOUD_HOST }}
          username: ${{ secrets.CLOUD_USER }}
          key: ${{ secrets.CLOUD_SSH_KEY }}
          fingerprint: ${{ env.CLOUD_HOST_FINGERPRINT }}
          command_timeout: 5m
          envs: RELEASE_BRANCH,RELEASE_SHA,RELEASE_ATTEMPT,RELEASE_MODE,QC_DIAGNOSE_WORKFLOW_PIN,QC_DIAGNOSE_HELPER_SHA256
          script: |
            set -euo pipefail
            [[ "$QC_DIAGNOSE_WORKFLOW_PIN" = true && "$QC_DIAGNOSE_HELPER_SHA256" =~ ^[a-f0-9]{64}$ ]] || exit 1
            [[ "$RELEASE_BRANCH" = refs/heads/ops/qc-provider-429-20261021 && "$RELEASE_ATTEMPT" = 1 && "$RELEASE_MODE" = diagnose && "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]] || exit 1
            cd /opt/rr-portal
            timeout --signal=TERM --kill-after=2s 60s git -c core.hooksPath=/dev/null fetch --no-write-fetch-head origin +refs/heads/ops/qc-provider-429-20261021:refs/remotes/origin/ops/qc-provider-429-20261021 >/dev/null 2>&1 || exit 1
            [[ "$(git rev-parse refs/remotes/origin/ops/qc-provider-429-20261021)" = "$RELEASE_SHA" ]] || exit 1
            umask 077
            qc_diag_tmp=$(mktemp -d /tmp/qc-provider-429-diag.XXXXXX)
            trap 'rm -rf "$qc_diag_tmp"' EXIT
            git show "$RELEASE_SHA:deploy/ops/qc-provider-429-diagnose.py" > "$qc_diag_tmp/run.py" 2>/dev/null || exit 1
            [[ "$(sha256sum "$qc_diag_tmp/run.py" | cut -d ' ' -f1)" = "$QC_DIAGNOSE_HELPER_SHA256" ]] || exit 1
            timeout --signal=TERM --kill-after=10s 3m python3 -B "$qc_diag_tmp/run.py" diagnose
