name: PR 960 966 967 968 Fixed Read Only Source Probe 04
on:
  workflow_dispatch:
    inputs:
      mode: {type: choice, required: true, options: [probe]}
permissions:
  contents: read
concurrency:
  group: deploy-cloud
  queue: max
  cancel-in-progress: false
env:
  SOURCE_PROBE_WORKFLOW_PIN: 'false'
  SOURCE_PROBE_HELPER_SHA256: '7c796cff2b70c8d5bf36841c2f051c6538877bfd317b517dee0117ae4baf18c9'
jobs:
  fixed-read-only-source-probe04:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Validate fixed source and first attempt
        shell: bash
        env:
          RELEASE_BRANCH: ${{ github.ref }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_ATTEMPT: ${{ github.run_attempt }}
          RELEASE_MODE: ${{ inputs.mode }}
          CLOUD_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_PROBE_WORKFLOW_PIN" = true && "$SOURCE_PROBE_HELPER_SHA256" =~ ^[a-f0-9]{64}$ ]] || exit 1
          [[ "$RELEASE_BRANCH" = refs/heads/ops/batch-960-966-967-968-20261020 && "$RELEASE_ATTEMPT" = 1 && "$RELEASE_MODE" = probe ]] || exit 1
          [[ "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ && "$CLOUD_HOST_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]{43}=?$ ]] || exit 1
      - name: Diagnose sealed source capture and QC paths without mutation
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        env:
          RELEASE_BRANCH: ${{ github.ref }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_ATTEMPT: ${{ github.run_attempt }}
          RELEASE_MODE: ${{ inputs.mode }}
          CLOUD_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
        with:
          host: ${{ secrets.CLOUD_HOST }}
          username: ${{ secrets.CLOUD_USER }}
          key: ${{ secrets.CLOUD_SSH_KEY }}
          fingerprint: ${{ env.CLOUD_HOST_FINGERPRINT }}
          command_timeout: 10m
          envs: RELEASE_BRANCH,RELEASE_SHA,RELEASE_ATTEMPT,RELEASE_MODE,SOURCE_PROBE_WORKFLOW_PIN,SOURCE_PROBE_HELPER_SHA256
          script: |
            set -euo pipefail
            [[ "$SOURCE_PROBE_WORKFLOW_PIN" = true && "$SOURCE_PROBE_HELPER_SHA256" =~ ^[a-f0-9]{64}$ ]] || exit 1
            [[ "$RELEASE_BRANCH" = refs/heads/ops/batch-960-966-967-968-20261020 && "$RELEASE_ATTEMPT" = 1 && "$RELEASE_MODE" = probe && "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]] || exit 1
            cd /opt/rr-portal
            timeout --signal=TERM --kill-after=2s 60s git -c core.hooksPath=/dev/null fetch origin ops/batch-960-966-967-968-20261020 >/dev/null 2>&1 || exit 1
            [[ "$(git rev-parse FETCH_HEAD)" = "$RELEASE_SHA" ]] || exit 1
            umask 077
            batch_backup_tmp=$(mktemp -d /tmp/batch-960-966-967-968-backup.XXXXXX)
            trap 'rm -rf "$batch_backup_tmp"' EXIT
            git show "$RELEASE_SHA:deploy/ops/batch-960-968-source-probe-04.py" > "$batch_backup_tmp/run.py" 2>/dev/null || exit 1
            [[ "$(sha256sum "$batch_backup_tmp/run.py" | cut -d ' ' -f1)" = "$SOURCE_PROBE_HELPER_SHA256" ]] || exit 1
            timeout --signal=TERM --kill-after=20s 8m python3 -B "$batch_backup_tmp/run.py" probe
