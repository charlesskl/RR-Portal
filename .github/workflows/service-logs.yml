name: Factory Review 973 Read Only Initial Diagnosis
on:
  workflow_dispatch:
    inputs:
      mode: {type: choice, required: true, options: [diagnose]}
permissions:
  contents: read
concurrency:
  group: deploy-cloud
  queue: max
  cancel-in-progress: false
env:
  FACTORY_DIAG_WORKFLOW_PIN: 'false'
  FACTORY_DIAG_HELPER_SHA256: '23c32a231db50b0c2089ee183dd662c9adb2b7c37f6dfd08e0ebd483c5cd8c41'
jobs:
  fixed-factory-review-diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Validate fixed source and first attempt
        shell: bash
        env:
          RELEASE_BRANCH: ${{ github.ref }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_ATTEMPT: ${{ github.run_attempt }}
          RELEASE_MODE: ${{ inputs.mode }}
          CLOUD_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
        run: |
          set -euo pipefail
          [[ "$FACTORY_DIAG_WORKFLOW_PIN" = true && "$FACTORY_DIAG_HELPER_SHA256" =~ ^[a-f0-9]{64}$ ]] || exit 1
          [[ "$RELEASE_BRANCH" = refs/heads/ops/factory-review-973-20261021 && "$RELEASE_ATTEMPT" = 1 && "$RELEASE_MODE" = diagnose ]] || exit 1
          [[ "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ && "$CLOUD_HOST_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]{43}=?$ ]] || exit 1
      - name: Read sealed failure frames and current preflight facts
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        env:
          RELEASE_BRANCH: ${{ github.ref }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_ATTEMPT: ${{ github.run_attempt }}
          RELEASE_MODE: ${{ inputs.mode }}
          CLOUD_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
        with:
          host: ${{ secrets.CLOUD_HOST }}
          username: ${{ secrets.CLOUD_USER }}
          key: ${{ secrets.CLOUD_SSH_KEY }}
          fingerprint: ${{ env.CLOUD_HOST_FINGERPRINT }}
          command_timeout: 10m
          envs: RELEASE_BRANCH,RELEASE_SHA,RELEASE_ATTEMPT,RELEASE_MODE,FACTORY_DIAG_WORKFLOW_PIN,FACTORY_DIAG_HELPER_SHA256
          script: |
            set -euo pipefail
            [[ "$FACTORY_DIAG_WORKFLOW_PIN" = true && "$FACTORY_DIAG_HELPER_SHA256" =~ ^[a-f0-9]{64}$ ]] || exit 1
            [[ "$RELEASE_BRANCH" = refs/heads/ops/factory-review-973-20261021 && "$RELEASE_ATTEMPT" = 1 && "$RELEASE_MODE" = diagnose && "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]] || exit 1
            cd /opt/rr-portal
            timeout --signal=TERM --kill-after=2s 60s git -c core.hooksPath=/dev/null fetch --no-write-fetch-head origin +refs/heads/ops/factory-review-973-20261021:refs/remotes/origin/ops/factory-review-973-20261021 >/dev/null 2>&1 || exit 1
            [[ "$(git rev-parse refs/remotes/origin/ops/factory-review-973-20261021)" = "$RELEASE_SHA" ]] || exit 1
            umask 077
            factory_diag_tmp=$(mktemp -d /tmp/factory-973-diagnose.XXXXXX)
            trap 'rm -rf "$factory_diag_tmp"' EXIT
            git show "$RELEASE_SHA:deploy/ops/factory-review-973-diagnose.py" > "$factory_diag_tmp/run.py" 2>/dev/null || exit 1
            git show "$RELEASE_SHA:deploy/ops/factory-review-973-release.py" > "$factory_diag_tmp/factory-release-library.py" 2>/dev/null || exit 1
            git show "$RELEASE_SHA:deploy/ops/factory-review-973-backup.py" > "$factory_diag_tmp/factory-review-backup-library.py" 2>/dev/null || exit 1
            git show "$RELEASE_SHA:deploy/ops/release-data-ops-library.py" > "$factory_diag_tmp/release-data-ops-library.py" 2>/dev/null || exit 1
            git show "$RELEASE_SHA:deploy/ops/release-data-library.py" > "$factory_diag_tmp/release-data-library.py" 2>/dev/null || exit 1
            [[ "$(sha256sum "$factory_diag_tmp/run.py" | cut -d ' ' -f1)" = "$FACTORY_DIAG_HELPER_SHA256" ]] || exit 1
            [[ "$(sha256sum "$factory_diag_tmp/factory-release-library.py" | cut -d ' ' -f1)" = 8c7f870eddbdadb093c50761ba177d63b2cd37a3eab9a5a1b240efa18f010b3e ]] || exit 1
            [[ "$(sha256sum "$factory_diag_tmp/factory-review-backup-library.py" | cut -d ' ' -f1)" = 587812a638756e0eb7e7bcf1cb5042a5f7531d1b3c0e3200be77f894627b9b39 ]] || exit 1
            [[ "$(sha256sum "$factory_diag_tmp/release-data-ops-library.py" | cut -d ' ' -f1)" = ff9138a1d5bfed1b10077112da6ebcda2d65240f583e2d0e12ce1325cfbaafd5 ]] || exit 1
            [[ "$(sha256sum "$factory_diag_tmp/release-data-library.py" | cut -d ' ' -f1)" = d63168fd3057f4f2aba2d93f9fab31d2d65c6dd0f3234877d71fcff1e04e62b9 ]] || exit 1
            timeout --signal=TERM --kill-after=20s 8m python3 -B "$factory_diag_tmp/run.py" diagnose
