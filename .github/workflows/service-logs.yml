name: Service Logs

# 通用服务日志诊断（手动触发）：查看任意 compose 服务的容器状态、健康检查结果与日志。
# 背景：2026-09-15 voyageplex 上线时 api 容器 unhealthy，仓库里没有一个能看任意服务日志的
# 入口，只能靠猜。此 workflow 填补该空缺。
#   service —— compose 服务名（如 voyageplex-api）；容器名按 rr-portal-<service>-1 推导
#   tail    —— 日志行数，默认 100

on:
  workflow_dispatch:
    inputs:
      service:
        description: "compose 服务名（如 voyageplex-api）"
        type: string
        required: true
      tail:
        description: "日志行数"
        type: string
        required: false
        default: "100"
      tomy_smoke:
        description: "仅 TOMY：使用合成文件验证上传核对及 ZIP 下载"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-cloud
  queue: max
  cancel-in-progress: false

jobs:
  logs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate SSH host fingerprint
        shell: bash
        env:
          CLOUD_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
        run: |
          set -euo pipefail
          if [[ ! "$CLOUD_HOST_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]{43}=?$ ]]; then
            echo 'CLOUD_HOST_FINGERPRINT must be a non-empty OpenSSH SHA256 fingerprint.' >&2
            exit 1
          fi

      - name: Fetch service logs via SSH
        env:
          CLOUD_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
          OPS_SERVICE: ${{ inputs.service }}
          OPS_TAIL: ${{ inputs.tail }}
          TOMY_SMOKE: ${{ inputs.tomy_smoke }}
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        with:
          host: ${{ secrets.CLOUD_HOST }}
          username: ${{ secrets.CLOUD_USER }}
          key: ${{ secrets.CLOUD_SSH_KEY }}
          fingerprint: ${{ env.CLOUD_HOST_FINGERPRINT }}
          command_timeout: 5m
          envs: OPS_SERVICE,OPS_TAIL,TOMY_SMOKE
          script: |
            set -euo pipefail
            [ "${OPS_SERVICE}" = "erp-api" ] || { echo "ERP-only preflight" >&2; exit 1; }
            python3 - <<'P113_PREFLIGHT_PY'
            import hashlib,json,subprocess,sys,os
            from pathlib import Path

            def cmd(args,**kw):
                return subprocess.run(args,check=True,capture_output=True,**kw).stdout

            def inspect(name):
                a=json.loads(cmd(['docker','inspect',name]))
                assert len(a)==1
                return a[0]

            result={'operation':'erp-p112-p113-readonly-preflight','sqlWrites':0,'processChanges':0,'containers':{}}
            for name in ['rr-portal-erp-api-1','rr-portal-erp-sqlserver-1','rr-portal-nginx-1']:
                a=inspect(name)
                result['containers'][name]={'id':a['Id'],'image':a['Image'],'created':a['Created'],'started':a['State']['StartedAt'],'running':a['State']['Running'],'health':a['State'].get('Health',{}).get('Status'),'mounts':[{'type':x['Type'],'source':x['Source'],'destination':x['Destination'],'rw':x['RW']} for x in a['Mounts']],'environmentSha256':hashlib.sha256(json.dumps(sorted(a['Config']['Env']),separators=(',',':')).encode()).hexdigest(),'environmentKeys':[x.split('=',1)[0] for x in a['Config']['Env']],'networks':list(a['NetworkSettings']['Networks'])}
            result['checkoutHead']=cmd(['git','-C','/opt/rr-portal','rev-parse','HEAD']).decode().strip()
            result['erpLastCommit']=cmd(['git','-C','/opt/rr-portal','log','-1','--format=%H','--','apps/ERP']).decode().strip()
            result['apiBinarySha256']=cmd(['docker','exec','rr-portal-erp-api-1','sha256sum','/app/ErpApi.dll']).decode().split()[0]
            result['sqlDatabaseMountIdentity']=result['containers']['rr-portal-erp-sqlserver-1']['mounts']
            print('P113_PREFLIGHT_IDENTITY='+json.dumps(result,ensure_ascii=False,separators=(',',':')))
            assert result['containers']['rr-portal-erp-api-1']['running']
            assert result['containers']['rr-portal-erp-sqlserver-1']['running']
            assert any(x['destination']=='/var/opt/mssql' and x['type']=='bind' for x in result['sqlDatabaseMountIdentity'])

            sql=''
            import base64
            client_command = 'set -eu; export SQLCMDPASSWORD="$MSSQL_SA_PASSWORD"; if [ -x /opt/mssql-tools18/bin/sqlcmd ]; then client=/opt/mssql-tools18/bin/sqlcmd; else client=/opt/mssql-tools/bin/sqlcmd; fi; exec "$client" -C -S 127.0.0.1 -U sa -d erp -b -r1 -h -1 -W -w 65535 -s "|"'
            r=subprocess.run(['docker','exec','-i','rr-portal-erp-sqlserver-1','sh','-c',client_command],input=base64.b64decode(sql),capture_output=True)
            print('P113_PREFLIGHT_SQL_BEGIN')
            sys.stdout.write(r.stdout.decode('utf-8',errors='replace'))
            print('P113_PREFLIGHT_SQL_END')
            if r.returncode:
                sys.stderr.write(r.stderr.decode('utf-8',errors='replace'))
                raise RuntimeError('Read-only SQL preflight failed: '+str(r.returncode))
            print('P113_PREFLIGHT_COMPLETE=true')

            P113_PREFLIGHT_PY
