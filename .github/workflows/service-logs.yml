name: Engineering Admin Access
on:
  workflow_dispatch:
    inputs:
      mode: {type: choice, required: true, options: [verify]}
permissions:
  contents: read
concurrency:
  group: deploy-cloud
  queue: max
  cancel-in-progress: false
env:
  SCOPED_RELEASE_WORKFLOW_PIN: 'false'
  SCOPED_RELEASE_HELPER_SHA256: 'f503abd16e913009ae3e8c71ba1f29fe528a46f66f58168d7b9596b272cc9628'
jobs:
  scoped-operation:
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Validate exact branch and SSH host fingerprint
        shell: bash
        env:
          RELEASE_BRANCH: ${{ github.ref }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_ATTEMPT: ${{ github.run_attempt }}
          RELEASE_MODE: ${{ inputs.mode }}
          CLOUD_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
        run: |
          set -euo pipefail
          [[ "$SCOPED_RELEASE_WORKFLOW_PIN" = true && "$SCOPED_RELEASE_HELPER_SHA256" = f503abd16e913009ae3e8c71ba1f29fe528a46f66f58168d7b9596b272cc9628 ]] || exit 1
          [[ "$RELEASE_BRANCH" = refs/heads/codex/ops-engineering-admin-access-20261103 && "$RELEASE_ATTEMPT" = 1 && "$RELEASE_MODE" = verify && "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]] || exit 1
          [[ "$CLOUD_HOST_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]{43}=?$ ]] || exit 1
      - name: Run bounded reviewed operation
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        env:
          RELEASE_BRANCH: ${{ github.ref }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_ATTEMPT: ${{ github.run_attempt }}
          RELEASE_MODE: ${{ inputs.mode }}
          CLOUD_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
        with:
          host: ${{ secrets.CLOUD_HOST }}
          username: ${{ secrets.CLOUD_USER }}
          key: ${{ secrets.CLOUD_SSH_KEY }}
          fingerprint: ${{ env.CLOUD_HOST_FINGERPRINT }}
          command_timeout: 6m
          envs: RELEASE_BRANCH,RELEASE_SHA,RELEASE_ATTEMPT,RELEASE_MODE,SCOPED_RELEASE_WORKFLOW_PIN,SCOPED_RELEASE_HELPER_SHA256
          script: |
            set -euo pipefail
            [[ "$SCOPED_RELEASE_WORKFLOW_PIN" = true && "$SCOPED_RELEASE_HELPER_SHA256" = f503abd16e913009ae3e8c71ba1f29fe528a46f66f58168d7b9596b272cc9628 ]] || exit 1
            [[ "$RELEASE_BRANCH" = refs/heads/codex/ops-engineering-admin-access-20261103 && "$RELEASE_ATTEMPT" = 1 && "$RELEASE_MODE" = verify && "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]] || exit 1
            cd /opt/rr-portal
            timeout --signal=TERM --kill-after=2s 60s git -c core.hooksPath=/dev/null fetch --no-write-fetch-head origin +refs/heads/codex/ops-engineering-admin-access-20261103:refs/remotes/origin/codex/ops-engineering-admin-access-20261103 >/dev/null 2>&1 || exit 1
            [[ "$(git rev-parse refs/remotes/origin/codex/ops-engineering-admin-access-20261103)" = "$RELEASE_SHA" ]] || exit 1
            umask 077
            batch_tmp=$(mktemp -d /tmp/engineering-admin-access.XXXXXX)
            trap 'rm -rf "$batch_tmp"' EXIT
            git show "$RELEASE_SHA:deploy/ops/engineering-admin-access.py" > "$batch_tmp/run.py" 2>/dev/null || exit 1
            [[ "$(sha256sum "$batch_tmp/run.py" | cut -d ' ' -f1)" = f503abd16e913009ae3e8c71ba1f29fe528a46f66f58168d7b9596b272cc9628 ]] || exit 1
            git show "$RELEASE_SHA:deploy/ops/account_transaction.py" > "$batch_tmp/account_transaction.py" 2>/dev/null || exit 1
            [[ "$(sha256sum "$batch_tmp/account_transaction.py" | cut -d ' ' -f1)" = ac32dd86b8ac8d56f2cd0f8940c2649f83815b14dc36502b2b1857a030424b64 ]] || exit 1
            export ACCOUNT_SCOPE_SHA256=156c0b41ead9816ff65b8caf904c865512a5e3fe5b3ddd7a6d6473dfa123aa50
            export ACCOUNT_DIAGNOSE_SHA256=c67e290bab20d949af40d19d356ba705ca76033267fa4155006437de620ef55b
            timeout --signal=TERM --kill-after=10s 4m python3 -B "$batch_tmp/run.py" verify
