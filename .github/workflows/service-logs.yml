name: VoyagePlex Reviewed Mail Recovery
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        required: true
        options: [backup, recover, audit]
permissions:
  contents: read
concurrency:
  group: voyageplex-mail-recovery-20261019
  queue: max
  cancel-in-progress: false
jobs:
  reviewed-operation:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - name: Validate fixed branch and first workflow attempt
        shell: bash
        env:
          MAIL_RECOVERY_BRANCH: ${{ github.ref }}
          MAIL_RECOVERY_SHA: ${{ github.sha }}
          MAIL_RECOVERY_ATTEMPT: ${{ github.run_attempt }}
          MAIL_RECOVERY_RUN_ID: ${{ github.run_id }}
          MAIL_RECOVERY_MODE: ${{ inputs.mode }}
          CLOUD_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
        run: |
          set -euo pipefail
          [[ "$MAIL_RECOVERY_BRANCH" = refs/heads/ops/voyageplex-mail-recovery-20261019 && "$MAIL_RECOVERY_ATTEMPT" = 1 ]] || exit 1
          [[ "$MAIL_RECOVERY_SHA" =~ ^[a-f0-9]{40}$ && "$MAIL_RECOVERY_RUN_ID" =~ ^[1-9][0-9]{5,19}$ ]] || exit 1
          [[ "$MAIL_RECOVERY_MODE" =~ ^(backup|recover|audit)$ && "$CLOUD_HOST_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]{43}=?$ ]] || exit 1
      - name: Execute exact reviewed helper without changing server checkout
        env:
          MAIL_RECOVERY_BRANCH: ${{ github.ref }}
          MAIL_RECOVERY_SHA: ${{ github.sha }}
          MAIL_RECOVERY_ATTEMPT: ${{ github.run_attempt }}
          MAIL_RECOVERY_RUN_ID: ${{ github.run_id }}
          MAIL_RECOVERY_MODE: ${{ inputs.mode }}
          CLOUD_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        with:
          host: ${{ secrets.CLOUD_HOST }}
          username: ${{ secrets.CLOUD_USER }}
          key: ${{ secrets.CLOUD_SSH_KEY }}
          fingerprint: ${{ env.CLOUD_HOST_FINGERPRINT }}
          command_timeout: 22m
          envs: MAIL_RECOVERY_BRANCH,MAIL_RECOVERY_SHA,MAIL_RECOVERY_ATTEMPT,MAIL_RECOVERY_RUN_ID,MAIL_RECOVERY_MODE
          script: |
            set -euo pipefail
            [[ "$MAIL_RECOVERY_BRANCH" = refs/heads/ops/voyageplex-mail-recovery-20261019 && "$MAIL_RECOVERY_ATTEMPT" = 1 ]] || exit 1
            [[ "$MAIL_RECOVERY_SHA" =~ ^[a-f0-9]{40}$ && "$MAIL_RECOVERY_RUN_ID" =~ ^[1-9][0-9]{5,19}$ && "$MAIL_RECOVERY_MODE" =~ ^(backup|recover|audit)$ ]] || exit 1
            cd /opt/rr-portal
            git fetch origin ops/voyageplex-mail-recovery-20261019 >/dev/null 2>&1 || { echo MAIL_RECOVERY_FIXED_FETCH_FAILED; exit 1; }
            [[ "$(git rev-parse FETCH_HEAD)" = "$MAIL_RECOVERY_SHA" ]] || { echo MAIL_RECOVERY_EXACT_HEAD_MISMATCH; exit 1; }
            umask 077
            mail_recovery_tmp=$(mktemp -d /tmp/mail-recovery.XXXXXX)
            trap 'rm -rf "$mail_recovery_tmp"' EXIT
            git show "$MAIL_RECOVERY_SHA:deploy/ops/voyageplex-mail-recovery.py" > "$mail_recovery_tmp/run.py" 2>/dev/null || { echo MAIL_RECOVERY_HELPER_READ_FAILED; exit 1; }
            timeout --signal=TERM --kill-after=20s 21m python3 "$mail_recovery_tmp/run.py" "$MAIL_RECOVERY_MODE"
