name: PR1008 Read-only Failed Deployment Diagnostic
on:
  workflow_dispatch:
    inputs:
      mode: {type: choice, required: true, options: [read-deploy-failure]}
permissions:
  contents: read
concurrency:
  group: deploy-cloud
  queue: max
  cancel-in-progress: false
env:
  SCOPED_RELEASE_WORKFLOW_PIN: 'false'
  SCOPED_RELEASE_HELPER_SHA256: '959ddf46ff40325e0b2484681468c75062f30f860fb4dcbd81bb03877a0279f9'
jobs:
  fixed-scoped-release:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Validate exact phase, branch and first attempt
        shell: bash
        env:
          RELEASE_BRANCH: ${{ github.ref }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_ATTEMPT: ${{ github.run_attempt }}
          RELEASE_MODE: ${{ inputs.mode }}
          CLOUD_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
        run: |
          set -euo pipefail
          [[ "$SCOPED_RELEASE_WORKFLOW_PIN" = true && "$SCOPED_RELEASE_HELPER_SHA256" =~ ^[a-f0-9]{64}$ ]] || exit 1
          [[ "$RELEASE_BRANCH" = refs/heads/ops/pr-1008-20261026-02 && "$RELEASE_ATTEMPT" = 1 && "$RELEASE_MODE" = read-deploy-failure ]] || exit 1
          [[ "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ && "$CLOUD_HOST_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]{43}=?$ ]] || exit 1
      - name: Run only reviewed sealed deploy failure read-deploy-failure
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        env:
          RELEASE_BRANCH: ${{ github.ref }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_ATTEMPT: ${{ github.run_attempt }}
          RELEASE_MODE: ${{ inputs.mode }}
          CLOUD_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
        with:
          host: ${{ secrets.CLOUD_HOST }}
          username: ${{ secrets.CLOUD_USER }}
          key: ${{ secrets.CLOUD_SSH_KEY }}
          fingerprint: ${{ env.CLOUD_HOST_FINGERPRINT }}
          command_timeout: 70m
          envs: RELEASE_BRANCH,RELEASE_SHA,RELEASE_ATTEMPT,RELEASE_MODE,SCOPED_RELEASE_WORKFLOW_PIN,SCOPED_RELEASE_HELPER_SHA256
          script: |
            set -euo pipefail
            [[ "$SCOPED_RELEASE_WORKFLOW_PIN" = true && "$SCOPED_RELEASE_HELPER_SHA256" =~ ^[a-f0-9]{64}$ ]] || exit 1
            [[ "$RELEASE_BRANCH" = refs/heads/ops/pr-1008-20261026-02 && "$RELEASE_ATTEMPT" = 1 && "$RELEASE_MODE" = read-deploy-failure && "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]] || exit 1
            cd /opt/rr-portal
            timeout --signal=TERM --kill-after=2s 60s git -c core.hooksPath=/dev/null fetch --no-write-fetch-head origin +refs/heads/ops/pr-1008-20261026-02:refs/remotes/origin/ops/pr-1008-20261026-02 >/dev/null 2>&1 || exit 1
            [[ "$(git rev-parse refs/remotes/origin/ops/pr-1008-20261026-02)" = "$RELEASE_SHA" ]] || exit 1
            umask 077
            scoped_release_tmp=$(mktemp -d /tmp/pr1008-03-deploy-failure-read.XXXXXX)
            trap 'rm -rf "$scoped_release_tmp"' EXIT
            git show "$RELEASE_SHA:deploy/ops/pr1008-03-deploy-failure-read.py" > "$scoped_release_tmp/run.py" 2>/dev/null || exit 1
            [[ "$(sha256sum "$scoped_release_tmp/run.py" | cut -d ' ' -f1)" = 959ddf46ff40325e0b2484681468c75062f30f860fb4dcbd81bb03877a0279f9 ]] || exit 1
            git show "$RELEASE_SHA:deploy/ops/pr1008-03-deploy-failure-read-source-review-root.json" > "$scoped_release_tmp/pr1008-03-deploy-failure-read-source-review-root.json" 2>/dev/null || exit 1
            [[ "$(sha256sum "$scoped_release_tmp/pr1008-03-deploy-failure-read-source-review-root.json" | cut -d ' ' -f1)" = 2cd9bf74c0a77e2a105c644e3b314e0e327f78b089870451cd429b3d57411dbb ]] || exit 1
            timeout --signal=TERM --kill-after=20s 68m python3 -B "$scoped_release_tmp/run.py" "$RELEASE_MODE"
