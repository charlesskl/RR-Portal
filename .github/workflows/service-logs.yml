name: PR 1040 Read-only Connection Diagnostic
on:
  workflow_dispatch:
    inputs:
      mode: {type: choice, required: true, options: [network]}
permissions:
  contents: read
jobs:
  external-read-only-network:
    if: github.ref == 'refs/heads/ops/pr-1040-20261030-quote' && github.run_attempt == 1 && inputs.mode == 'network'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Observe TCP and unauthenticated health without SSH login
        env:
          CLOUD_HOST: ${{ secrets.CLOUD_HOST }}
        run: |
          python3 - <<'PYCODE'
          import os,socket,json,time,re
          host=os.environ['CLOUD_HOST']
          assert re.fullmatch(r'[A-Za-z0-9.-]{1,253}',host)
          output={'readOnly':True,'sshLoginAttempted':False,'serverScriptExecuted':False,'ports':{}}
          for port in (22,80):
              start=time.monotonic()
              try:
                  with socket.create_connection((host,port),timeout=5)as s:
                      row={'tcpConnected':True};s.settimeout(5)
                      if port==22:
                          s.sendall(b'SSH-2.0-RRReadOnlyProbe\r\n')
                          try:row['sshBannerPresent']=s.recv(512).startswith(b'SSH-')
                          except Exception as e:row['responseErrorType']=type(e).__name__
                      else:
                          s.sendall(('GET /internal-quote/health HTTP/1.1\r\nHost: '+host+'\r\nConnection: close\r\n\r\n').encode())
                          try:
                              body=s.recv(512);first=body.split(b'\r\n',1)[0].decode('ascii','replace');row['httpStatus']=int(first.split()[1])if first.startswith('HTTP/')else None
                          except Exception as e:row['responseErrorType']=type(e).__name__
              except Exception as e:row={'tcpConnected':False,'errorType':type(e).__name__}
              row['seconds']=round(time.monotonic()-start,3);output['ports'][port]=row
          print('NETWORK_RESULT='+json.dumps(output,sort_keys=True))
          PYCODE
