             result={'completed':False,'success':False,'businessWritesPerformed':False,'configurationChanged':False,'oldEvidenceModified':False,'oldWebImageSourceVerified':True,'oldWorkerBaselineContainerAndImageBound':True,'sourceAndEnvironmentFrozen':True,'v4ManifestSHA256':sha(raw_manifest),'v4ResultSHA256':sha(receipt_raw),'oldWebImageSourceFile':old_web_file,'oldWebImageSourceSHA256':manifest[old_web_file],'services':{}}
             for role in roles:
              a,b=old[role],new[role];explicit=compose['services'][role].get('environment',{});need(type(explicit)is dict);explicit_keys=set(e['environments']([k+'='for k in explicit]));defaults=e['environments'](original_images[role]['Config'].get('Env')or[]);new_defaults=e['environments'](image_map[b['Image']]['Config'].get('Env')or[])
              row=evidence(e['environments'](a['Config']['Env']),e['environments'](b['Config']['Env']),defaults,new_defaults,explicit_keys);row.update(currentContainer=b['Id'],oldImageIdentifierSHA256=sha(a['Image'].encode()),newImageIdentifierSHA256=sha(b['Image'].encode()),strictArraySame=a['Config']['Env']==b['Config']['Env'],healthcheckSame=a['Config'].get('Healthcheck')==b['Config'].get('Healthcheck'),mountsSame=sorted(a.get('Mounts',[]),key=enc)==sorted(b.get('Mounts',[]),key=enc),memorySame=a['HostConfig'].get('Memory')==b['HostConfig'].get('Memory'),swapSame=a['HostConfig'].get('MemorySwap')==b['HostConfig'].get('MemorySwap'),running=b['State']['Running'],health=b['State'].get('Health',{}).get('Status'),oom=b['State']['OOMKilled'],restarts=b['RestartCount']);result['services'][role]=row
