              for rel,pp in [(relative,paths)]+([('data.db',settings_paths)]if settings_paths else[]):
               for p,a,c in zip(pp,ARCHIVES,captures):need(private_hash(p,512*1024**2)==c[1][key+'/sqlite/'+rel])
             for a in ARCHIVES:need(private_hash(a[0]/'manifest.json',4*1024**2)==a[1]and private_hash(a[0]/'first-result.json',1024**2)==a[2])
             print(enc({'kind':'summary','completed':True,'sealedSnapshotsOnly':True,'liveDatabaseAccessed':False,'businessValuesPrinted':False,'businessOrConfigurationWritesPerformed':False,'retentionIsCompatibilityNotActorAttribution':True,'originalStrictAuditRemainsFailed':True,'createdAtNotAutomaticallyExempted':True}).decode(),flush=True)
