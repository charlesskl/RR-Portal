name: SSH Login Readonly Check
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-cloud
  cancel-in-progress: false
jobs:
  inspect:
    if: github.ref == 'refs/heads/codex/ops-ssh-login-check-20261103' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Validate known host fingerprint
        env:
          FP: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$FP" =~ ^SHA256:[A-Za-z0-9+/]{43}=?$ ]] || exit 1
      - name: Read SSH authentication metadata only
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        env:
          KNOWN_FP: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
        with:
          host: ${{ secrets.CLOUD_HOST }}
          username: ${{ secrets.CLOUD_USER }}
          key: ${{ secrets.CLOUD_SSH_KEY }}
          fingerprint: ${{ env.KNOWN_FP }}
          command_timeout: 1m
          script: |
            set -eu
            timeout --signal=TERM --kill-after=2s 30s python3 -B - <<'PYCODE'
            import json,os,subprocess,shutil
            def run(args):
                p=subprocess.run(args,capture_output=True,text=True,timeout=10)
                if p.returncode:raise RuntimeError('readonly-command-failed')
                return p.stdout
            assert os.geteuid()==0
            assert run(['git','-C','/opt/rr-portal','-c','core.hooksPath=/dev/null','rev-parse','HEAD']).strip()=='f22fbffa1789234fe1c78bf776f4dcb3fe867d0c'
            daemon=shutil.which('sshd')or'/usr/sbin/sshd'
            config={}
            for line in run([daemon,'-T']).splitlines():
                a=line.split(None,1)
                if len(a)==2:config[a[0]]=a[1]
            state=run(['passwd','-S','root']).split()[1]
            assert state in ('P','L','NP')
            allowed=('port','passwordauthentication','pubkeyauthentication','permitrootlogin','kbdinteractiveauthentication','usepam','authenticationmethods')
            result={'effective_uid':os.geteuid(),'pw_state':state,'default_sshd':{k:config.get(k)for k in allowed},'cleartext_password_retrieved':False,'configuration_changes':False}
            print(json.dumps(result,sort_keys=True))
            PYCODE
