name: VoyagePlex Read Only Gateway Logs Only
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-cloud
  queue: max
  cancel-in-progress: false
env:
  READONLY_WORKFLOW_PIN: 'true'
  READONLY_HELPER_SHA256: '5ac285b5a7c4001ea8317ad4495cc29b352ec9be061201d5a431914471a87b07'
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Validate fixed branch first attempt and pinned host
        shell: bash
        env:
          RELEASE_BRANCH: ${{ github.ref }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_ATTEMPT: ${{ github.run_attempt }}
          CLOUD_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
        run: |
          set -euo pipefail
          [[ "$READONLY_WORKFLOW_PIN" = true && "$READONLY_HELPER_SHA256" =~ ^[a-f0-9]{64}$ ]] || exit 1
          [[ "$RELEASE_BRANCH" = refs/heads/ops/mail-readonly-20261020 && "$RELEASE_ATTEMPT" = 1 ]] || exit 1
          [[ "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ && "$CLOUD_HOST_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]{43}=?$ ]] || exit 1
      - name: Capture private evidence and perform bounded read only IMAP observations
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        env:
          RELEASE_BRANCH: ${{ github.ref }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_ATTEMPT: ${{ github.run_attempt }}
          CLOUD_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
        with:
          host: ${{ secrets.CLOUD_HOST }}
          username: ${{ secrets.CLOUD_USER }}
          key: ${{ secrets.CLOUD_SSH_KEY }}
          fingerprint: ${{ env.CLOUD_HOST_FINGERPRINT }}
          command_timeout: 18m
          envs: RELEASE_BRANCH,RELEASE_SHA,RELEASE_ATTEMPT,READONLY_WORKFLOW_PIN,READONLY_HELPER_SHA256
          script: |
            set -euo pipefail
            [[ "$READONLY_WORKFLOW_PIN" = true && "$READONLY_HELPER_SHA256" =~ ^[a-f0-9]{64}$ ]] || exit 1
            [[ "$RELEASE_BRANCH" = refs/heads/ops/mail-readonly-20261020 && "$RELEASE_ATTEMPT" = 1 && "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]] || exit 1
            cd /opt/rr-portal
            timeout --signal=TERM --kill-after=2s 60s git -c core.hooksPath=/dev/null fetch --no-write-fetch-head origin +refs/heads/ops/mail-readonly-20261020:refs/remotes/origin/ops/mail-readonly-20261020 >/dev/null 2>&1 || exit 1
            [[ "$(git rev-parse refs/remotes/origin/ops/mail-readonly-20261020)" = "$RELEASE_SHA" ]] || exit 1
            umask 077
            mail_readonly_tmp=$(mktemp -d /tmp/voyageplex-readonly-evidence.XXXXXX)
            trap 'rm -rf "$mail_readonly_tmp"' EXIT
            git show "$RELEASE_SHA:deploy/ops/voyageplex-nginx-readonly-only.py" > "$mail_readonly_tmp/run.py" 2>/dev/null || exit 1
            [[ "$(sha256sum "$mail_readonly_tmp/run.py" | cut -d ' ' -f1)" = "$READONLY_HELPER_SHA256" ]] || exit 1
            git show "$RELEASE_SHA:deploy/ops/voyageplex-mail-readonly-20261020-03.py" > "$mail_readonly_tmp/nginx-readonly-library.py" 2>/dev/null || exit 1
            [[ "$(sha256sum "$mail_readonly_tmp/nginx-readonly-library.py" | cut -d ' ' -f1)" = 2c5675ab534d1fcac5f28698e5418daf3ca0366b549c0c9b78fb58d95e95d4c0 ]] || exit 1
            git show "$RELEASE_SHA:deploy/ops/batch-backup-library.py" > "$mail_readonly_tmp/batch-backup-library.py" 2>/dev/null || exit 1
            [[ "$(sha256sum "$mail_readonly_tmp/batch-backup-library.py" | cut -d ' ' -f1)" = a06bd4dd932df22b9127cda35a2dd7a8d69fafd879d6619ce3b50aa54252cd5d ]] || exit 1
            git show "$RELEASE_SHA:deploy/ops/release-data-ops-library.py" > "$mail_readonly_tmp/release-data-ops-library.py" 2>/dev/null || exit 1
            [[ "$(sha256sum "$mail_readonly_tmp/release-data-ops-library.py" | cut -d ' ' -f1)" = ff9138a1d5bfed1b10077112da6ebcda2d65240f583e2d0e12ce1325cfbaafd5 ]] || exit 1
            git show "$RELEASE_SHA:deploy/ops/release-data-library.py" > "$mail_readonly_tmp/release-data-library.py" 2>/dev/null || exit 1
            [[ "$(sha256sum "$mail_readonly_tmp/release-data-library.py" | cut -d ' ' -f1)" = d63168fd3057f4f2aba2d93f9fab31d2d65c6dd0f3234877d71fcff1e04e62b9 ]] || exit 1
            git show "$RELEASE_SHA:deploy/ops/internal-quote-readonly-library.py" > "$mail_readonly_tmp/internal-quote-readonly-library.py" 2>/dev/null || exit 1
            [[ "$(sha256sum "$mail_readonly_tmp/internal-quote-readonly-library.py" | cut -d ' ' -f1)" = be4f901f3444154e5de06766a2d8a0801dba9b847a4ac25f34a84ccebe354e69 ]] || exit 1
            git show "$RELEASE_SHA:deploy/ops/portable-pdb-library.py" > "$mail_readonly_tmp/portable-pdb-library.py" 2>/dev/null || exit 1
            [[ "$(sha256sum "$mail_readonly_tmp/portable-pdb-library.py" | cut -d ' ' -f1)" = cf66f655a1e166491c4da67da0824f42ac8cdae3f844044cb5d8f7233ba105c5 ]] || exit 1
            timeout --signal=TERM --kill-after=20s 16m python3 -B "$mail_readonly_tmp/run.py" observe
