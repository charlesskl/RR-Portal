name: Service Logs
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Private VoyagePlex backup or read-only deployment check
        type: choice
        options: [backup, verify]
        default: backup
permissions:
  contents: read
concurrency:
  group: deploy-cloud
  queue: max
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate SSH fingerprint
        env:
          FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
        run: |
          [[ "$FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]{43}=?$ ]] || exit 1
      - name: Private backup or read-only verification
        env:
          VP_MODE: ${{ inputs.mode }}
          VP_REF: ${{ github.sha }}
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        with:
          host: ${{ secrets.CLOUD_HOST }}
          username: ${{ secrets.CLOUD_USER }}
          key: ${{ secrets.CLOUD_SSH_KEY }}
          fingerprint: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
          command_timeout: 8m
          envs: VP_MODE,VP_REF
          script: |
            set -euo pipefail
            [[ "$VP_MODE" =~ ^(backup|verify)$ && "$VP_REF" =~ ^[a-f0-9]{40}$ ]] || exit 1
            cd /opt/rr-portal
            git fetch origin ops/voyageplex-919-20261013 >/dev/null 2>&1 || exit 1
            umask 077
            vp_temporary=$(mktemp -d /tmp/voyageplex-919.XXXXXX)
            trap 'rm -rf "$vp_temporary"' EXIT
            git show "$VP_REF:deploy/ops/voyageplex-919.py" > "$vp_temporary/run.py" 2>/dev/null || exit 1
            python3 "$vp_temporary/run.py" "$VP_MODE"
