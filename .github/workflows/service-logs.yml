name: VoyagePlex 942 Read Only Inventory Diagnostic
on:
  workflow_dispatch:
    inputs:
      mode: {type: choice, required: true, options: [diagnostic]}
permissions:
  contents: read
concurrency:
  group: deploy-cloud
  queue: max
  cancel-in-progress: false
env:
  VOYAGEPLEX_DIAGNOSTIC_WORKFLOW_PIN: 'true'
  VOYAGEPLEX_DIAGNOSTIC_HELPER_SHA256: '49fc43465321ae540991fb3ae8e46da4911068196f10fb67ead897b064e30728'
jobs:
  fixed-voyageplex-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate fixed source and first attempt
        shell: bash
        env:
          RELEASE_BRANCH: ${{ github.ref }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_ATTEMPT: ${{ github.run_attempt }}
          RELEASE_MODE: ${{ inputs.mode }}
          CLOUD_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
        run: |
          set -euo pipefail
          [[ "$VOYAGEPLEX_DIAGNOSTIC_WORKFLOW_PIN" = true && "$VOYAGEPLEX_DIAGNOSTIC_HELPER_SHA256" =~ ^[a-f0-9]{64}$ ]] || exit 1
          [[ "$RELEASE_BRANCH" = refs/heads/ops/voyageplex-942-20261019 && "$RELEASE_ATTEMPT" = 1 && "$RELEASE_MODE" = diagnostic ]] || exit 1
          [[ "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ && "$CLOUD_HOST_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]{43}=?$ ]] || exit 1
      - name: Classify only data inventory rejection without copying or changing it
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        env:
          RELEASE_BRANCH: ${{ github.ref }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_ATTEMPT: ${{ github.run_attempt }}
          RELEASE_MODE: ${{ inputs.mode }}
          CLOUD_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
        with:
          host: ${{ secrets.CLOUD_HOST }}
          username: ${{ secrets.CLOUD_USER }}
          key: ${{ secrets.CLOUD_SSH_KEY }}
          fingerprint: ${{ env.CLOUD_HOST_FINGERPRINT }}
          command_timeout: 4m
          envs: RELEASE_BRANCH,RELEASE_SHA,RELEASE_ATTEMPT,RELEASE_MODE,VOYAGEPLEX_DIAGNOSTIC_WORKFLOW_PIN,VOYAGEPLEX_DIAGNOSTIC_HELPER_SHA256
          script: |
            set -euo pipefail
            [[ "$VOYAGEPLEX_DIAGNOSTIC_WORKFLOW_PIN" = true && "$VOYAGEPLEX_DIAGNOSTIC_HELPER_SHA256" =~ ^[a-f0-9]{64}$ ]] || exit 1
            [[ "$RELEASE_BRANCH" = refs/heads/ops/voyageplex-942-20261019 && "$RELEASE_ATTEMPT" = 1 && "$RELEASE_MODE" = diagnostic && "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]] || exit 1
            cd /opt/rr-portal
            timeout --signal=TERM --kill-after=2s 60s git -c core.hooksPath=/dev/null fetch origin ops/voyageplex-942-20261019 >/dev/null 2>&1 || exit 1
            [[ "$(git rev-parse FETCH_HEAD)" = "$RELEASE_SHA" ]] || exit 1
            umask 077
            voyageplex_diagnostic_tmp=$(mktemp -d /tmp/voyageplex-942-inventory-diagnostic.XXXXXX)
            trap 'rm -rf "$voyageplex_diagnostic_tmp"' EXIT
            git show "$RELEASE_SHA:deploy/ops/voyageplex-942-inventory-diagnostic.py" > "$voyageplex_diagnostic_tmp/run.py" 2>/dev/null || exit 1
            [[ "$(sha256sum "$voyageplex_diagnostic_tmp/run.py" | cut -d ' ' -f1)" = "$VOYAGEPLEX_DIAGNOSTIC_HELPER_SHA256" ]] || exit 1
            timeout --signal=TERM --kill-after=10s 140s python3 -B "$voyageplex_diagnostic_tmp/run.py" diagnose
