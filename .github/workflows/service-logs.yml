name: PR 961-965 Build Only Final Two Candidate Images
on:
  workflow_dispatch:
    inputs:
      mode: {type: choice, required: true, options: [prepare]}
permissions:
  contents: read
  actions: read
concurrency:
  group: deploy-cloud
  queue: max
  cancel-in-progress: false
env:
  BATCH_RELEASE_WORKFLOW_PIN: 'true'
  BATCH_RELEASE_HELPER_SHA256: '46bb698d00ea3bf42bd71ea7b1f283a3177fd04c07bfe0a679c85c9dcd646bb5'
jobs:
  build-only-final-two:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Validate exact ops source and first attempt
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_BRANCH: ${{ github.ref }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_ATTEMPT: ${{ github.run_attempt }}
          RELEASE_MODE: ${{ inputs.mode }}
          CLOUD_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
        run: |
          set -euo pipefail
          [[ "$BATCH_RELEASE_WORKFLOW_PIN" = true && "$BATCH_RELEASE_HELPER_SHA256" =~ ^[a-f0-9]{64}$ ]] || exit 1
          [[ "$RELEASE_BRANCH" = refs/heads/ops/batch-961-965-20261020 && "$RELEASE_ATTEMPT" = 1 && "$RELEASE_MODE" =~ ^prepare$ ]] || exit 1
          [[ "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ && "$CLOUD_HOST_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]{43}=?$ ]] || exit 1
          if [[ "$RELEASE_MODE" = prepare ]]; then
            gh api "repos/$GH_REPO/actions/workflows/deploy.yml" > "$RUNNER_TEMP/batch-standard-workflow.json"
            python3 -c 'import json,sys; assert json.load(open(sys.argv[1]))["state"]=="disabled_manually"' "$RUNNER_TEMP/batch-standard-workflow.json"
            for state in queued in_progress waiting requested pending; do
              gh api --method GET "repos/$GH_REPO/actions/workflows/deploy.yml/runs" -f status="$state" -f per_page=1 > "$RUNNER_TEMP/batch-standard-runs.json"
              python3 -c 'import json,sys; assert json.load(open(sys.argv[1]))["total_count"]==0' "$RUNNER_TEMP/batch-standard-runs.json"
            done
          fi
      - name: Build only QC web and PrintLink candidates; never switch services
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        env:
          RELEASE_BRANCH: ${{ github.ref }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_ATTEMPT: ${{ github.run_attempt }}
          RELEASE_MODE: ${{ inputs.mode }}
          CLOUD_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
        with:
          host: ${{ secrets.CLOUD_HOST }}
          username: ${{ secrets.CLOUD_USER }}
          key: ${{ secrets.CLOUD_SSH_KEY }}
          fingerprint: ${{ env.CLOUD_HOST_FINGERPRINT }}
          command_timeout: 50m
          envs: RELEASE_BRANCH,RELEASE_SHA,RELEASE_ATTEMPT,RELEASE_MODE,BATCH_RELEASE_WORKFLOW_PIN,BATCH_RELEASE_HELPER_SHA256
          script: |
            set -euo pipefail
            [[ "$BATCH_RELEASE_WORKFLOW_PIN" = true && "$BATCH_RELEASE_HELPER_SHA256" =~ ^[a-f0-9]{64}$ ]] || exit 1
            [[ "$RELEASE_BRANCH" = refs/heads/ops/batch-961-965-20261020 && "$RELEASE_ATTEMPT" = 1 && "$RELEASE_MODE" =~ ^prepare$ && "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]] || exit 1
            cd /opt/rr-portal
            timeout --signal=TERM --kill-after=2s 60s git -c core.hooksPath=/dev/null fetch origin ops/batch-961-965-20261020 >/dev/null 2>&1 || exit 1
            [[ "$(git rev-parse FETCH_HEAD)" = "$RELEASE_SHA" ]] || exit 1
            umask 077
            batch_release_tmp=$(mktemp -d /tmp/batch-961-965-release.XXXXXX)
            trap 'rm -rf "$batch_release_tmp"' EXIT
            git show "$RELEASE_SHA:deploy/ops/batch-961-965-build-prep.py" > "$batch_release_tmp/run.py" 2>/dev/null || exit 1
            git show "$RELEASE_SHA:deploy/ops/batch-961-965-release.py" > "$batch_release_tmp/batch-961-965-release.py" 2>/dev/null || exit 1
            git show "$RELEASE_SHA:deploy/ops/batch-candidate-diagnose-library.py" > "$batch_release_tmp/batch-candidate-diagnose-library.py" 2>/dev/null || exit 1
            git show "$RELEASE_SHA:deploy/ops/batch-backup-library.py" > "$batch_release_tmp/batch-backup-library.py" 2>/dev/null || exit 1
            git show "$RELEASE_SHA:deploy/ops/release-data-ops-library.py" > "$batch_release_tmp/release-data-ops-library.py" 2>/dev/null || exit 1
            git show "$RELEASE_SHA:deploy/ops/release-data-library.py" > "$batch_release_tmp/release-data-library.py" 2>/dev/null || exit 1
            git show "$RELEASE_SHA:deploy/ops/internal-quote-readonly-library.py" > "$batch_release_tmp/internal-quote-readonly-library.py" 2>/dev/null || exit 1
            git show "$RELEASE_SHA:deploy/ops/portable-pdb-library.py" > "$batch_release_tmp/portable-pdb-library.py" 2>/dev/null || exit 1
            git show "$RELEASE_SHA:deploy/ops/batch-reviewed-files.json" > "$batch_release_tmp/batch-reviewed-files.json" 2>/dev/null || exit 1
            [[ "$(sha256sum "$batch_release_tmp/run.py" | cut -d ' ' -f1)" = "$BATCH_RELEASE_HELPER_SHA256" ]] || exit 1
            [[ "$(sha256sum "$batch_release_tmp/batch-961-965-release.py" | cut -d ' ' -f1)" = 9c92f4cd77ca8c57c2a34c6d9d05fd3865e0d8afd8bad15e546241bb06f16e55 ]] || exit 1
            [[ "$(sha256sum "$batch_release_tmp/batch-candidate-diagnose-library.py" | cut -d ' ' -f1)" = 6f09f18a8308df6942856da9a5ac906e5c0a332832fd33cbe2d8ecbb40a1b730 ]] || exit 1
            [[ "$(sha256sum "$batch_release_tmp/batch-backup-library.py" | cut -d ' ' -f1)" = 4259dcbba7cbdc78809e286c3b20829644104e4a30b284bea84cc6b20f0c24b5 ]] || exit 1
            [[ "$(sha256sum "$batch_release_tmp/release-data-ops-library.py" | cut -d ' ' -f1)" = ff9138a1d5bfed1b10077112da6ebcda2d65240f583e2d0e12ce1325cfbaafd5 ]] || exit 1
            [[ "$(sha256sum "$batch_release_tmp/release-data-library.py" | cut -d ' ' -f1)" = d63168fd3057f4f2aba2d93f9fab31d2d65c6dd0f3234877d71fcff1e04e62b9 ]] || exit 1
            [[ "$(sha256sum "$batch_release_tmp/internal-quote-readonly-library.py" | cut -d ' ' -f1)" = be4f901f3444154e5de06766a2d8a0801dba9b847a4ac25f34a84ccebe354e69 ]] || exit 1
            [[ "$(sha256sum "$batch_release_tmp/portable-pdb-library.py" | cut -d ' ' -f1)" = cf66f655a1e166491c4da67da0824f42ac8cdae3f844044cb5d8f7233ba105c5 ]] || exit 1
            [[ "$(sha256sum "$batch_release_tmp/batch-reviewed-files.json" | cut -d ' ' -f1)" = c6a2c4b7ea1e5866ed351d1fcef54f2d27f44d099e50879a95bfd535a38e2ab6 ]] || exit 1
            batch_release_limit=45m
            timeout --signal=TERM --kill-after=30s "$batch_release_limit" python3 -B "$batch_release_tmp/run.py" "$RELEASE_MODE"
      - name: Report regular deployment restoration obligation
        if: always()
        shell: bash
        run: |
          echo 'MANUAL_ATTENTION: The build-preparation owner must restore deploy.yml to its saved original state and verify it. This read-only-token workflow does not change that setting.'
