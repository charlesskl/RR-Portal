name: ERP P112 P113 Scoped Release

# This workflow exists only on the dedicated ops branch. It does not replace
# main's service diagnostics or run the portal's legacy compose/db-init deploy.
on:
  workflow_dispatch:
    inputs:
      action:
        description: "Prepare beside the live ERP, activate a verified release, or inspect its evidence"
        type: choice
        required: true
        options: [prepare, activate, status]
      source_sha:
        description: "Exact reviewed ERP source commit (40 lowercase hexadecimal characters)"
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-cloud
  queue: max
  cancel-in-progress: false

jobs:
  scoped-erp:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Validate SSH host fingerprint and immutable inputs
        shell: bash
        env:
          CLOUD_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          RELEASE_ACTION: ${{ inputs.action }}
        run: |
          set -euo pipefail
          [[ "$CLOUD_HOST_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]{43}=?$ ]]
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$RELEASE_ACTION" =~ ^(prepare|activate|status)$ ]]

      - name: Run reviewed ERP-only operator through verified SSH
        env:
          CLOUD_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          RELEASE_ACTION: ${{ inputs.action }}
          OPERATOR_SHA: ${{ github.sha }}
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        with:
          host: ${{ secrets.CLOUD_HOST }}
          username: ${{ secrets.CLOUD_USER }}
          key: ${{ secrets.CLOUD_SSH_KEY }}
          fingerprint: ${{ env.CLOUD_HOST_FINGERPRINT }}
          command_timeout: 55m
          envs: SOURCE_SHA,RELEASE_ACTION,OPERATOR_SHA
          script: |
            set -euo pipefail
            python3 - <<'P113_OPERATOR'
            import json,os,re,subprocess,tempfile
            from pathlib import Path
            source=os.environ['SOURCE_SHA']; revision=os.environ['OPERATOR_SHA']; action=os.environ['RELEASE_ACTION']
            assert re.fullmatch('[a-f0-9]{40}',source) and re.fullmatch('[a-f0-9]{40}',revision)
            assert action in ['prepare','activate','status']
            os.umask(0o077)
            root=Path('/opt/rr-portal')
            if action=='status':
                directory=Path('/opt/erp-p113-releases')/source
                result={'sourceSha':source,'exists':directory.is_dir()}
                for filename in ['prepared.private.json','activation-journal.private.json','activation.private.json']:
                    file=directory/filename
                    if file.is_file() and not file.is_symlink():
                        value=json.loads(file.read_text())
                        result[filename]={k:value[k] for k in ['prepared','ok','sourceSha','imageId','apiId','candidateId','steps','failureType','rollbackFailureType','runtimeChanges','databaseCommands','sqlIdentityUnchanged','runtimeEnvironmentUnchanged','runtimeConfigurationUnchanged','uploadsMountUnchanged'] if k in value}
                result['resources']={'dockerVersion':subprocess.check_output(['docker','version','--format','{{.Server.Version}}'],text=True).strip(),'availableMemoryKiB':next((x.split()[1] for x in Path('/proc/meminfo').read_text().splitlines() if x.startswith('MemAvailable:')),None)}
                print(json.dumps(result)); raise SystemExit(0)
            subprocess.run(['git','-C',str(root),'fetch','origin',revision],check=True,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
            with tempfile.TemporaryDirectory(prefix='erp-p113-reviewed-') as scratch:
                directory=Path(scratch)
                names=['erp-p113-scoped-release.py','erp-p113-activate.py']
                if action=='activate': names.append('erp-p113-ready.json')
                for name in names:
                    content=subprocess.check_output(['git','-C',str(root),'show',revision+':deploy/'+name])
                    (directory/name).write_bytes(content)
                if action=='prepare':
                    command=['python3',str(directory/'erp-p113-scoped-release.py'),'prepare','--source-sha',source]
                else:
                    command=['python3',str(directory/'erp-p113-activate.py'),'--source-sha',source,'--ready',str(directory/'erp-p113-ready.json')]
                subprocess.run(command,check=True)
            P113_OPERATOR
