name: Internal Quote One Audit Row Read-Only Attribution
on:
  workflow_dispatch:
    inputs:
      mode: {type: choice, required: true, options: [quote-audit-row]}
permissions:
  contents: read
concurrency:
  group: release-read-only-progress
  cancel-in-progress: false
env:
  IQ_AUDIT_WORKFLOW_PIN: 'true'
  IQ_AUDIT_HELPER_SHA256: '3897ac9bb2f6ff4c814a59cdfa02a232bcbe74382c4704585fd27d0f575cbc30'
jobs:
  audit-one-row:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - shell: bash
        env:
          RELEASE_REF: ${{ github.ref }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_ATTEMPT: ${{ github.run_attempt }}
          RELEASE_MODE: ${{ inputs.mode }}
          CLOUD_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
        run: |
          set -euo pipefail
          [[ "$IQ_AUDIT_WORKFLOW_PIN" = true && "$IQ_AUDIT_HELPER_SHA256" =~ ^[a-f0-9]{64}$ ]] || exit 1
          [[ "$RELEASE_REF" = refs/heads/ops/release-progress-v4-20261019 && "$RELEASE_ATTEMPT" = 1 && "$RELEASE_MODE" = quote-audit-row && "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]] || exit 1
          [[ "$CLOUD_HOST_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]{43}=?$ ]] || exit 1
      - name: Inspect only the fixed audit delta with exact reviewed code
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        env:
          RELEASE_REF: ${{ github.ref }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_ATTEMPT: ${{ github.run_attempt }}
          RELEASE_MODE: ${{ inputs.mode }}
        with:
          host: ${{ secrets.CLOUD_HOST }}
          username: ${{ secrets.CLOUD_USER }}
          key: ${{ secrets.CLOUD_SSH_KEY }}
          fingerprint: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
          command_timeout: 4m
          envs: RELEASE_REF,RELEASE_SHA,RELEASE_ATTEMPT,RELEASE_MODE,IQ_AUDIT_WORKFLOW_PIN,IQ_AUDIT_HELPER_SHA256
          script: |
            set -euo pipefail
            [[ "$IQ_AUDIT_WORKFLOW_PIN" = true && "$IQ_AUDIT_HELPER_SHA256" =~ ^[a-f0-9]{64}$ ]] || exit 1
            [[ "$RELEASE_REF" = refs/heads/ops/release-progress-v4-20261019 && "$RELEASE_ATTEMPT" = 1 && "$RELEASE_MODE" = quote-audit-row && "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]] || exit 1
            cd /opt/rr-portal
            timeout --signal=TERM --kill-after=2s 60s git -c core.hooksPath=/dev/null fetch origin ops/release-progress-v4-20261019 >/dev/null 2>&1 || exit 1
            [[ "$(git rev-parse FETCH_HEAD)" = "$RELEASE_SHA" ]] || exit 1
            umask 077
            iq_audit_tmp=$(mktemp -d /tmp/iq-single-audit.XXXXXX)
            trap 'rm -rf "$iq_audit_tmp"' EXIT
            git show "$RELEASE_SHA:deploy/ops/internal-quote-952-953-audit-row.py" > "$iq_audit_tmp/run.py" 2>/dev/null || exit 1
            git show "$RELEASE_SHA:deploy/ops/release-pg-row-library.py" > "$iq_audit_tmp/release-pg-row-library.py" 2>/dev/null || exit 1
            [[ "$(sha256sum "$iq_audit_tmp/run.py" | cut -d ' ' -f1)" = "$IQ_AUDIT_HELPER_SHA256" ]] || exit 1
            [[ "$(sha256sum "$iq_audit_tmp/release-pg-row-library.py" | cut -d ' ' -f1)" = 6fbe7f73b085130e51716992725a5ccc8ba4a2037fbd254c6f131c5b78f0e0d9 ]] || exit 1
            timeout --signal=TERM --kill-after=5s 125s python3 -B "$iq_audit_tmp/run.py"
