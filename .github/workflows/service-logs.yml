            SERVICES=('qc','indo-shipping','internal-quote','factory-review','factory-review-test','qc-report','qc-report-worker')
            SAFE_STAGE='preflight';SAFE_SERVICE=None;LAST_COMMAND=None;COMMAND_FAILURE=None
            def need(x):
             if not x:raise RuntimeError('ENVIRONMENT_DRIFT_PROBE_REJECTED')
            def sha(x):return hashlib.sha256(x).hexdigest()
            def enc(x):return json.dumps(x,sort_keys=True,ensure_ascii=True,separators=(',',':'),allow_nan=False).encode()
            def run(args):
             global LAST_COMMAND,COMMAND_FAILURE
             LAST_COMMAND='git-read'if args[0]=='git'else'docker-images'if args[:2]==['docker','image']else'compose-config'if args[:2]==['docker','compose']else'docker-container-list'if args[:2]==['docker','ps']else'docker-container-inspect'if args[:2]==['docker','inspect']else'other-fixed-read'
             need(time.monotonic()<END)
             try:p=subprocess.run(args,stdout=subprocess.PIPE,stderr=subprocess.DEVNULL,cwd=R,timeout=max(.1,min(15,END-time.monotonic())))
             except subprocess.TimeoutExpired:COMMAND_FAILURE={'category':LAST_COMMAND,'kind':'timeout','returncode':None};raise
             if p.returncode!=0:COMMAND_FAILURE={'category':LAST_COMMAND,'kind':'returncode','returncode':p.returncode}
             elif len(p.stdout)>32*1024**2:COMMAND_FAILURE={'category':LAST_COMMAND,'kind':'output-bound','returncode':0}
             need(p.returncode==0 and len(p.stdout)<=32*1024**2);return p.stdout
            def key_evidence(old,new,old_image,new_image,explicit):
