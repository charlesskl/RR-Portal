name: Authorized Root SSH Password Rotation
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-cloud
  cancel-in-progress: false
env:
  RESET_WORKFLOW_PIN: 'true'
  RESET_HELPER_SHA256: '5d9c5e57d20adc4a076c36f31c5db989bb234acb91a4af19914dec4d59031e52'
jobs:
  rotate:
    if: github.ref == 'refs/heads/codex/ops-ssh-root-reset-20261103' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate explicitly authorized source and known host
        env:
          RESET_BRANCH: ${{ github.ref }}
          RESET_ATTEMPT: ${{ github.run_attempt }}
          RESET_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RESET_WORKFLOW_PIN" = true && "$RESET_HELPER_SHA256" = 5d9c5e57d20adc4a076c36f31c5db989bb234acb91a4af19914dec4d59031e52 ]] || exit 1
          [[ "$RESET_BRANCH" = refs/heads/codex/ops-ssh-root-reset-20261103 && "$RESET_ATTEMPT" = 1 ]] || exit 1
          [[ "$RESET_HOST_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]{43}=?$ ]] || exit 1
      - name: Rotate once with encrypted-only credential delivery
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        env:
          RESET_BRANCH: ${{ github.ref }}
          RESET_SOURCE_COMMIT: ${{ github.sha }}
          RESET_ATTEMPT: ${{ github.run_attempt }}
          RESET_MODE: reset-root
          RESET_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
        with:
          host: ${{ secrets.CLOUD_HOST }}
          username: ${{ secrets.CLOUD_USER }}
          key: ${{ secrets.CLOUD_SSH_KEY }}
          fingerprint: ${{ env.RESET_HOST_FINGERPRINT }}
          command_timeout: 2m
          envs: RESET_WORKFLOW_PIN,RESET_HELPER_SHA256,RESET_BRANCH,RESET_SOURCE_COMMIT,RESET_ATTEMPT,RESET_MODE,RESET_HOST_FINGERPRINT
          script: |
            set -eu
            [[ "$RESET_WORKFLOW_PIN" = true && "$RESET_HELPER_SHA256" = 5d9c5e57d20adc4a076c36f31c5db989bb234acb91a4af19914dec4d59031e52 ]] || exit 1
            [[ "$RESET_BRANCH" = refs/heads/codex/ops-ssh-root-reset-20261103 && "$RESET_ATTEMPT" = 1 && "$RESET_MODE" = reset-root ]] || exit 1
            cd /opt/rr-portal
            timeout --signal=TERM --kill-after=2s 45s git -c core.hooksPath=/dev/null fetch --no-write-fetch-head origin +refs/heads/codex/ops-ssh-root-reset-20261103:refs/remotes/origin/codex/ops-ssh-root-reset-20261103 >/dev/null 2>&1 || exit 1
            [[ "$(git rev-parse refs/remotes/origin/codex/ops-ssh-root-reset-20261103)" = "$RESET_SOURCE_COMMIT" ]] || exit 1
            umask 077
            reset_tmp=$(mktemp -d /tmp/authorized-ssh-rotation.XXXXXX)
            trap 'rm -rf "$reset_tmp"' EXIT
            git show "$RESET_SOURCE_COMMIT:deploy/ops/reset-root-ssh-20261103.py" > "$reset_tmp/reset.py"
            [[ "$(sha256sum "$reset_tmp/reset.py" | cut -d ' ' -f1)" = 5d9c5e57d20adc4a076c36f31c5db989bb234acb91a4af19914dec4d59031e52 ]] || exit 1
            timeout --signal=TERM --kill-after=5s 60s python3 -B "$reset_tmp/reset.py" reset-root
      - name: Verify preserved key with a fresh SSH connection
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        env:
          FP: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
        with:
          host: ${{ secrets.CLOUD_HOST }}
          username: ${{ secrets.CLOUD_USER }}
          key: ${{ secrets.CLOUD_SSH_KEY }}
          fingerprint: ${{ env.FP }}
          command_timeout: 30s
          script: |
            set -eu
            python3 -B -c 'import os,json;ok=os.geteuid()==0;print(json.dumps({"kind":"key-auth-check","success":ok}));raise SystemExit(0 if ok else 1)'
