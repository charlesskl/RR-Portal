name: Fixed Read-Only V3 Prior-Gate Diagnosis
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        required: true
        options: [diagnostic]
permissions:
  contents: read
concurrency:
  group: deploy-cloud
  queue: max
  cancel-in-progress: false
env:
  RELEASE_WORKFLOW_PIN_FROZEN: 'true'
  RELEASE_HELPER_SHA256: 'fe44c14bd876c688cfc3099df86f385de507b095e4768f7a9b9b3ad1fd67ab4c'
jobs:
  reviewed-data-operation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate frozen source, exact branch and first attempt
        shell: bash
        env:
          RELEASE_BRANCH: ${{ github.ref }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_ATTEMPT: ${{ github.run_attempt }}
          RELEASE_MODE: ${{ inputs.mode }}
          CLOUD_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_WORKFLOW_PIN_FROZEN" = true && "$RELEASE_HELPER_SHA256" =~ ^[a-f0-9]{64}$ ]] || exit 1
          [[ "$RELEASE_BRANCH" = refs/heads/ops/release-937-943-944-945-946-950-20261019 && "$RELEASE_ATTEMPT" = 1 ]] || exit 1
          [[ "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ && "$RELEASE_MODE" =~ ^(diagnostic)$ && "$CLOUD_HOST_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]{43}=?$ ]] || exit 1
      - name: Diagnose the sealed source rejection without business changes
        env:
          RELEASE_BRANCH: ${{ github.ref }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_ATTEMPT: ${{ github.run_attempt }}
          RELEASE_MODE: ${{ inputs.mode }}
          CLOUD_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        with:
          host: ${{ secrets.CLOUD_HOST }}
          username: ${{ secrets.CLOUD_USER }}
          key: ${{ secrets.CLOUD_SSH_KEY }}
          fingerprint: ${{ env.CLOUD_HOST_FINGERPRINT }}
          command_timeout: 3m
          envs: RELEASE_BRANCH,RELEASE_SHA,RELEASE_ATTEMPT,RELEASE_MODE,RELEASE_WORKFLOW_PIN_FROZEN,RELEASE_HELPER_SHA256
          script: |
            set -euo pipefail
            [[ "$RELEASE_WORKFLOW_PIN_FROZEN" = true && "$RELEASE_HELPER_SHA256" =~ ^[a-f0-9]{64}$ ]] || exit 1
            [[ "$RELEASE_BRANCH" = refs/heads/ops/release-937-943-944-945-946-950-20261019 && "$RELEASE_ATTEMPT" = 1 ]] || exit 1
            [[ "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ && "$RELEASE_MODE" =~ ^(diagnostic)$ ]] || exit 1
            cd /opt/rr-portal
            timeout --signal=TERM --kill-after=2s 60s git -c core.hooksPath=/dev/null fetch origin ops/release-937-943-944-945-946-950-20261019 >/dev/null 2>&1 || { echo RELEASE_FETCH_FAILED; exit 1; }
            [[ "$(git rev-parse FETCH_HEAD)" = "$RELEASE_SHA" ]] || { echo RELEASE_HEAD_MISMATCH; exit 1; }
            umask 077
            release_private_tmp=$(mktemp -d /tmp/release-reviewed.XXXXXX)
            trap 'rm -rf "$release_private_tmp"' EXIT
            git show "$RELEASE_SHA:deploy/ops/release-batch-v3-prior-diagnostic.py" > "$release_private_tmp/run.py" 2>/dev/null || exit 1
            git show "$RELEASE_SHA:deploy/ops/release-data-library.py" > "$release_private_tmp/release-data-library.py" 2>/dev/null || exit 1
            [[ "$(sha256sum "$release_private_tmp/run.py" | cut -d ' ' -f1)" = "$RELEASE_HELPER_SHA256" ]] || { echo RELEASE_HELPER_MISMATCH; exit 1; }
            [[ "$(sha256sum "$release_private_tmp/release-data-library.py" | cut -d ' ' -f1)" = d63168fd3057f4f2aba2d93f9fab31d2d65c6dd0f3234877d71fcff1e04e62b9 ]] || { echo RELEASE_LIBRARY_MISMATCH; exit 1; }
            git show "$RELEASE_SHA:deploy/ops/release-batch-scoped-deploy-v3.py" > "$release_private_tmp/reviewed-recovery-v3.py" 2>/dev/null || exit 1
            git show "$RELEASE_SHA:deploy/ops/release-937-943-944-945-946-950.py" > "$release_private_tmp/release-data-ops-library.py" 2>/dev/null || exit 1
            [[ "$(sha256sum "$release_private_tmp/reviewed-recovery-v3.py" | cut -d ' ' -f1)" = 40f501d28bcc0fdbbca630be41440b1d2a7f9b89eec2fd0b7a0ee7f81a0ecc01 ]] || exit 1
            [[ "$(sha256sum "$release_private_tmp/release-data-ops-library.py" | cut -d ' ' -f1)" = ff9138a1d5bfed1b10077112da6ebcda2d65240f583e2d0e12ce1325cfbaafd5 ]] || exit 1
            timeout --signal=TERM --kill-after=20s 120s python3 -B "$release_private_tmp/run.py" "$RELEASE_MODE"
