             captures=[capture(*a)for a in ARCHIVES];before,after=[a[0]for a in captures];need(before['head']==BASE and after['head']==TARGET)
             for key,relative,tables in [('qc','sy-huadeng/qc.db',('partners',)),('factory-review','auxiliary.db',('_logs',)),('factory-review-test','auxiliary.db',('_logs',))]:
              STAGE=key;paths=[db_path(a[0],c[1],key,relative)for a,c in zip(ARCHIVES,captures)];policy=None;settings_paths=[]
