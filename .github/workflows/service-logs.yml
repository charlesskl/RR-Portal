             STAGE='v4-complete-seal';need(V4.is_dir()and not V4.is_symlink()and stat.S_IMODE(V4.stat().st_mode)==0o700);entries=list(V4.rglob('*'));need(len(entries)<=5000 and all(not p.is_symlink()and(p.is_file()or p.is_dir())and p.stat().st_mode&0o077==0 for p in entries))
