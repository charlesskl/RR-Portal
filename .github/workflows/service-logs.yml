name: PR 1053 Scoped Release
on:
  workflow_dispatch:
    inputs:
      mode: {type: choice, required: true, options: [verify]}
permissions:
  contents: read
concurrency:
  group: deploy-cloud
  queue: max
  cancel-in-progress: false
env:
  SCOPED_RELEASE_WORKFLOW_PIN: 'false'
  SCOPED_RELEASE_HELPER_SHA256: 'bfa5dfc92c644a2ce3220cc5a5a2b3688e5068e07c75b50341422f81ee423cab'
jobs:
  scoped-operation:
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Validate exact branch and SSH host fingerprint
        shell: bash
        env:
          RELEASE_BRANCH: ${{ github.ref }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_ATTEMPT: ${{ github.run_attempt }}
          RELEASE_MODE: ${{ inputs.mode }}
          CLOUD_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
        run: |
          set -euo pipefail
          [[ "$SCOPED_RELEASE_WORKFLOW_PIN" = true && "$SCOPED_RELEASE_HELPER_SHA256" = bfa5dfc92c644a2ce3220cc5a5a2b3688e5068e07c75b50341422f81ee423cab ]] || exit 1
          [[ "$RELEASE_BRANCH" = refs/heads/codex/ops-pr1053-20261102 && "$RELEASE_ATTEMPT" = 1 && "$RELEASE_MODE" = verify && "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]] || exit 1
          [[ "$CLOUD_HOST_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]{43}=?$ ]] || exit 1
      - name: Run bounded reviewed operation
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        env:
          RELEASE_BRANCH: ${{ github.ref }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_ATTEMPT: ${{ github.run_attempt }}
          RELEASE_MODE: ${{ inputs.mode }}
          CLOUD_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
        with:
          host: ${{ secrets.CLOUD_HOST }}
          username: ${{ secrets.CLOUD_USER }}
          key: ${{ secrets.CLOUD_SSH_KEY }}
          fingerprint: ${{ env.CLOUD_HOST_FINGERPRINT }}
          command_timeout: 11m
          envs: RELEASE_BRANCH,RELEASE_SHA,RELEASE_ATTEMPT,RELEASE_MODE,SCOPED_RELEASE_WORKFLOW_PIN,SCOPED_RELEASE_HELPER_SHA256
          script: |
            set -euo pipefail
            [[ "$SCOPED_RELEASE_WORKFLOW_PIN" = true && "$SCOPED_RELEASE_HELPER_SHA256" = bfa5dfc92c644a2ce3220cc5a5a2b3688e5068e07c75b50341422f81ee423cab ]] || exit 1
            [[ "$RELEASE_BRANCH" = refs/heads/codex/ops-pr1053-20261102 && "$RELEASE_ATTEMPT" = 1 && "$RELEASE_MODE" = verify && "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]] || exit 1
            cd /opt/rr-portal
            timeout --signal=TERM --kill-after=2s 120s git -c core.hooksPath=/dev/null fetch --no-write-fetch-head origin +refs/heads/codex/ops-pr1053-20261102:refs/remotes/origin/codex/ops-pr1053-20261102 >/dev/null 2>&1 || exit 1
            [[ "$(git rev-parse refs/remotes/origin/codex/ops-pr1053-20261102)" = "$RELEASE_SHA" ]] || exit 1
            umask 077
            batch_tmp=$(mktemp -d /tmp/pr1053.XXXXXX)
            trap 'rm -rf "$batch_tmp"' EXIT
            git show "$RELEASE_SHA:deploy/ops/pr1053-static-r2-release.py" > "$batch_tmp/run.py" 2>/dev/null || exit 1
            [[ "$(sha256sum "$batch_tmp/run.py" | cut -d ' ' -f1)" = bfa5dfc92c644a2ce3220cc5a5a2b3688e5068e07c75b50341422f81ee423cab ]] || exit 1
            git show "$RELEASE_SHA:deploy/ops/pr1053-preflight.py" > "$batch_tmp/pr1053-preflight.py" 2>/dev/null || exit 1
            [[ "$(sha256sum "$batch_tmp/pr1053-preflight.py" | cut -d ' ' -f1)" = 0aeb31f9a4aea3f9d67eb8489687d7a035aa8f7fd8ea34ede9c6bd56dace9f25 ]] || exit 1
            timeout --signal=TERM --kill-after=30s 8m python3 -B "$batch_tmp/run.py" verify
