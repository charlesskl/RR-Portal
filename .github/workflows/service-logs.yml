               print(enc({'kind':'sealed-logs-settings-shape','system':key,'before':settings_shape(settings_paths[0],started),'after':settings_shape(settings_paths[1],started),'numericPolicyUnchanged':policies[0]==policies[1]if policy else None,'rawSettingsValuesPrinted':False}).decode(),flush=True)
              with contextlib.ExitStack()as stack:
