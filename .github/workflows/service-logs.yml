name: Internal Quote 952 953 Fixed Single Service Release
on:
  workflow_dispatch:
    inputs:
      mode: {type: choice, required: true, options: [deploy, verify]}
permissions:
  contents: read
  actions: read
concurrency:
  group: deploy-cloud
  queue: max
  cancel-in-progress: false
env:
  IQ_RELEASE_WORKFLOW_PIN: 'true'
  IQ_RELEASE_HELPER_SHA256: '8811236b04d66e182616268a68b6996376e3959062b8c7fb2d6d005d63d31075'
jobs:
  fixed-internal-quote-release:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Validate exact ops source and first attempt
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_BRANCH: ${{ github.ref }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_ATTEMPT: ${{ github.run_attempt }}
          RELEASE_MODE: ${{ inputs.mode }}
          CLOUD_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
        run: |
          set -euo pipefail
          [[ "$IQ_RELEASE_WORKFLOW_PIN" = true && "$IQ_RELEASE_HELPER_SHA256" =~ ^[a-f0-9]{64}$ ]] || exit 1
          [[ "$RELEASE_BRANCH" = refs/heads/ops/internal-quote-952-953-20261019 && "$RELEASE_ATTEMPT" = 1 && "$RELEASE_MODE" =~ ^(deploy|verify)$ ]] || exit 1
          [[ "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ && "$CLOUD_HOST_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]{43}=?$ ]] || exit 1
          if [[ "$RELEASE_MODE" = deploy ]]; then
            gh api "repos/$GH_REPO/actions/workflows/deploy.yml" > "$RUNNER_TEMP/iq-standard-workflow.json"
            python3 -c 'import json,sys; assert json.load(open(sys.argv[1]))["state"]=="disabled_manually"' "$RUNNER_TEMP/iq-standard-workflow.json"
            for state in queued in_progress waiting requested pending; do
              gh api --method GET "repos/$GH_REPO/actions/workflows/deploy.yml/runs" -f status="$state" -f per_page=1 > "$RUNNER_TEMP/iq-standard-runs.json"
              python3 -c 'import json,sys; assert json.load(open(sys.argv[1]))["total_count"]==0' "$RUNNER_TEMP/iq-standard-runs.json"
            done
          fi
      - name: Run fixed internal-quote release or read-only verification
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        env:
          RELEASE_BRANCH: ${{ github.ref }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_ATTEMPT: ${{ github.run_attempt }}
          RELEASE_MODE: ${{ inputs.mode }}
          CLOUD_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
        with:
          host: ${{ secrets.CLOUD_HOST }}
          username: ${{ secrets.CLOUD_USER }}
          key: ${{ secrets.CLOUD_SSH_KEY }}
          fingerprint: ${{ env.CLOUD_HOST_FINGERPRINT }}
          command_timeout: 50m
          envs: RELEASE_BRANCH,RELEASE_SHA,RELEASE_ATTEMPT,RELEASE_MODE,IQ_RELEASE_WORKFLOW_PIN,IQ_RELEASE_HELPER_SHA256
          script: |
            set -euo pipefail
            [[ "$IQ_RELEASE_WORKFLOW_PIN" = true && "$IQ_RELEASE_HELPER_SHA256" =~ ^[a-f0-9]{64}$ ]] || exit 1
            [[ "$RELEASE_BRANCH" = refs/heads/ops/internal-quote-952-953-20261019 && "$RELEASE_ATTEMPT" = 1 && "$RELEASE_MODE" =~ ^(deploy|verify)$ && "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]] || exit 1
            cd /opt/rr-portal
            timeout --signal=TERM --kill-after=2s 60s git -c core.hooksPath=/dev/null fetch origin ops/internal-quote-952-953-20261019 >/dev/null 2>&1 || exit 1
            [[ "$(git rev-parse FETCH_HEAD)" = "$RELEASE_SHA" ]] || exit 1
            umask 077
            iq_release_tmp=$(mktemp -d /tmp/iq-952-953-release.XXXXXX)
            trap 'rm -rf "$iq_release_tmp"' EXIT
            git show "$RELEASE_SHA:deploy/ops/internal-quote-952-953-release.py" > "$iq_release_tmp/run.py" 2>/dev/null || exit 1
            git show "$RELEASE_SHA:deploy/ops/internal-quote-952-953.py" > "$iq_release_tmp/internal-quote-backup-library.py" 2>/dev/null || exit 1
            git show "$RELEASE_SHA:deploy/ops/release-data-ops-library.py" > "$iq_release_tmp/release-data-ops-library.py" 2>/dev/null || exit 1
            git show "$RELEASE_SHA:deploy/ops/release-data-library.py" > "$iq_release_tmp/release-data-library.py" 2>/dev/null || exit 1
            git show "$RELEASE_SHA:deploy/ops/internal-quote-readonly-library.py" > "$iq_release_tmp/internal-quote-readonly-library.py" 2>/dev/null || exit 1
            git show "$RELEASE_SHA:deploy/ops/internal-quote-reviewed-files.json" > "$iq_release_tmp/internal-quote-reviewed-files.json" 2>/dev/null || exit 1
            [[ "$(sha256sum "$iq_release_tmp/run.py" | cut -d ' ' -f1)" = "$IQ_RELEASE_HELPER_SHA256" ]] || exit 1
            [[ "$(sha256sum "$iq_release_tmp/internal-quote-backup-library.py" | cut -d ' ' -f1)" = 67fb555ac8f614c743b889b4411a2fc415140a96765cacff6c42da448e408a66 ]] || exit 1
            [[ "$(sha256sum "$iq_release_tmp/release-data-ops-library.py" | cut -d ' ' -f1)" = ff9138a1d5bfed1b10077112da6ebcda2d65240f583e2d0e12ce1325cfbaafd5 ]] || exit 1
            [[ "$(sha256sum "$iq_release_tmp/release-data-library.py" | cut -d ' ' -f1)" = d63168fd3057f4f2aba2d93f9fab31d2d65c6dd0f3234877d71fcff1e04e62b9 ]] || exit 1
            [[ "$(sha256sum "$iq_release_tmp/internal-quote-readonly-library.py" | cut -d ' ' -f1)" = be4f901f3444154e5de06766a2d8a0801dba9b847a4ac25f34a84ccebe354e69 ]] || exit 1
            [[ "$(sha256sum "$iq_release_tmp/internal-quote-reviewed-files.json" | cut -d ' ' -f1)" = ec6abe3e3dfaa406189859f58d6f3b7358cac1fba5a10246b8dec634231fd132 ]] || exit 1
            iq_release_limit=18m
            [[ "$RELEASE_MODE" != deploy ]] || iq_release_limit=45m
            timeout --signal=TERM --kill-after=30s "$iq_release_limit" python3 -B "$iq_release_tmp/run.py" "$RELEASE_MODE"
      - name: Report regular deployment restoration obligation
        if: always()
        shell: bash
        run: |
          echo 'MANUAL_ATTENTION: The release owner must restore deploy.yml to its saved original state and verify it. This read-only-token workflow does not change that setting.'
