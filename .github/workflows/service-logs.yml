name: PR 1046-1049 Scoped Release
on:
  workflow_dispatch:
    inputs:
      mode: {type: choice, required: true, options: [diagnose]}
permissions:
  contents: read
concurrency:
  group: deploy-cloud
  queue: max
  cancel-in-progress: false
env:
  SCOPED_RELEASE_WORKFLOW_PIN: 'true'
  SCOPED_RELEASE_HELPER_SHA256: '027d0cd924ab830b88527228090d1155ee0602bf484e7dcad54e0efbe5938a2f'
jobs:
  fixed-scoped-phase:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Validate exact reviewed phase and SSH host fingerprint
        shell: bash
        env:
          RELEASE_BRANCH: ${{ github.ref }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_ATTEMPT: ${{ github.run_attempt }}
          RELEASE_MODE: ${{ inputs.mode }}
          CLOUD_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
        run: |
          set -euo pipefail
          [[ "$SCOPED_RELEASE_WORKFLOW_PIN" = true && "$SCOPED_RELEASE_HELPER_SHA256" = 027d0cd924ab830b88527228090d1155ee0602bf484e7dcad54e0efbe5938a2f ]] || exit 1
          [[ "$RELEASE_BRANCH" = refs/heads/codex/ops-pr-1046-1049-20261031 && "$RELEASE_ATTEMPT" = 1 && "$RELEASE_MODE" = diagnose && "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]] || exit 1
          [[ "$CLOUD_HOST_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]{43}=?$ ]] || exit 1
      - name: Run exact scoped diagnose helper
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        env:
          RELEASE_BRANCH: ${{ github.ref }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_ATTEMPT: ${{ github.run_attempt }}
          RELEASE_MODE: ${{ inputs.mode }}
          CLOUD_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
        with:
          host: ${{ secrets.CLOUD_HOST }}
          username: ${{ secrets.CLOUD_USER }}
          key: ${{ secrets.CLOUD_SSH_KEY }}
          fingerprint: ${{ env.CLOUD_HOST_FINGERPRINT }}
          command_timeout: 24m
          envs: RELEASE_BRANCH,RELEASE_SHA,RELEASE_ATTEMPT,RELEASE_MODE,SCOPED_RELEASE_WORKFLOW_PIN,SCOPED_RELEASE_HELPER_SHA256
          script: |
            set -euo pipefail
            [[ "$SCOPED_RELEASE_WORKFLOW_PIN" = true && "$SCOPED_RELEASE_HELPER_SHA256" = 027d0cd924ab830b88527228090d1155ee0602bf484e7dcad54e0efbe5938a2f ]] || exit 1
            [[ "$RELEASE_BRANCH" = refs/heads/codex/ops-pr-1046-1049-20261031 && "$RELEASE_ATTEMPT" = 1 && "$RELEASE_MODE" = diagnose && "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]] || exit 1
            cd /opt/rr-portal
            timeout --signal=TERM --kill-after=2s 60s git -c core.hooksPath=/dev/null fetch --no-write-fetch-head origin +refs/heads/codex/ops-pr-1046-1049-20261031:refs/remotes/origin/codex/ops-pr-1046-1049-20261031 >/dev/null 2>&1 || exit 1
            [[ "$(git rev-parse refs/remotes/origin/codex/ops-pr-1046-1049-20261031)" = "$RELEASE_SHA" ]] || exit 1
            umask 077
            indo_tmp=$(mktemp -d /tmp/batch1046-1049.XXXXXX)
            trap 'rm -rf "$indo_tmp"' EXIT
            git show "$RELEASE_SHA:deploy/ops/pr1046-1049-preflight.py" > "$indo_tmp/run.py" 2>/dev/null || exit 1
            [[ "$(sha256sum "$indo_tmp/run.py" | cut -d ' ' -f1)" = 027d0cd924ab830b88527228090d1155ee0602bf484e7dcad54e0efbe5938a2f ]] || exit 1
            git show "$RELEASE_SHA:deploy/ops/pr1035-quote-preflight.py" > "$indo_tmp/pr1035-quote-preflight.py" 2>/dev/null || exit 1
            [[ "$(sha256sum "$indo_tmp/pr1035-quote-preflight.py" | cut -d ' ' -f1)" = 2b2739aa00cad03bfce8472b7416d725364b8d4ed354a5a7e9ca905a47aaffa5 ]] || exit 1
            git show "$RELEASE_SHA:deploy/ops/pr1044-indo-preflight.py" > "$indo_tmp/pr1044-indo-preflight.py" 2>/dev/null || exit 1
            [[ "$(sha256sum "$indo_tmp/pr1044-indo-preflight.py" | cut -d ' ' -f1)" = 940e9675d628bc0af628ac3964b9073069f99d682a7bc812960ac6e1b88d3004 ]] || exit 1
            timeout --signal=TERM --kill-after=30s 22m python3 -B "$indo_tmp/run.py" diagnose
