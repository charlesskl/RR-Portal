             STAGE='proof-import';raw=run(['git','show',SOURCE+':deploy/ops/release-environment-proof.py']);need(sha(raw)=='9ba097453d46298d6e16e8a3ea5051f08dbe1e3cf39711ef4c8f75bc4f257480');e={'__name__':'report_metadata_only'};exec(compile(raw,'reviewed-env','exec'),e)
