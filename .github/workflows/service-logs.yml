             SAFE_STAGE='proof-import';proof={'__name__':'read_only_environment_drift'};exec(compile(raw,'reviewed-env-proof','exec'),proof)
             SAFE_STAGE='old-inspect';old_records=proof['records'](proof['old_inspections']())
             SAFE_STAGE='baseline';backup=R/'deploy/backups/release-937-943-944-945-946-950-20261019-v2';manifest_raw=proof['private_read'](backup/'manifest.json',1024**2);need(sha(manifest_raw)=='22483bb8f1a2e799ad6bcd14f48c2b60c2913d74ad9a03207c39c8b6f761f93f');manifest=proof['decoded'](manifest_raw);baseline_raw=proof['private_read'](backup/'baseline.private.json',32*1024**2);need(sha(baseline_raw)==manifest['baseline.private.json']);baseline=proof['decoded'](baseline_raw)
             SAFE_STAGE='head-env'
             need(run(['git','rev-parse','HEAD']).decode().strip()==TARGET and (R/'docker-compose.cloud.yml').read_bytes()==run(['git','show',BASE+':docker-compose.cloud.yml'])and sha((R/'.env.cloud.production').read_bytes())==baseline['envSHA256'])
             SAFE_STAGE='current-containers';ids=[]
