<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SKY 排期系统</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, 'Microsoft YaHei', sans-serif; background: #f0f2f5; color: #333; }

    .header { background: linear-gradient(135deg, #1a73e8, #4285f4); color: white; padding: 20px 32px; box-shadow: 0 2px 8px rgba(0,0,0,0.15); }
    .header h1 { font-size: 22px; font-weight: 600; }
    .header p { font-size: 13px; opacity: 0.85; margin-top: 4px; }

    .container { max-width: 1400px; margin: 24px auto; padding: 0 24px; }

    /* Upload Zone */
    .upload-zone {
      background: white; border: 2px dashed #c4c4c4; border-radius: 12px; padding: 48px;
      text-align: center; cursor: pointer; transition: all 0.3s;
    }
    .upload-zone:hover, .upload-zone.dragover { border-color: #1a73e8; background: #e8f0fe; }
    .upload-zone .icon { font-size: 48px; color: #1a73e8; margin-bottom: 12px; }
    .upload-zone h3 { font-size: 18px; margin-bottom: 8px; }
    .upload-zone p { color: #666; font-size: 14px; }
    .upload-zone input { display: none; }

    /* Progress */
    .progress-bar { width: 100%; height: 6px; background: #e0e0e0; border-radius: 3px; margin-top: 16px; display: none; }
    .progress-bar .fill { height: 100%; background: #1a73e8; border-radius: 3px; transition: width 0.3s; width: 0; }

    /* Tabs */
    .tabs { display: flex; gap: 0; margin-top: 24px; border-bottom: 2px solid #e0e0e0; }
    .tab { padding: 10px 24px; cursor: pointer; font-size: 14px; font-weight: 500; color: #666; border-bottom: 2px solid transparent; margin-bottom: -2px; transition: all 0.2s; }
    .tab:hover { color: #1a73e8; }
    .tab.active { color: #1a73e8; border-bottom-color: #1a73e8; }

    /* Results Panel */
    .results-panel { background: white; border-radius: 0 0 12px 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); display: none; }
    .results-panel.show { display: block; }

    /* Stats bar */
    .stats-bar { display: flex; gap: 24px; padding: 16px 24px; background: #f8f9fa; border-bottom: 1px solid #eee; }
    .stat { text-align: center; }
    .stat .num { font-size: 24px; font-weight: 700; color: #1a73e8; }
    .stat .label { font-size: 12px; color: #888; margin-top: 2px; }

    /* Toolbar */
    .toolbar { display: flex; justify-content: space-between; align-items: center; padding: 12px 24px; border-bottom: 1px solid #eee; }
    .toolbar-left { display: flex; gap: 12px; align-items: center; }
    .toolbar-right { display: flex; gap: 8px; }

    /* Export select */
    select { padding: 8px 12px; border: 1px solid #d0d0d0; border-radius: 6px; font-size: 13px; background: white; cursor: pointer; }

    /* Buttons */
    .btn { padding: 8px 20px; border: none; border-radius: 6px; font-size: 13px; font-weight: 500; cursor: pointer; transition: all 0.2s; display: inline-flex; align-items: center; gap: 6px; }
    .btn-primary { background: #1a73e8; color: white; }
    .btn-primary:hover { background: #1557b0; }
    .btn-success { background: #34a853; color: white; }
    .btn-success:hover { background: #2d8f47; }
    .btn-outline { background: white; color: #1a73e8; border: 1px solid #1a73e8; }
    .btn-outline:hover { background: #e8f0fe; }
    .btn-danger { background: #ea4335; color: white; }
    .btn-danger:hover { background: #c5221f; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* PO Cards */
    .po-card { border-bottom: 1px solid #eee; padding: 16px 24px; }
    .po-card:last-child { border-bottom: none; }
    .po-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .po-title { display: flex; align-items: center; gap: 12px; }
    .po-title h4 { font-size: 15px; }
    .po-badge { padding: 3px 10px; border-radius: 12px; font-size: 11px; font-weight: 600; }
    .badge-tomy { background: #e8f0fe; color: #1a73e8; }
    .badge-skycastle { background: #fce8e6; color: #ea4335; }
    .badge-jaz { background: #fef7e0; color: #f9ab00; }
    .badge-error { background: #fce8e6; color: #ea4335; }
    .badge-new { background: #fff9c4; color: #f57f17; }
    .badge-revised { background: #fce4ec; color: #c62828; }

    .po-meta { display: flex; gap: 20px; margin-bottom: 12px; flex-wrap: wrap; }
    .po-meta span { font-size: 13px; color: #666; }
    .po-meta strong { color: #333; }

    /* Data Table */
    .data-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .data-table th { background: #f1f3f4; padding: 8px 12px; text-align: left; font-weight: 600; color: #555; white-space: nowrap; position: sticky; top: 0; }
    .data-table td { padding: 7px 12px; border-bottom: 1px solid #f0f0f0; }
    .data-table tr:hover td { background: #f8f9fa; }
    .data-table .editable { cursor: text; border: 1px solid transparent; padding: 4px 8px; border-radius: 4px; min-width: 60px; }
    .data-table .editable:hover { border-color: #c4c4c4; }
    .data-table .editable:focus { border-color: #1a73e8; outline: none; background: white; }
    .table-wrapper { overflow-x: auto; }

    .text-right { text-align: right; }
    .text-center { text-align: center; }
    .text-muted { color: #999; }
    .text-error { color: #ea4335; }

    /* Empty state */
    .empty-state { padding: 48px; text-align: center; color: #888; }
    .empty-state .icon { font-size: 48px; margin-bottom: 12px; }

    /* Toast */
    .toast { position: fixed; bottom: 24px; right: 24px; padding: 12px 24px; border-radius: 8px; color: white; font-size: 14px; z-index: 1000; transform: translateY(100px); opacity: 0; transition: all 0.3s; }
    .toast.show { transform: translateY(0); opacity: 1; }
    .toast-success { background: #34a853; }
    .toast-error { background: #ea4335; }

    /* Loading */
    .loading-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(255,255,255,0.8); z-index: 999; display: none; justify-content: center; align-items: center; flex-direction: column; }
    .loading-overlay.show { display: flex; }
    .spinner { width: 40px; height: 40px; border: 3px solid #e0e0e0; border-top-color: #1a73e8; border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { margin-top: 12px; font-size: 14px; color: #666; }

    /* History */
    .history-list { padding: 16px 24px; }
    .history-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border: 1px solid #eee; border-radius: 8px; margin-bottom: 8px; }
    .history-item:hover { background: #f8f9fa; }
    .history-info { font-size: 13px; }
    .history-info .time { color: #888; }

    /* Step cards */
    .step-card { background: white; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); overflow: hidden; }
    .step-header { padding: 14px 24px; font-size: 15px; font-weight: 600; border-bottom: 1px solid #eee; display: flex; align-items: center; gap: 10px; }
    .step-num { width: 26px; height: 26px; border-radius: 50%; background: #1a73e8; color: white; display: inline-flex; align-items: center; justify-content: center; font-size: 13px; }

    /* Delete button for items */
    .btn-delete-row { background: none; border: none; color: #ccc; cursor: pointer; font-size: 16px; padding: 2px 6px; }
    .btn-delete-row:hover { color: #ea4335; }
  </style>
</head>
<body>
  <div class="header">
    <h1>SKY 排期系统</h1>
    <p>批量上传PO PDF，自动识别内容，一键导出排期Excel</p>
  </div>

  <div class="container">
    <!-- Step 1: Upload Excel Template -->
    <div class="step-card" id="step1">
      <div class="step-header"><span class="step-num">1</span> 上传现有排期Excel</div>
      <div class="upload-zone" id="excelZone" style="padding:32px">
        <div class="icon">&#128203;</div>
        <h3>拖拽排期Excel到这里，或点击选择</h3>
        <p>支持 Sky Castle / TOMY东莞 / TOMY印尼 / JAZ塑胶 / JAZ戏服 排期</p>
        <input type="file" id="excelInput" accept=".xlsx">
      </div>
      <div id="templateInfo" style="display:none; padding:12px 24px; background:#e8f5e9; border-radius:0 0 8px 8px;">
        <span id="templateName" style="font-weight:600"></span>
        <span id="templateType" class="po-badge badge-tomy" style="margin-left:8px"></span>
        <button class="btn btn-outline" onclick="clearTemplate()" style="float:right;padding:4px 12px">更换</button>
      </div>
    </div>

    <!-- Step 2: Upload PO PDFs -->
    <div class="step-card" id="step2" style="margin-top:16px; opacity:0.5; pointer-events:none">
      <div class="step-header"><span class="step-num">2</span> 批量上传PO PDF</div>
      <div class="upload-zone" id="uploadZone" style="padding:32px">
        <div class="icon">&#128196;</div>
        <h3>拖拽PO PDF文件到这里，或点击选择</h3>
        <p>支持批量上传多个PO，自动识别 TOMY / Sky Castle / JAZ 格式</p>
        <input type="file" id="fileInput" accept=".pdf" multiple>
      </div>
    </div>

    <!-- Tabs & Results -->
    <div id="resultsSection" style="display:none">
      <div class="tabs">
        <div class="tab active" data-tab="preview" onclick="switchTab('preview')">识别预览</div>
        <div class="tab" data-tab="history" onclick="switchTab('history')">历史记录</div>
      </div>

      <!-- Preview Tab -->
      <div class="results-panel show" id="previewPanel">
        <div class="stats-bar">
          <div class="stat"><div class="num" id="statFiles">0</div><div class="label">PO文件</div></div>
          <div class="stat"><div class="num" id="statItems">0</div><div class="label">行项目</div></div>
          <div class="stat"><div class="num" id="statTomy">0</div><div class="label">TOMY</div></div>
          <div class="stat"><div class="num" id="statSky">0</div><div class="label">Sky Castle</div></div>
          <div class="stat"><div class="num" id="statJaz">0</div><div class="label">JAZ</div></div>
          <div class="stat"><div class="num" id="statErrors">0</div><div class="label">异常</div></div>
        </div>

        <div class="toolbar">
          <div class="toolbar-left">
            <span id="toolbarInfo" style="font-size:13px;color:#666"></span>
          </div>
          <div class="toolbar-right">
            <button class="btn btn-outline" onclick="resetAll()">清空重来</button>
            <button class="btn btn-success" onclick="writeToExcel()" id="btnWrite">
              写入排期Excel
            </button>
          </div>
        </div>

        <div id="poCards"></div>
      </div>

      <!-- History Tab -->
      <div class="results-panel" id="historyPanel">
        <div class="history-list" id="historyList"></div>
      </div>
    </div>
  </div>

  <!-- Loading Overlay -->
  <div class="loading-overlay" id="loading">
    <div class="spinner"></div>
    <div class="loading-text" id="loadingText">正在解析PO文件...</div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script>
    let currentSession = null;
    let currentResults = [];
    let templateId = null;
    let templateType = null;

    // ============================================================
    // Step 1: Excel template upload
    // ============================================================
    const excelZone = document.getElementById('excelZone');
    const excelInput = document.getElementById('excelInput');

    excelZone.addEventListener('click', () => excelInput.click());
    excelZone.addEventListener('dragover', e => { e.preventDefault(); excelZone.classList.add('dragover'); });
    excelZone.addEventListener('dragleave', () => excelZone.classList.remove('dragover'));
    excelZone.addEventListener('drop', e => {
      e.preventDefault();
      excelZone.classList.remove('dragover');
      const file = Array.from(e.dataTransfer.files).find(f => f.name.match(/\.xlsx$/i));
      if (file) uploadTemplate(file);
      else showToast('请上传Excel文件', 'error');
    });
    excelInput.addEventListener('change', () => {
      if (excelInput.files.length) uploadTemplate(excelInput.files[0]);
    });

    async function uploadTemplate(file) {
      showLoading('正在检测排期格式...');
      const formData = new FormData();
      formData.append('file', file);
      try {
        const resp = await fetch('./api/po/template', { method: 'POST', body: formData });
        const data = await resp.json();
        if (data.error) throw new Error(data.error);

        templateId = data.templateId;
        templateType = data.type;
        document.getElementById('btnWrite').textContent = templateType === 'skycastle' ? '下载粘贴副本' : '写入排期Excel';
        const typeNames = { skycastle: 'Sky Castle排期', tomy: 'TOMY排期', jaz_plastic: 'JAZ塑胶排期', jaz_costume: 'JAZ戏服排期', unknown: '未知格式' };

        document.getElementById('templateName').textContent = file.name;
        document.getElementById('templateType').textContent = typeNames[data.type] || data.type;
        document.getElementById('templateInfo').style.display = 'block';
        excelZone.style.display = 'none';

        // Enable step 2
        document.getElementById('step2').style.opacity = '1';
        document.getElementById('step2').style.pointerEvents = 'auto';

        showToast(`识别为: ${typeNames[data.type]}`, 'success');
      } catch (err) {
        showToast(`上传失败: ${err.message}`, 'error');
      } finally {
        hideLoading();
        excelInput.value = '';
      }
    }

    function clearTemplate() {
      templateId = null;
      templateType = null;
      document.getElementById('templateInfo').style.display = 'none';
      excelZone.style.display = 'block';
      document.getElementById('step2').style.opacity = '0.5';
      document.getElementById('step2').style.pointerEvents = 'none';
    }

    // ============================================================
    // Step 2: PO PDF upload
    // ============================================================
    const uploadZone = document.getElementById('uploadZone');
    const fileInput = document.getElementById('fileInput');

    uploadZone.addEventListener('click', () => fileInput.click());
    uploadZone.addEventListener('dragover', e => { e.preventDefault(); uploadZone.classList.add('dragover'); });
    uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('dragover'));
    uploadZone.addEventListener('drop', e => {
      e.preventDefault();
      uploadZone.classList.remove('dragover');
      const files = Array.from(e.dataTransfer.files).filter(f => f.type === 'application/pdf');
      if (files.length) uploadFiles(files);
      else showToast('请上传PDF文件', 'error');
    });
    fileInput.addEventListener('change', () => {
      if (fileInput.files.length) uploadFiles(Array.from(fileInput.files));
    });

    async function uploadFiles(files) {
      showLoading(`正在解析 ${files.length} 个PO文件...`);

      const formData = new FormData();
      files.forEach(f => formData.append('files', f));
      if (templateId) formData.append('templateId', templateId);

      try {
        const resp = await fetch('./api/po/upload', { method: 'POST', body: formData });
        const data = await resp.json();
        if (data.error) throw new Error(data.error);

        currentSession = data.sessionId;
        currentResults = data.results;
        renderResults();
        showToast(`成功解析 ${files.length} 个PO文件`, 'success');
      } catch (err) {
        showToast(`上传失败: ${err.message}`, 'error');
      } finally {
        hideLoading();
        fileInput.value = '';
      }
    }

    // ============================================================
    // Render results
    // ============================================================
    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, char => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      })[char]);
    }

    function renderResults() {
      document.getElementById('resultsSection').style.display = 'block';

      // Stats
      const totalFiles = currentResults.length;
      const totalItems = currentResults.reduce((s, r) => s + (r.items ? r.items.length : 0), 0);
      const tomyCount = currentResults.filter(r => r.client === 'TOMY').length;
      const skyCount = currentResults.filter(r => r.client === 'Sky Castle').length;
      const jazCount = currentResults.filter(r => r.client === 'JAZ').length;
      const errorCount = currentResults.filter(r => r.error).length;

      document.getElementById('statFiles').textContent = totalFiles;
      document.getElementById('statItems').textContent = totalItems;
      document.getElementById('statTomy').textContent = tomyCount;
      document.getElementById('statSky').textContent = skyCount;
      document.getElementById('statJaz').textContent = jazCount;
      document.getElementById('statErrors').textContent = errorCount;

      document.getElementById('toolbarInfo').textContent =
        templateType === 'skycastle' ? '副本仅含本批 PO。按表名从第 3 行复制明细。' : templateId ? `将写入: ${document.getElementById('templateName').textContent}` : '请先上传排期Excel';

      // Cards
      const container = document.getElementById('poCards');
      container.innerHTML = '';

      if (currentResults.length === 0) {
        container.innerHTML = '<div class="empty-state"><div class="icon">&#128269;</div><p>暂无数据</p></div>';
        return;
      }

      currentResults.forEach((po, poIdx) => {
        const card = document.createElement('div');
        card.className = 'po-card';

        const badgeClass = po.error ? 'badge-error'
          : po.client === 'TOMY' ? 'badge-tomy'
          : po.client === 'Sky Castle' ? 'badge-skycastle'
          : po.client === 'JAZ' ? 'badge-jaz'
          : 'badge-skycastle';
        const badgeText = po.error ? '解析异常' : po.client;
        const statusBadge = po.isRevised
          ? '<span class="po-badge badge-revised">修改单</span>'
          : '<span class="po-badge badge-new">新单</span>';

        let metaHtml = '';
        if (po.client === 'TOMY') {
          metaHtml = `
            <span>PO号: <strong>${escapeHtml(po.poNumber || '-')}</strong></span>
            <span>客PO号: <strong>${escapeHtml(po.customerPO || '-')}</strong></span>
            <span>接单日期: <strong>${escapeHtml(po.poDate || '-')}</strong></span>
            <span>客户ID: <strong>${escapeHtml(po.customerID || '-')}</strong></span>
          `;
        } else if (po.client === 'Sky Castle') {
          metaHtml = `
            <span>PO号: <strong>${escapeHtml(po.poNumber || '-')}</strong></span>
            <span>接单日期: <strong>${escapeHtml(po.creationDate || '-')}</strong></span>
            <span>出货日期: <strong>${escapeHtml(po.shippingDate || '-')}</strong></span>
          `;
        } else if (po.client === 'JAZ') {
          metaHtml = `
            <span>PO号: <strong>${escapeHtml(po.poNumber || '-')}</strong></span>
            <span>版本: <strong>${escapeHtml(po.poVersion || '-')}</strong></span>
            <span>客户: <strong>${escapeHtml(po.customerName || '-')}</strong></span>
            <span>走货期: <strong>${escapeHtml(po.shipDate || '-')}</strong></span>
          `;
        }

        let tableHtml = '';
        if (po.items && po.items.length > 0) {
          tableHtml = `
            <div class="table-wrapper">
              <table class="data-table">
                <thead>
                  <tr>
                    <th>#</th>
                    <th>货号</th>
                    <th>产品描述</th>
                    <th>出货期</th>
                    <th>国家</th>
                    <th class="text-right">数量</th>
                    <th class="text-right">单价USD</th>
                    <th class="text-right">金额USD</th>
                    <th>工厂</th>
                    <th>备注</th>
                    <th></th>
                  </tr>
                </thead>
                <tbody>
                  ${po.items.map((item, itemIdx) => `
                    <tr>
                      <td class="text-muted">${itemIdx + 1}</td>
                      <td><span class="editable" contenteditable="true" data-po="${poIdx}" data-item="${itemIdx}" data-field="partNo">${escapeHtml(item.partNo)}</span></td>
                      <td><span class="editable" contenteditable="true" data-po="${poIdx}" data-item="${itemIdx}" data-field="description">${escapeHtml(item.description || '')}</span>
                        ${item.customerPackaging ? `<div class="text-muted">包装版本 · ${escapeHtml(item.customerPackaging)}</div>` : ''}</td>
                      <td><span class="editable" contenteditable="true" data-po="${poIdx}" data-item="${itemIdx}" data-field="dueDate">${escapeHtml(item.dueDate)}</span></td>
                      <td><span class="editable" contenteditable="true" data-po="${poIdx}" data-item="${itemIdx}" data-field="country">${escapeHtml(item.country)}</span></td>
                      <td class="text-right"><span class="editable" contenteditable="true" data-po="${poIdx}" data-item="${itemIdx}" data-field="quantity">${item.quantity.toLocaleString()}</span></td>
                      <td class="text-right"><span class="editable" contenteditable="true" data-po="${poIdx}" data-item="${itemIdx}" data-field="unitPrice">${item.unitPrice.toFixed(4)}</span></td>
                      <td class="text-right"><strong>${item.amount.toLocaleString('en-US', {minimumFractionDigits: 2})}</strong></td>
                      <td><span class="editable" contenteditable="true" data-po="${poIdx}" data-item="${itemIdx}" data-field="factory">${escapeHtml(item.factory || '')}</span></td>
                      <td>
                        <span class="editable" contenteditable="true" data-po="${poIdx}" data-item="${itemIdx}" data-field="remark">${escapeHtml(item.remark || '')}</span>
                        ${item.divertedFrom ? `<br><span style="color:#9C0006;font-size:11px">从 PO#${escapeHtml(item.divertedFrom.sourcePO)} 扣入 ${escapeHtml(item.divertedFrom.qty)}个</span>` : ''}
                        ${item.divertedTo ? `<br><span style="color:#1a73e8;font-size:11px">扣出 ${escapeHtml(item.divertedTo.qty)}个 → PO#${escapeHtml(item.divertedTo.targetPO)}</span>` : ''}
                      </td>
                      <td><button class="btn-delete-row" onclick="deleteItem(${poIdx}, ${itemIdx})" title="删除此行">&times;</button></td>
                    </tr>
                  `).join('')}
                </tbody>
                <tfoot>
                  <tr>
                    <td colspan="5" class="text-right"><strong>合计</strong></td>

                    <td class="text-right"><strong>${po.items.reduce((s, i) => s + i.quantity, 0).toLocaleString()}</strong></td>
                    <td></td>
                    <td class="text-right"><strong>${po.items.reduce((s, i) => s + i.amount, 0).toLocaleString('en-US', {minimumFractionDigits: 2})}</strong></td>
                    <td colspan="3"></td>
                  </tr>
                </tfoot>
              </table>
            </div>
          `;
        } else if (po.error) {
          tableHtml = `<div class="empty-state text-error"><p>${escapeHtml(po.error)}</p></div>`;
        }

        card.innerHTML = `
          <div class="po-header">
            <div class="po-title">
              <span class="po-badge ${badgeClass}">${escapeHtml(badgeText)}</span>
              ${!po.error ? statusBadge : ''}
              <h4>${escapeHtml(po.filename)}</h4>
            </div>
          </div>
          <div class="po-meta">${metaHtml}</div>
          ${tableHtml}
        `;
        container.appendChild(card);
      });

      // Listen for edits
      document.querySelectorAll('.editable').forEach(el => {
        el.addEventListener('blur', handleEdit);
      });
    }

    // ============================================================
    // Edit handling
    // ============================================================
    function handleEdit(e) {
      const el = e.target;
      const poIdx = parseInt(el.dataset.po);
      const itemIdx = parseInt(el.dataset.item);
      const field = el.dataset.field;
      let value = el.textContent.trim();

      if (field === 'quantity') {
        value = parseInt(value.replace(/,/g, ''), 10) || 0;
      } else if (field === 'unitPrice') {
        value = parseFloat(value) || 0;
      }

      currentResults[poIdx].items[itemIdx][field] = value;

      // Recalculate amount
      if (field === 'quantity' || field === 'unitPrice') {
        const item = currentResults[poIdx].items[itemIdx];
        item.amount = item.quantity * item.unitPrice;
        renderResults();
      }

      // Save to server
      saveSession();
    }

    function deleteItem(poIdx, itemIdx) {
      currentResults[poIdx].items.splice(itemIdx, 1);
      renderResults();
      saveSession();
    }

    let pendingSave = Promise.resolve();
    function saveSession() {
      const id = currentSession;
      const body = JSON.stringify({ results: currentResults });
      pendingSave = pendingSave.catch(() => {}).then(async () => {
        const response = await fetch(`./api/po/session/${id}`, {
          method: 'PUT', headers: { 'Content-Type': 'application/json' }, body,
        });
        if (!response.ok) throw new Error('修改未保存，请重试');
      });
      pendingSave.catch(err => showToast(err.message, 'error'));
      return pendingSave;
    }

    // ============================================================
    // Write to existing Excel
    // ============================================================
    async function writeToExcel() {
      if (!currentSession || !templateId) {
        showToast('请先上传排期Excel和PO文件', 'error');
        return;
      }
      showLoading('正在生成排期文件…');

      try {
        await saveSession();
        const requestExport = dateConfirmation => fetch(`./api/po/write/${currentSession}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ templateId, dateConfirmation }),
        });

        let resp = await requestExport();
        if (resp.status === 409) {
          const change = await resp.json();
          if (!change.dateConfirmation) throw new Error(change.error);
          const message = change.changes.map(([sheet,po,sku,label,from,to]) =>
            `${sheet} · ${po} · ${sku} · ${label}  ${from} → ${to}`).join('\n');
          if (!window.confirm('按新 PO 更新以下日期？\n'+message)) return;
          resp = await requestExport(change.dateConfirmation);
        }
        if (!resp.ok) {
          const err = await resp.json();
          throw new Error(err.error);
        }

        const blob = await resp.blob();
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `${templateType === 'skycastle' ? '排期粘贴副本' : '排期_已入录'}_${new Date().toLocaleDateString('zh-CN')}.xlsx`;
        a.click();
        URL.revokeObjectURL(url);
        showToast('排期文件已生成', 'success');
      } catch (err) {
        showToast(`写入失败: ${err.message}`, 'error');
      } finally {
        hideLoading();
      }
    }

    // ============================================================
    // History
    // ============================================================
    async function loadHistory() {
      try {
        const resp = await fetch('./api/po/history');
        const data = await resp.json();
        const container = document.getElementById('historyList');

        if (data.length === 0) {
          container.innerHTML = '<div class="empty-state"><p>暂无历史记录</p></div>';
          return;
        }

        container.innerHTML = data.map(h => `
          <div class="history-item">
            <div class="history-info">
              <strong>${h.totalPOs} 个PO</strong> / ${h.totalItems} 条数据
              <span style="margin-left:8px;color:#888;">${escapeHtml(h.clients.join(', '))}</span>
              <br><span class="time">${new Date(h.createdAt).toLocaleString('zh-CN')}</span>
            </div>
            <button class="btn btn-outline" data-session="${escapeHtml(h.id)}">加载</button>
          </div>
        `).join('');
        container.querySelectorAll('[data-session]').forEach(button => {
          button.addEventListener('click', () => loadSession(button.dataset.session));
        });
      } catch (err) {
        console.error('Load history failed:', err);
      }
    }

    async function loadSession(sessionId) {
      showLoading('正在加载...');
      try {
        const resp = await fetch(`./api/po/session/${sessionId}`);
        const data = await resp.json();
        currentSession = data.id;
        currentResults = data.results;
        switchTab('preview');
        renderResults();
        showToast('加载成功', 'success');
      } catch (err) {
        showToast('加载失败', 'error');
      } finally {
        hideLoading();
      }
    }

    // ============================================================
    // Tabs
    // ============================================================
    function switchTab(tab) {
      document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
      document.getElementById('previewPanel').classList.toggle('show', tab === 'preview');
      document.getElementById('historyPanel').classList.toggle('show', tab === 'history');
      if (tab === 'history') loadHistory();
    }

    // ============================================================
    // Utils
    // ============================================================
    function resetAll() {
      currentSession = null;
      currentResults = [];
      document.getElementById('resultsSection').style.display = 'none';
      document.getElementById('poCards').innerHTML = '';
    }

    function showLoading(text) {
      document.getElementById('loadingText').textContent = text || '处理中...';
      document.getElementById('loading').classList.add('show');
    }
    function hideLoading() { document.getElementById('loading').classList.remove('show'); }

    function showToast(msg, type) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.className = `toast toast-${type} show`;
      setTimeout(() => toast.classList.remove('show'), 3000);
    }
  </script>
</body>
</html>
