services:
  platform:
    build: .
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:3100:3100"
    environment:
      APP_MODE: production
      HOST: 0.0.0.0
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set the initial admin password}
    volumes:
      - platform-data:/app/runtime
volumes:
  platform-data:
