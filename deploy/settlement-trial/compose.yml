services:
  portal:
    image: caddy:2.11.9-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
    restart: unless-stopped
    ports:
      - "443:443/tcp"
    environment:
      SETTLEMENT_TRIAL_A_HASH: ${SETTLEMENT_TRIAL_A_HASH:?missing trial A verifier}
      SETTLEMENT_TRIAL_B_HASH: ${SETTLEMENT_TRIAL_B_HASH:?missing trial B verifier}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./routes.caddy:/etc/caddy/routes.caddy:ro
      - ./site:/srv:ro
      - certificates:/data

volumes:
  certificates:
