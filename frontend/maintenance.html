<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 每 30 秒自动刷新，升级完成后自动恢复 -->
<meta http-equiv="refresh" content="30">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>系统升级维护中 - Royal Regent 华登</title>
<link rel="icon" type="image/png" href="/favicon.png?v=2">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 16px;
    padding: 48px 40px;
    max-width: 480px;
    width: 100%;
    text-align: center;
  }
  .brand { font-size: 15px; font-weight: 600; color: #94a3b8; letter-spacing: 1px; margin-bottom: 28px; }
  .spinner {
    width: 40px; height: 40px; margin: 0 auto 24px;
    border: 3px solid #334155; border-top-color: #3b82f6;
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  h1 { font-size: 22px; font-weight: 600; color: #f1f5f9; margin-bottom: 12px; }
  p { font-size: 14px; color: #94a3b8; line-height: 1.8; }
  .hint { margin-top: 20px; font-size: 12px; color: #64748b; }
</style>
</head>
<body>
  <div class="card">
    <div class="brand">Royal Regent 华登</div>
    <div class="spinner"></div>
    <h1>系统升级维护中</h1>
    <p>平台正在进行版本升级，预计 1-2 分钟内完成。<br>给您带来不便，敬请谅解。</p>
    <p class="hint">本页面每 30 秒自动刷新，升级完成后将自动恢复访问。</p>
  </div>
</body>
</html>
